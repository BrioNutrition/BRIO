.scan-fiche{width:100%;max-width:420px;margin-top:18px;animation:ficheIn .35s cubic-bezier(.2,.8,.3,1) both;}
.scan-fiche[hidden]{display:none;}
@keyframes ficheIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
.fiche-tete{display:flex;align-items:center;gap:14px;}
.fiche-img{width:68px;height:68px;border-radius:16px;object-fit:contain;background:#FFFFFF;flex-shrink:0;}
.fiche-img-vide{display:flex;align-items:center;justify-content:center;font-size:32px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);}
.fiche-noms{flex:1;min-width:0;}
.fiche-nom{font-family:var(--police-titre);font-size:20px;line-height:1.2;color:#FFFFFF;}
.fiche-marque{font-size:13px;color:#B3A9C9;margin-top:4px;}
.fiche-nutriscore{
  flex-shrink:0;width:52px;padding:5px 0 6px;border-radius:12px;text-align:center;
  font-family:var(--police-titre);font-size:22px;line-height:1;color:#FFFFFF;
}
.fiche-nutriscore small{display:block;font-family:var(--police);font-size:8px;font-weight:700;letter-spacing:.02em;margin-bottom:3px;opacity:.9;}
.ns-a{background:#038141;}.ns-b{background:#85BB2F;}.ns-c{background:#FECB02;color:#3A2E00;}.ns-d{background:#EE8100;}.ns-e{background:#E63E11;}
.fiche-desc{font-size:14px;line-height:1.5;color:#D7D1E0;margin:14px 0 0;}
.fiche-sec{font-size:12px;font-weight:700;color:#9C92B6;text-transform:uppercase;letter-spacing:.04em;margin:20px 0 8px;}
.fiche-nutri{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:4px 16px;}
.fn-ligne{display:flex;justify-content:space-between;gap:12px;padding:9px 0;font-size:14px;color:#E9E4F2;border-bottom:1px solid rgba(255,255,255,.08);}
.fn-ligne:last-child{border-bottom:none;}
.fn-ligne b{font-weight:700;color:#FFFFFF;white-space:nowrap;}
.fn-fort span,.fn-fort b{font-size:15px;}
.fn-ligne:has(+ .fn-sous){border-bottom:none;padding-bottom:3px;}
.fn-sous{padding:0 0 9px 14px;font-size:12.5px;color:#A79DBF;}
.fn-sous b{font-weight:600;color:#C9C1DA;}
.fiche-quantites{display:flex;flex-wrap:wrap;gap:8px;}
.fiche-chip{
  padding:9px 14px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#FFFFFF;
}
.fiche-chip.actif{background:#7B4FE0;border-color:#7B4FE0;}
.fiche-saisie{display:flex;align-items:center;gap:8px;margin-top:10px;}
.fiche-saisie input{
  width:120px;padding:11px 14px;border-radius:14px;font-size:16px;font-weight:700;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:#FFFFFF;
}
.fiche-saisie span{font-size:14px;color:#B3A9C9;font-weight:600;}
.fiche-apport{margin-top:16px;padding:16px;border-radius:18px;background:rgba(123,79,224,.16);border:1px solid rgba(185,138,240,.3);}
.fa-titre{font-size:13px;font-weight:700;color:#CDB8F2;}
.fa-kcal{font-family:var(--police-titre);font-size:34px;line-height:1.1;color:#FFFFFF;margin-top:4px;}
.fa-kcal small{font-family:var(--police);font-size:14px;font-weight:700;color:#CDB8F2;margin-left:5px;}
.fa-macros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;}
.fa-m{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px;border-radius:14px;font-size:11px;font-weight:600;color:#D7D1E0;}
.fa-m b{font-family:var(--police-titre);font-weight:700;font-size:16px;}
.fa-prot{background:rgba(169,141,240,.14);} .fa-prot b{color:#A98DF0;}
.fa-carb{background:rgba(169,141,240,.14);} .fa-carb b{color:#A98DF0;}
.fa-fat{background:rgba(169,141,240,.14);} .fa-fat b{color:#A98DF0;}
.fiche-types{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
.fiche-type{
  display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:14px;cursor:pointer;
  font-size:11.5px;font-weight:700;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#E9E4F2;
}
.fiche-type span{font-size:18px;line-height:1;}
.fiche-type.actif{background:#7B4FE0;border-color:#7B4FE0;color:#FFFFFF;}
/* icônes de repas au trait (mêmes dessins que le tableau de bord) dans les boutons de choix */
.repas-prompt-emoji svg{width:26px;height:26px;display:block;}
.photo-type span svg,.fiche-type span svg{width:20px;height:20px;display:block;}
.repas-prompt-emoji,.photo-type span{color:#7B4FE0;}
.fiche-type span{color:#A98DF0;}
html.sombre .repas-prompt-emoji,html.sombre .photo-type span{color:#A98DF0;}
.photo-type.actif span,.fiche-type.actif span,html.sombre .photo-type.actif span{color:#FFFFFF;}
#scanFond .fiche-valider{margin-top:22px;background:#7B4FE0;color:#FFFFFF;border:none;}
#scanFond .fiche-valider:disabled{opacity:.5;}
.fiche-autre{display:block;margin:14px auto 0;background:none;border:none;color:#B3A9C9;font-size:13px;font-weight:600;text-decoration:underline;cursor:pointer;}
.scan-fond.avec-fiche .scan-source{padding-top:22px;}
</style>
<style id="compte-espace">
/* ---------------- Espace compte ----------------
   Les cartes de cet écran sont celles du reste de l'app : on réutilise
   .recap-card telle quelle, et on ne règle ici que ce qui lui manque
   (l'agencement des lignes, l'avatar, les repères du haut). */

/* --- carte d'identité --- */
/* 22 px sous le titre, comme la grille de l'écran Progrès */
.rg-hero{margin-top:22px;padding:24px 18px 18px;text-align:center;}

.rg-avatar-zone{position:relative;width:100px;height:100px;margin:0 auto 14px;}
.rg-avatar{
  position:relative;width:100px;height:100px;padding:0;border:none;background:none;
  border-radius:50%;cursor:pointer;display:block;
  -webkit-tap-highlight-color:transparent;
  transition:transform .18s cubic-bezier(.34,1.4,.64,1);
}
.rg-avatar:active{transform:scale(.95);}
/* l'anneau reprend le verre des cartes, au lieu d'un dégradé à lui */
.rg-avatar-anneau{
  position:absolute;inset:0;border-radius:50%;
  background:rgba(255,255,255,.45);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border:1px solid rgba(255,255,255,.7);
}
html.sombre .rg-avatar-anneau{background:rgba(46,37,72,.595);border-color:rgba(255,255,255,.112);}
.rg-avatar-disque{
  position:absolute;inset:5px;border-radius:50%;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  background:#7B4FE0;
}
.rg-avatar-disque img{width:100%;height:100%;object-fit:cover;display:block;}
.rg-avatar-initiale{font-family:var(--police-titre);font-size:38px;color:#fff;line-height:1;}
.rg-avatar-badge{
  position:absolute;right:0;bottom:0;width:32px;height:32px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.45);
  backdrop-filter:blur(14px) saturate(170%);-webkit-backdrop-filter:blur(14px) saturate(170%);
  border:1px solid rgba(255,255,255,.7);
  color:#6B3FC4;
}
.rg-avatar-badge svg{width:16px;height:16px;}
html.sombre .rg-avatar-badge{
  background:rgba(46,37,72,.595);border-color:rgba(255,255,255,.112);color:#C0A6FF;
}
.rg-avatar-charge{
  position:absolute;inset:5px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:rgba(28,23,48,.45);color:#fff;font-size:11.5px;font-weight:700;
}

.rg-hero-nom{font-family:var(--police-titre);font-size:24px;line-height:1.15;color:#1C1730;margin:0;}
html.sombre .rg-hero-nom{color:#EDECF4;}

/* les trois repères : même verre teinté que les macros du récapitulatif */
.rg-hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:18px;}
.rg-stat{
  border-radius:18px;padding:12px 6px;border:none;
  background:rgba(123,79,224,.14);
  backdrop-filter:blur(12px) saturate(170%);-webkit-backdrop-filter:blur(12px) saturate(170%);
}
html.sombre .rg-stat{background:rgba(169,141,240,.16);}
.rg-stat b{display:block;font-family:var(--police-titre);font-size:18px;line-height:1.1;color:#1C1730;}
.rg-stat span{display:block;font-size:10.5px;color:#8A82A0;margin-top:3px;}
html.sombre .rg-stat b{color:#EDECF4;}
html.sombre .rg-stat span{color:#AAA5B7;}

/* --- sections --- */
.rg-section{margin-top:22px;}
.rg-section-titre{
  font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  color:#8A82A0;margin:0 0 9px 6px;
}
html.sombre .rg-section-titre{color:#9C95AE;}
/* une carte qui n'empile que des lignes se resserre : chaque ligne a déjà sa
   propre respiration verticale */
.rg-carte{padding:4px 16px;}

/* --- lignes --- */
.rg-ligne{
  display:flex;align-items:center;gap:13px;width:100%;
  padding:13px 0;border:none;background:none;text-align:left;
  border-bottom:1px solid rgba(28,23,48,.08);
  font-family:var(--police);color:#1C1730;
}
html.sombre .rg-ligne{border-bottom-color:rgba(255,255,255,.09);color:#EDECF4;}
.rg-ligne:last-child{border-bottom:none;}
button.rg-ligne{cursor:pointer;-webkit-tap-highlight-color:transparent;transition:opacity .15s ease;}
button.rg-ligne:active{opacity:.55;}
.rg-ico{
  width:34px;height:34px;flex-shrink:0;border-radius:11px;
  display:flex;align-items:center;justify-content:center;color:#6B3FC4;
  background:rgba(123,79,224,.14);
}
.rg-ico svg{width:18px;height:18px;}
html.sombre .rg-ico{color:#C0A6FF;background:rgba(169,141,240,.16);}
.rg-ico.danger{color:#C62A2F;background:rgba(198,42,47,.11);}
html.sombre .rg-ico.danger{color:#E48184;background:rgba(228,129,132,.14);}
.rg-txt{flex:1;min-width:0;}
.rg-txt b{display:block;font-size:14.5px;font-weight:700;line-height:1.25;}
.rg-txt span{display:block;font-size:12px;color:#8A82A0;margin-top:2px;line-height:1.35;}
html.sombre .rg-txt span{color:#AAA5B7;}
.rg-val{
  font-size:13px;font-weight:700;color:#1C1730;text-align:right;flex-shrink:0;
  max-width:52%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
html.sombre .rg-val{color:#EDECF4;}
.rg-chev{width:16px;height:16px;flex-shrink:0;color:#B3A9C9;}
html.sombre .rg-chev{color:#8B84A0;}
.rg-ligne.danger .rg-txt b{color:#C62A2F;}
html.sombre .rg-ligne.danger .rg-txt b{color:#E48184;}

/* --- objectifs : les champs de saisie de l'app, sur deux colonnes --- */
.rg-champs{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.rg-champs .field{margin-bottom:0;}
.rg-champs .field.large{grid-column:1 / -1;}
/* le bouton n'apparaît qu'une fois une valeur changée : sans ça, il invite à
   enregistrer ce qui est déjà enregistré */
.rg-enregistrer{margin-top:16px;}

/* --- interrupteur --- */
.rg-switch{
  appearance:none;-webkit-appearance:none;flex-shrink:0;margin:0;
  width:50px;height:30px;border-radius:999px;position:relative;cursor:pointer;
  background:#DCD5EC;transition:background .2s ease;
}
.rg-switch::after{
  content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;
  background:#FFFFFF;box-shadow:0 2px 5px rgba(28,23,48,.2);
  transition:transform .22s cubic-bezier(.34,1.4,.64,1);
}
.rg-switch:checked{background:#7B4FE0;}
.rg-switch:checked::after{transform:translateX(20px);}
.rg-switch:focus-visible{outline:3px solid rgba(123,79,224,.45);outline-offset:2px;}
html.sombre .rg-switch{background:rgba(255,255,255,.16);}
html.sombre .rg-switch::after{background:#FFFFFF;box-shadow:0 2px 5px rgba(0,0,0,.35);}

.rg-version{text-align:center;font-size:11px;color:#8A82A0;margin:22px 0 0;}
html.sombre .rg-version{color:#7E7691;}

/* --- petites fenêtres : photo de profil, pseudo --- */
.rg-fenetre-fond{
  position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:24px;
  background:rgba(28,23,48,.42);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  animation:sheetFadeIn .2s ease;transition:opacity .18s ease;
}
html.sombre .rg-fenetre-fond{background:rgba(10,6,20,.62);}
.rg-fenetre-fond.sortie{opacity:0;}
.rg-fenetre{
  width:100%;max-width:320px;margin-bottom:0;text-align:left;
  font-family:var(--police);
  animation:confirmPop .22s cubic-bezier(.34,1.56,.64,1);
}
.rg-fenetre-liste{padding:4px 16px 14px;}
.rg-fenetre-titre{
  font-family:var(--police-titre);font-size:16px;color:#1C1730;
  padding:12px 2px 8px;text-align:center;
}
html.sombre .rg-fenetre-titre{color:#EDECF4;}
.rg-fenetre .rg-ligne:last-child{border-bottom:none;}
/* Une fenêtre est posée sur <body>, donc hors du conteneur qui porte
   .repas-theme : elle n'hérite ni des champs ni des boutons de l'app. On les
   lui redonne ici, à l'identique, pour qu'elle en ait l'air. */
.rg-fenetre .field label{color:#8A82A0;}
.rg-fenetre .field input{border-color:#DCC6F2;background:rgba(255,255,255,.55);color:#1C1730;}
.rg-fenetre .field input:focus{border-color:#7B4FE0;background:#fff;box-shadow:0 0 0 3px rgba(123,79,224,.16);}
.rg-fenetre .btn-primary{background:#7B4FE0;color:#fff;}
/* « html.sombre .btn-primary » pèse une classe de plus que le sélecteur
   ci-dessus : sans ce jumeau, le bouton repasserait en blanc la nuit. */
html.sombre .rg-fenetre .btn-primary{background:#7B4FE0;color:#fff;}
html.sombre .rg-fenetre .field label{color:#AAA5B7;}
html.sombre .rg-fenetre .field input{border-color:#47335B;background:rgba(46,37,72,.705);color:#EDECF4;}
html.sombre .rg-fenetre .field input:focus{border-color:#7B4FE0;background:#2E2548;box-shadow:0 0 0 3px rgba(0,0,0,.208);}

.rg-fenetre-annuler{
  width:100%;margin-top:10px;border:none;border-radius:999px;padding:12px;
  font-family:var(--police);font-size:14px;font-weight:700;cursor:pointer;
  background:rgba(123,79,224,.13);color:#6B3FC4;
}
html.sombre .rg-fenetre-annuler{background:rgba(169,141,240,.16);color:#C0A6FF;}
@media (prefers-reduced-motion: reduce){ .rg-fenetre-fond,.rg-fenetre{animation:none;} }

@media (max-width:360px){
  .rg-champs{grid-template-columns:1fr;}
  .rg-hero-stats{gap:6px;}
  .rg-stat b{font-size:16px;}
}
</style>
</head>

// Place la pastille exactement sous l'onglet actif, au pixel près (même largeur,
// même position), plutôt que par un pourcentage approximatif.
function placerPastille(slider, item){
  const nav = slider.parentElement;
  const x = item.getBoundingClientRect().left - nav.getBoundingClientRect().left - nav.clientLeft;
  slider.style.transition = 'none';
  slider.style.left = '0';
  slider.style.width = item.getBoundingClientRect().width + 'px';
  slider.style.transform = `translateX(${x}px)`;
  return x;
}
// si l'écran change de taille (rotation), la pastille se recale
window.addEventListener('resize', () => {
  const slider = document.getElementById('navSlider');
  const actif = document.querySelector('.nav-item.active');
  if (slider && actif) state.prevNavX = placerPastille(slider, actif);
});

function bindBottomNav(activeId){
  const slider = document.getElementById('navSlider');
  const activeIndex = navPlace(NAV_ITEMS.findIndex(i=>i.id===activeId));
  const actif = app.querySelector('.nav-item.active');
  if (slider && actif){
    const cible = placerPastille(slider, actif);
    const depart = state.prevNavX;
    if (depart != null && Math.abs(depart - cible) > 0.5){
      // Petit rebond de la même amplitude quel que soit le trajet : la
      // pastille dépasse de 5 px puis revient se caler sous l'onglet. Ces
      // 5 px restent dans la marge intérieure de la barre (10 px), même vers
      // les onglets du bord : elle ne sort jamais du menu.
      const sens = cible > depart ? 1 : -1;
      const ecart = Math.abs(activeIndex - (state.prevNavIndex ?? activeIndex));
      if (slider.getAnimations) slider.getAnimations().forEach(an => an.cancel());
      if (slider.animate){
        slider.animate([
          { transform:`translateX(${depart}px)`, easing:'cubic-bezier(.3,.75,.4,1)' },
          { transform:`translateX(${cible + sens*5}px)`, offset:.68, easing:'ease-in-out' },
          { transform:`translateX(${cible - sens*1.5}px)`, offset:.86, easing:'ease-in-out' },
          { transform:`translateX(${cible}px)` },
        ], { duration: 380 + Math.min(ecart, 4) * 35 });
      }
    }
    state.prevNavX = cible;
  }
  state.prevNavIndex = activeIndex;

  const plus = document.getElementById('navPlus');
  if (plus) plus.onclick = ouvrirPhotoRepas;

  app.querySelectorAll('.nav-item').forEach(btn=>{
    btn.onclick = () => {
      const tab = btn.dataset.tab;
      const sameTab = state.screen === tab || (tab === 'category' && state.screen === 'category');

      // Sur l'onglet courant, on ne rejoue rien sauf s'il y a vraiment
      // quelque chose à refermer (édition du poids, sous-vue ouverte).
      let aRefermer = false;
      if (state.editingWeight){
        state.editingWeight = false;
        state.typingWeight = false;
        aRefermer = true;
      }
      if (tab === 'category' && state.openCat !== 'repas') aRefermer = true;
      if (tab === 'recettes' && state.menuCat){
        state.menuCat = null;
        state.menuPick = null;
        aRefermer = true;
      }
      if (sameTab && !aRefermer) return;

      navFade = !sameTab;
      if (tab === 'category'){ state.screen = 'category'; state.openCat = 'repas'; }
      else state.screen = tab;
      render();
    };
  });
}

function objectifDef(id){
  return OBJECTIFS.find(o => o.id === id) || OBJECTIFS[5];
}

function bfLevelsFor(sexe){
  return BF_LEVELS[sexe] || BF_LEVELS.Homme;
}

// Fraction de masse grasse : valeur saisie si elle existe, sinon le repère choisi.
function bodyFatFraction(d){
  const exact = parseFloat(d.bfExact);
  if (isFinite(exact) && exact >= 3 && exact <= 70) return exact / 100;
  const found = bfLevelsFor(d.sexe).find(l => l.id === d.composition);
  if (found) return found.bf;
  return null;
}

// Métabolisme de base. Katch-McArdle si on connaît la composition
// (plus juste car basé sur la masse maigre), sinon Mifflin-St Jeor.
function computeBMR(d){
  const w = parseFloat(d.poids) || 70;
  const h = parseFloat(d.taille) || 170;
  const age = parseFloat(d.age) || 30;
  const bf = bodyFatFraction(d);
  if (bf != null){
    const lbm = w * (1 - bf);
    return 370 + 21.6 * lbm;
  }
  const sexOffset = d.sexe === 'Homme' ? 5 : d.sexe === 'Femme' ? -161 : -78;
  return 10*w + 6.25*h - 5*age + sexOffset;
}

function trainingSessions(d){
  const f = TRAINING_FREQS.find(t => t.id === d.entrainementFreq);
  return f ? f.sessions : 0;
}

// Facteur d'activité = vie courante + coût des séances de sport.
function activityFactor(d){
  const neat = NEAT_LEVELS.find(l => l.id === d.activite);
  // anciens profils : 'Modéré' et 'Actif' de la première version
  let f = neat ? neat.factor : ({ 'Modéré':1.30, 'Actif':1.42 }[d.activite] || 1.25);
  const s = trainingSessions(d);
  f += s * 0.03;
  if (d.entrainementType === 'Cardio') f += s * 0.008;
  return Math.min(1.95, f);
}

function computeTDEE(d){
  return Math.round(computeBMR(d) * activityFactor(d));
}

function leanBodyMass(d){
  const w = parseFloat(d.poids) || 70;
  const bf = bodyFatFraction(d);
  return bf != null ? w * (1 - bf) : w * 0.78;
}

// Poids conseillé à l'étape « Ton cap ». On raisonne d'abord sur la masse
// maigre : c'est elle qu'on veut préserver, le poids n'est que la conséquence.
// L'IMC ne sert que de garde-fou, il ne distingue pas muscle et gras.
// Un poids s'affiche toujours avec une décimale : « 68.0 kg », jamais « 68 kg ».
const fmtKg = v => (Math.round(v * 10) / 10).toFixed(1);

function poidsConseille(d){
  const poids = parseFloat(d.poids) || 70;
  const tailleM = (parseFloat(d.taille) || 170) / 100;
  const bf = bodyFatFraction(d);
  const lbm = leanBodyMass(d);
  const { tdee, cal } = calorieTarget(d);
  const rate = weeklyRateKg(cal, tdee);
  const arrondi = v => Math.round(v * 2) / 2;

  const imcMin = 18.5 * tailleM * tailleM;
  const imcMax = 25 * tailleM * tailleM;
  const bfCible = d.sexe === 'Femme' ? 0.24 : d.sexe === 'Homme' ? 0.15 : 0.195;

  // Perte
  if (rate < -0.02){
    let vise = bf != null && bf > bfCible ? lbm / (1 - bfCible) : poids * 0.9;
    vise = Math.min(Math.max(vise, imcMin), poids);
    // On ne propose pas plus de 10 % d'écart d'un coup : au-delà, c'est un cap
    // lointain qui décourage plus qu'il ne motive.
    const palier = arrondi(Math.max(vise, poids * 0.9));
    const lointain = arrondi(vise) < palier - 0.4 ? arrondi(vise) : null;
    return {
      cible: palier,
      lointain,
      raison: bf != null
        ? `Ta masse maigre est estimée à ${lbm.toFixed(1)} kg. En la préservant et en descendant vers ${Math.round(bfCible * 100)} % de masse grasse, tu serais autour de ${fmtKg(vise)} kg.`
        : `Sans estimation de ta composition, on part sur la référence la plus documentée : viser environ 10 % sous ton poids de départ.`,
      rate,
    };
  }

  // Prise
  if (rate > 0.02){
    const plafond = Math.max(imcMax, poids * 1.02);
    const vise = arrondi(Math.min(poids * 1.07, plafond));
    return {
      cible: Math.max(vise, arrondi(poids + 1)),
      lointain: null,
      raison: `Une prise de 5 à 8 % du poids de corps sur plusieurs mois est ce qui limite le mieux la part de gras dans les kilos gagnés.`,
      rate,
    };
  }

  // Poids stable
  return {
    cible: arrondi(poids),
    lointain: null,
    raison: `Ton objectif vise un poids stable : la balance bougera peu, c'est la composition qui change. Garde ton poids actuel comme cap.`,
    rate,
  };
}

function paceIndex(d){
  const o = objectifDef(d.objectif);
  const i = parseInt(d.rythme, 10);
  if (isFinite(i) && i >= 0 && i < o.paces.length) return i;
  return Math.min(1, o.paces.length - 1);
}

// Plancher de sécurité : jamais très en dessous du métabolisme de base.
function calorieFloor(d){
  const abs = d.sexe === 'Femme' ? 1200 : d.sexe === 'Homme' ? 1500 : 1350;
  return Math.max(abs, Math.round(computeBMR(d) * 0.9));
}

function calorieTarget(d){
  const tdee = computeTDEE(d);
  const o = objectifDef(d.objectif);
  const pace = o.paces[paceIndex(d)];
  const floor = calorieFloor(d);
  const raw = tdee * (1 + pace.delta);
  const cal = Math.max(floor, Math.round(raw / 10) * 10);
  return { tdee, cal, pace, floored: raw < floor - 5 };
}

// Rythme attendu, à partir de l'écart calorique réel (7700 kcal ≈ 1 kg).
function weeklyRateKg(cal, tdee){
  return ((cal - tdee) * 7) / 7700;
}

function formatRateKg(kg){
  const abs = Math.abs(kg);
  if (abs < 0.05) return 'poids stable';
  const txt = abs.toFixed(2).replace('.', ',').replace(/0$/, '').replace(/,$/, '');
  return `${kg > 0 ? '+' : '−'}${txt} kg / semaine`;
}

function computeGoals(d){
  const { tdee, cal } = calorieTarget(d);
  const w = parseFloat(d.poids) || 70;
  const o = objectifDef(d.objectif);
  const lbm = leanBodyMass(d);

  // Protéines calées sur la masse maigre, avec un garde-fou sur le poids total.
  let proteines = Math.round(lbm * o.protLbm);
  proteines = Math.min(proteines, Math.round(w * 2.6));
  proteines = Math.max(proteines, Math.round(w * 1.2));

  // Lipides : jamais sous ~0,8 g/kg, sinon un pourcentage des calories.
  const fatRatio = d.entrainementType === 'Cardio' ? o.fatRatio - 0.03 : o.fatRatio;
  let lipides = Math.round(Math.max(w * 0.8, (cal * fatRatio) / 9));

  let glucides = Math.round((cal - proteines * 4 - lipides * 9) / 4);
  if (glucides < 80){
    // on rogne sur les lipides avant de toucher aux protéines
    lipides = Math.max(Math.round(w * 0.65), Math.round((cal - proteines * 4 - 80 * 4) / 9));
    glucides = Math.round((cal - proteines * 4 - lipides * 9) / 4);
  }

  return {
    calories: cal,
    proteines,
    glucides: Math.max(0, glucides),
    lipides: Math.max(0, lipides),
    tdee,
  };
}

// Besoin en eau : base au poids, majorée par l'activité, les séances et l'objectif.
function computeWaterGoal(poids, activite, objectif, entrainementFreq){
  const w = parseFloat(poids) || 70;
  let ml = w * 33;
  const neat = NEAT_LEVELS.find(l => l.id === activite);
  ml += neat ? (neat.factor - 1.20) * 1800 : ({ 'Modéré':350, 'Actif':700 }[activite] ?? 250);
  const freq = TRAINING_FREQS.find(t => t.id === entrainementFreq);
  if (freq) ml += freq.sessions * 90;
  if (objectif === 'Perte de poids' || objectif === 'Sèche') ml += 250;
  ml = Math.round(ml / 100) * 100;
  return Math.max(1200, Math.min(4000, ml));
}

function hydrationGoalMl(){
  return computeWaterGoal(state.body.poids, state.body.activite, state.body.objectif, state.body.entrainementFreq);
}

function formatMl(n){
  return Math.round(n).toLocaleString('fr-FR');
}

function formatLitres(ml){
  const l = ml / 1000;
  const txt = (Math.round(l * 10) / 10).toLocaleString('fr-FR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  return txt.replace(/,0$/, '') + ' L';
}

function waterWidthCss(ml, goal){
  if (ml >= goal) return 'calc(100% + 26px)'; // la vague continue hors de la carte
  const pct = Math.max(0, (ml / goal) * 100);
  return pct + '%';
}

function hydrationSubText(ml, goal){
  if (ml >= goal) return 'Objectif atteint 🎉';
  if (ml === 0) return `Objectif du jour : ${formatMl(goal)} ml`;
  return `Encore ${formatMl(goal - ml)} ml`;
}

  // navigation, sinon l'app enverrait sur l'écran de connexion habituel.
  const lien = nuage.actif() ? nuage.lireLienReinit() : null;

    } else {

      } catch(e){
        state.compteMode = 'oubli';

    }
    render();
    return;
  }

  await routerDemarrage();
}

/* Où envoyer l'utilisateur au lancement, ou juste après sa connexion. */
async function routerDemarrage(){
  const profilComplet = !!(state.userName && state.macroGoals);

  // Un compte existe mais personne n'est connecté : écran de connexion.
  if (state.compte && !state.connecte){
    ouvrirCompte('connexion');
    return;
  }
  // Un profil existe déjà mais pas encore de compte : on propose d'en créer un
  // pour garder ce suivi (le prénom est déjà rempli).
  if (!state.compte && profilComplet){
    ouvrirCompte('inscription');
    return;
  }

  if (!state.userName || !state.macroGoals){
    state.screen = state.compte ? 'onboarding' : 'intro';
    state.onboardingData = { prenom: state.userName || (state.compte && state.compte.prenom) || '' };
    // le prénom est déjà connu grâce au compte : on passe directement à la suite
    state.onboardingStep = state.onboardingData.prenom && state.compte ? 2 : 1;

    // questionnaire interrompu : on rouvre là où il s'est arrêté
    try {
      const r = await window.storage.get('onboarding-progress', true);
      const p = r ? JSON.parse(r.value) : null;
      if (p && p.step > 1){
        state.onboardingStep = p.step;
        state.onboardingData = p.data || state.onboardingData;
        state.showBfExact = !!p.showBfExact;
        state.screen = 'onboarding';
      }
    } catch(e){}
  } else {
    state.screen = 'category';
    state.openCat = 'repas';
    // Profil déjà complet : l'accueil a forcément déjà été vu, on pose le
    // marqueur pour les installations antérieures à sa mise en place.
    state.welcomeSeen = true;
    try {
      await window.storage.get('welcome-seen', true);
    } catch(e){
      try { await window.storage.set('welcome-seen', '1', true); } catch(e2){}
    }
  }

  render();
}

function initials(name){ return (name||'?').trim().slice(0,1).toUpperCase(); }

function weekDates(offsetWeeks){
  offsetWeeks = offsetWeeks || 0;
  const now = new Date();
  const dow = now.getDay(); // 0=dim..6=sam
  const mondayOffset = dow === 0 ? -6 : 1 - dow;
  const monday = new Date(now);
  monday.setDate(now.getDate() + mondayOffset + offsetWeeks * 7);
  const arr = [];
  for (let i=0;i<7;i++){
    const d = new Date(monday);
    d.setDate(monday.getDate()+i);
    arr.push(d);
  }
  return arr;
}
function dateKey(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function dayLetterFR(d){
  return ['D','L','M','M','J','V','S'][d.getDay()];
}

function formatFullDateFR(d){
  const days = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
  const months = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
  return `${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]}`;
}

  const d = state.onboardingData;
  const steps = ['prenom','sexe','mesures','composition','activite','entrainement','objectif'];
  if (d.objectif && d.objectif !== 'Maintien') steps.push('rythme');

  return steps;
}

      const semaines = Math.round(Math.abs(ecart / conseil.rate));
      delai = semaines <= 1 ? "en moins d'une semaine"
        : semaines < 9 ? `en environ ${semaines} semaines`
        : `en environ ${Math.round(semaines / 4.3)} mois`;
    }

    title = '🗻 Ton cap';
    stepHtml = `
      <p class="onboard-q">Quel poids veux-tu viser ?</p>

      <div class="conseil-card">
        <div class="conseil-head">
          <span class="conseil-lab">Notre conseil</span>
          <span class="conseil-val">${fmtKg(conseil.cible)}<span class="conseil-unit">kg</span></span>
        </div>
        <p class="conseil-why">${conseil.raison}${delai ? ` À ton rythme, ce cap est atteignable ${delai}.` : ''}</p>
        ${conseil.lointain ? `<p class="conseil-why">Sur le long terme tu pourrais viser ${fmtKg(conseil.lointain)} kg, mais mieux vaut valider ce premier palier d'abord.</p>` : ''}
        <button class="conseil-use" id="ob_use_conseil">Utiliser ${fmtKg(conseil.cible)} kg</button>
      </div>

      <div class="field ${obErr('poidsObjectif')}"><label>Poids objectif (kg)</label><input id="ob_poids_objectif" type="number" step="0.1" placeholder="${fmtKg(conseil.cible)}" value="${d.poidsObjectif||''}"></div>
      <p class="onboard-hint">Ce chiffre n'est qu'un repère : tu pourras le changer quand tu veux dans les réglages.</p>
      <button class="btn-primary" id="ob_next" ${d.poidsObjectif ? '' : 'disabled'}>Voir mon programme</button>`;

  } else if (key === 'recap'){
    title = '📅 Ton programme';
    const goals = computeGoals(d);
    const { tdee, cal, floored } = calorieTarget(d);
    const rate = weeklyRateKg(cal, tdee);
    const o = objectifDef(d.objectif);
    const water = computeWaterGoal(d.poids, d.activite, d.objectif, d.entrainementFreq);
    const bf = bodyFatFraction(d);
    const lbm = leanBodyMass(d);
    const poids = parseFloat(d.poids) || 70;
    const cible = parseFloat(d.poidsObjectif);

    let duree = '';
    if (isFinite(cible) && Math.abs(rate) >= 0.05){
      const ecart = cible - poids;
      if (ecart !== 0 && Math.sign(ecart) === Math.sign(rate)){
        const semaines = Math.round(Math.abs(ecart / rate));
        duree = semaines <= 1 ? 'moins d\'une semaine'
          : semaines < 9 ? `environ ${semaines} semaines`
          : `environ ${Math.round(semaines / 4.3)} mois`;
      }
    }

    stepHtml = `
      <p class="onboard-q">Voici ce qu'on va viser chaque jour. Rien n'est figé, tu pourras tout modifier.</p>

      <div class="recap-card">
        <div class="recap-kcal-row">
          <span class="recap-kcal">${goals.calories}</span>
          <span class="recap-kcal-unit">kcal / jour</span>
        </div>
        <div class="recap-note">
          Maintien estimé à <strong>${tdee} kcal</strong> · ${o.label.toLowerCase()} · <strong>${formatRateKg(rate)}</strong>
        </div>
        <div class="recap-macros">
          <div class="recap-macro m-prot"><div class="recap-macro-val">${goals.proteines} g</div><div class="recap-macro-lab">⚡ Protéines</div></div>
          <div class="recap-macro m-carb"><div class="recap-macro-val">${goals.glucides} g</div><div class="recap-macro-lab">🌿 Glucides</div></div>
          <div class="recap-macro m-fat"><div class="recap-macro-val">${goals.lipides} g</div><div class="recap-macro-lab">🫒 Lipides</div></div>
        </div>
        ${floored ? `<div class="recap-warn">On a relevé ta cible pour rester au-dessus de ton métabolisme de base. Descendre plus bas ferait surtout perdre du muscle.</div>` : ''}
      </div>

      <div class="recap-card">
        <div class="recap-line"><span class="recap-line-lab">Masse maigre estimée</span><span class="recap-line-val">${lbm.toFixed(1)} kg${bf != null ? ` · ${Math.round(bf*100)} % de gras` : ''}</span></div>
        <div class="recap-line"><span class="recap-line-lab">Protéines</span><span class="recap-line-val">${(goals.proteines / lbm).toFixed(1)} g / kg de masse maigre</span></div>
        <div class="recap-line"><span class="recap-line-lab">Hydratation</span><span class="recap-line-val">${formatLitres(water)} par jour</span></div>
        ${duree ? `<div class="recap-line"><span class="recap-line-lab">Pour atteindre ${cible} kg</span><span class="recap-line-val">${duree}</span></div>` : ''}
      </div>

      <button class="btn-primary" id="ob_next">C'est parti</button>`;
  }

  app.innerHTML = `
    <div class="setup-card">
      ${APP_LOGO}
      <div class="onboard-top">
        <button class="onboard-back${step > 1 ? '' : ' is-placeholder'}" ${step > 1 ? 'id="obBack"' : 'aria-hidden="true" tabindex="-1"'} aria-label="Étape précédente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"/></svg>Retour</button>
        <div>
          <div class="onboard-step-count">Étape ${step} sur ${steps.length}</div>
          <div class="onboard-bar"><div class="onboard-bar-fill" style="width:${(step / steps.length) * 100}%"></div></div>
        </div>
      </div>
      <div class="onboard-step-body ${state.obNoAnim ? '' : (state.onboardDir === 'back' ? 'ob-anim-back' : 'ob-anim-fwd')}">
        <h1>${title}</h1>
        ${stepHtml}
      </div>
    </div>
  `;

  // La barre glisse depuis la position de l'étape précédente au lieu d'apparaître d'un coup.
  state.obNoAnim = false;
  sauverProgression();

  const barFill = app.querySelector('.onboard-bar-fill');
  if (barFill){
    const pct = (step / steps.length) * 100;
    const from = state.obBarPct == null ? pct : state.obBarPct;
    barFill.style.width = from + '%';
    requestAnimationFrame(() => { barFill.style.width = pct + '%'; });
    state.obBarPct = pct;
  }

  const backBtn = document.getElementById('obBack');
  if (backBtn) backBtn.onclick = () => {
    state.onboardingStep--;
    state.showBfExact = false;
    state.computingPlan = false;
    state.obErrors = [];
    state.onboardDir = 'back';
    render();
  };

  app.querySelectorAll('.onboard-opt').forEach(btn=>{
    btn.onclick = () => {
      const field = btn.dataset.field;
      state.onboardingData[field] = btn.dataset.value;
      state.onboardDir = 'fwd';
      // changer d'objectif invalide le rythme précédemment choisi
      if (field === 'objectif') state.onboardingData.rythme = null;
      // choisir un repère de silhouette efface une saisie manuelle de % de gras
      if (field === 'composition') state.onboardingData.bfExact = '';
      if (btn.dataset.stay){ state.obNoAnim = true; render(); return; }
      if (field === 'entrainementType'){ state.obNoAnim = true; render(); return; }
      if (field === 'composition' && state.showBfExact){ state.obNoAnim = true; render(); return; }
      advanceOnboarding();
    };
  });

  const bfToggle = document.getElementById('ob_bf_toggle');
  if (bfToggle) bfToggle.onclick = () => { state.showBfExact = true; state.obNoAnim = true; render(); };

  // Sans estimation de silhouette, le calcul bascule sur une formule qui ne
  // demande que le poids, la taille et l'âge.
  const bfSkip = document.getElementById('ob_bf_skip');
  if (bfSkip) bfSkip.onclick = () => {
    delete state.onboardingData.composition;
    delete state.onboardingData.bfExact;
    state.showBfExact = false;
    state.onboardDir = 'fwd';
    advanceOnboarding();
  };

  // Le liseré rouge disparaît dès que l'utilisateur corrige le champ.
  const CHAMPS_ETAPE = {
    ob_prenom:'prenom', ob_age:'age', ob_poids:'poids', ob_taille:'taille',
    ob_bf_exact:'bfExact', ob_poids_objectif:'poidsObjectif',
  };
  app.querySelectorAll('.field input').forEach(input => {
    input.addEventListener('input', () => {
      const champ = CHAMPS_ETAPE[input.id];
      if (champ){ state.onboardingData[champ] = input.value.trim(); sauverProgression(); }
      const wrap = input.closest('.field');
      if (wrap) wrap.classList.remove('field-error');
      const cible = document.getElementById('ob_poids_objectif');
      if (cible && nextBtn) nextBtn.disabled = !cible.value.trim();
    });
  });

  const useConseil = document.getElementById('ob_use_conseil');
  if (useConseil) useConseil.onclick = () => {
    const champ = document.getElementById('ob_poids_objectif');
    const valeur = useConseil.textContent.replace(/[^\d.,]/g, '').replace(',', '.');
    if (champ){
      champ.value = valeur;
      champ.closest('.field').classList.remove('field-error');
    }
    const btn = document.getElementById('ob_next');
    if (btn) btn.disabled = false;
  };

  const nextBtn = document.getElementById('ob_next');
  if (nextBtn){
    nextBtn.onclick = () => {
      state.onboardDir = 'fwd';
      if (key === 'prenom'){
        const prenom = document.getElementById('ob_prenom').value.trim();
        if (!prenom){
          state.obErrors = ['prenom'];
          state.obNoAnim = true;
          render();
          showToast('Indique ton prénom');
          return;
        }
        state.onboardingData.prenom = prenom;
        advanceOnboarding();
        return;
      }
      if (key === 'mesures'){
        const age = document.getElementById('ob_age').value.trim();
        const poids = document.getElementById('ob_poids').value.trim();
        const taille = document.getElementById('ob_taille').value.trim();
        if (!age || !poids || !taille){
          state.obErrors = [];
          if (!age) state.obErrors.push('age');
          if (!poids) state.obErrors.push('poids');
          if (!taille) state.obErrors.push('taille');
          state.onboardingData.age = age;
          state.onboardingData.poids = poids;
          state.onboardingData.taille = taille;
          state.obNoAnim = true;
          render();
          showToast('Remplis les 3 champs');
          return;
        }
        state.onboardingData.age = age;
        state.onboardingData.poids = poids;
        state.onboardingData.taille = taille;
        advanceOnboarding();
        return;
      }
      if (key === 'composition'){
        const bf = document.getElementById('ob_bf');
        if (bf){
          const v = parseFloat(bf.value);
          if (bf.value.trim() && (!isFinite(v) || v < 3 || v > 70)){ showToast('Un pourcentage entre 3 et 70'); return; }
          state.onboardingData.bfExact = bf.value.trim();
        }
        if (!state.onboardingData.composition && !state.onboardingData.bfExact){
          showToast('Choisis une silhouette ou indique ton %'); return;
        }
        state.showBfExact = false;
        advanceOnboarding();
        return;
      }
      if (key === 'entrainement'){
        if (!state.onboardingData.entrainementFreq || !state.onboardingData.entrainementType){
          showToast('Complète les deux réponses'); return;
        }
        advanceOnboarding();
        return;
      }
      if (key === 'poidsObjectif'){
        const cible = document.getElementById('ob_poids_objectif').value.trim();
        if (!cible){
          state.obErrors = ['poidsObjectif'];
          state.obNoAnim = true;
          render();
          showToast('Indique ton poids objectif');
          return;
        }
        state.onboardingData.poidsObjectif = cible;
        state.computingPlan = true;
        advanceOnboarding();
        return;
      }
      advanceOnboarding();
    };
  }
}

async function advanceOnboarding(){
  const steps = onboardingSteps();
  if (state.onboardingStep < steps.length){
    state.onboardingStep++;
    state.showBfExact = false;
    state.obErrors = [];
    render();
    return;
  }

  const d = state.onboardingData;
  const goals = computeGoals(d);
  state.macroGoals = goals;
  try {
    await window.storage.set('goals', JSON.stringify(goals), true);
  } catch(e){ showToast('Erreur de sauvegarde'); }

  if (d.prenom){
    state.userName = d.prenom;
    try {
      await window.storage.set('user-name', state.userName, true);
    } catch(e){}
  }

  state.body = {
    sexe: d.sexe || null,
    age: parseFloat(d.age) || null,
    poids: parseFloat(d.poids) || null,
    taille: parseFloat(d.taille) || null,
    poidsObjectif: parseFloat(d.poidsObjectif) || null,
    poidsDepart: parseFloat(d.poids) || null,
    composition: d.composition || null,
    bfExact: d.bfExact || null,
    activite: d.activite || null,
    entrainementFreq: d.entrainementFreq || null,
    entrainementType: d.entrainementType || null,
    objectif: d.objectif || null,
    rythme: d.rythme != null ? String(paceIndex(d)) : null,
  };
  try {
    await window.storage.set('body', JSON.stringify(state.body), true);
  } catch(e){}

  if (state.body.poids && !Object.keys(state.weightHistory).length){
    state.weightHistory = { [todayKey()]: state.body.poids };
    try {
      await window.storage.set('weight-history', JSON.stringify(state.weightHistory), true);
    } catch(e){}
  }

  oublierProgression('onboarding-progress');

  // L'écran de bienvenue n'a de sens qu'à la toute première fin de
  // questionnaire. Quand on le refait depuis les réglages, on va droit
  // au tableau de bord.
  let dejaVu = state.welcomeSeen;
  if (!dejaVu){
    try {
      const r = await window.storage.get('welcome-seen', true);
      dejaVu = !!r;
    } catch(e){ dejaVu = false; }
  }

  if (dejaVu){
    state.screen = 'category';
    state.openCat = 'repas';
    render();
    return;
  }

  state.welcomeSeen = true;
  try { await window.storage.set('welcome-seen', '1', true); } catch(e){}

  state.screen = 'welcome';
  render();
  setTimeout(() => {
    state.screen = 'category';
    state.openCat = 'repas';
    render();
  }, 2200);
}

/* Les réponses sont écrites au fil de l'eau : fermer l'app au milieu du
   questionnaire ne fait plus repartir de la première question. L'écriture est
   différée de quelques centaines de millisecondes pour ne pas solliciter le
   stockage à chaque clic. */
const PROGRESSION_DELAI = 400;
let minuteurProgression = null;
let minuteurProgressionGouts = null;

function sauverProgression(){
  clearTimeout(minuteurProgression);
  minuteurProgression = setTimeout(() => {
    const paquet = {
      step: state.onboardingStep,
      data: state.onboardingData,
      showBfExact: state.showBfExact,
    };
    try { window.storage.set('onboarding-progress', JSON.stringify(paquet), true); } catch(e){}
  }, PROGRESSION_DELAI);
}

function sauverProgressionGouts(){
  clearTimeout(minuteurProgressionGouts);
  minuteurProgressionGouts = setTimeout(() => {
    const paquet = { step: state.tasteStep, data: state.tasteData };
    try { window.storage.set('taste-progress', JSON.stringify(paquet), true); } catch(e){}
  }, PROGRESSION_DELAI);
}

function oublierProgression(cle){
  clearTimeout(cle === 'onboarding-progress' ? minuteurProgression : minuteurProgressionGouts);
  try { window.storage.delete(cle, true); } catch(e){}
}

// Un jour de plus si la dernière visite était hier ; la série repart à 1 si
// un jour a été sauté. Revenir plusieurs fois le même jour ne compte qu'une fois.
async function majSerie(){
  const aujourdhui = todayKey();
  const s = state.streak || { dernier: null, jours: 0, record: 0 };
  if (s.dernier === aujourdhui) return;

  const hier = new Date();
  hier.setDate(hier.getDate() - 1);
  const continuee = s.dernier === dateKey(hier);
  const ancienne = s.jours || 0;

  s.jours = continuee ? ancienne + 1 : 1;
  s.dernier = aujourdhui;
  s.record = Math.max(s.record || 0, s.jours);
  state.streak = s;

  // De quoi jouer l'animation du jour, une seule fois par journée.
  if (continuee && s.jours >= 2){
    state.serieFx = { type: 'serie', jours: s.jours, record: s.record };
  } else if (!continuee && ancienne >= 2){
    state.serieFx = { type: 'eteinte', perdue: ancienne };
  }

  try { await window.storage.set('streak', JSON.stringify(s), true); } catch(e){}
}

// Retrait commun : fondu au bout de quelques secondes, ou au clic.
function brancherSerieFx(el, manuel){
  if (!el) return;
  const sortir = () => {
    if (el.classList.contains('sortie')) return;
    el.classList.add('sortie');
    setTimeout(() => el.remove(), 520);
    document.removeEventListener('keydown', surEchap);
  };
  const surEchap = e => { if (e.key === 'Escape') sortir(); };

  if (manuel){
    const croix = document.getElementById('serieFxFermer');
    if (croix) croix.onclick = sortir;
    document.addEventListener('keydown', surEchap);
  } else {
    setTimeout(sortir, 2400);
    el.onclick = sortir;
  }
}

// Variation de poids sur les deux dernières semaines, en kg.
function tendancePoids(){
  const jours = Object.keys(state.weightHistory || {}).sort();
  if (jours.length < 2) return null;
  const dernier = jours[jours.length - 1];
  const limite = new Date();
  limite.setDate(limite.getDate() - 15);
  const anciens = jours.filter(j => new Date(j) >= limite && j !== dernier);
  const reference = anciens.length ? anciens[0] : jours[0];
  if (reference === dernier) return null;
  return {
    delta: state.weightHistory[dernier] - state.weightHistory[reference],
    jours: Math.round((new Date(dernier) - new Date(reference)) / 86400000),
  };
}

// Un message par jour, tiré de façon stable : il ne change pas d'un rendu à
// l'autre, mais change d'un jour sur l'autre.
function messageDuJour(){
  const serie = (state.streak && state.streak.jours) || 0;
  const t = tendancePoids();
  const objectif = state.body && state.body.objectif;
  const versLeBas = objectif === 'Perte de poids' || objectif === 'Sèche';
  const versLeHaut = objectif === 'Prise de masse' || objectif === 'Prise de muscle propre';

  let famille = 'encours';
  if (serie <= 1) famille = 'demarrage';
  else if (serie >= 7) famille = 'belle';

  if (t && Math.abs(t.delta) >= 0.3){
    const bonSens = (versLeBas && t.delta < 0) || (versLeHaut && t.delta > 0);
    famille = bonSens ? 'progres' : (versLeBas || versLeHaut ? 'rassurant' : famille);
  }

  const liste = MESSAGES_SERIE[famille];
  const graine = todayKey().split('-').join('');
  return liste[parseInt(graine, 10) % liste.length];
}


/* ---------------- Compte : création et connexion ----------------
   Prototype local : le compte est enregistré sur cet appareil uniquement.
   Le mot de passe n'est jamais stocké en clair : on garde un sel aléatoire
   et une empreinte PBKDF2 (100 000 tours). Pour de vrais comptes synchronisés
   entre appareils, il faudra brancher un serveur (Supabase, Firebase...). */
const ICONE_OEIL = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>`;
const ICONE_OEIL_BARRE = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.6 5.1A9.8 9.8 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-2.9 3.8M6.6 6.6C3.7 8.4 2 12 2 12s3.6 7 10 7a9.6 9.6 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="M3 3l18 18"/></svg>`;

function ouvrirCompte(mode){
  state.compteMode = mode;
  state.compteErreurs = {};
  state.compteInfo = null;
  state.compteSaisie = {
    email: mode === 'connexion' && state.compte ? state.compte.email : '',
  };
  state.screen = 'compte';
  render();
}

function emailValide(e){ return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e); }

async function empreinteMotDePasse(motDePasse, selHex){
  const octets = hex => new Uint8Array(hex.match(/../g).map(h => parseInt(h, 16)));
  const cle = await crypto.subtle.importKey('raw', new TextEncoder().encode(motDePasse), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name:'PBKDF2', salt: octets(selHex), iterations: 100000, hash:'SHA-256' }, cle, 256);
  return [...new Uint8Array(bits)].map(b => b.toString(16).padStart(2, '0')).join('');
}

// Écriture dans le stockage avec 3 essais : un refus passager (connexion
// qui flanche, trop de requêtes d'un coup) ne fait plus échouer la création.
async function enregistrerSur(cle, valeur){
  let derniere = null;
  for (let essai = 0; essai < 3; essai++){
    try {
      const r = await window.storage.set(cle, valeur, true);
      if (r) return r;
      derniere = new Error('écriture refusée (' + cle + ')');
    } catch(e){ derniere = e; }
    await new Promise(ok => setTimeout(ok, 350 * (essai + 1)));
  }
  throw derniere || new Error('écriture impossible (' + cle + ')');
}
const detailErreur = e => String((e && (e.name && e.message ? e.name + ' : ' + e.message : e.message)) || e || 'inconnue')
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').slice(0, 160);
// un e-mail saisi finit dans du HTML : il ne doit pas pouvoir y injecter de balise
const echapperHtml = t => String(t || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* Aucun message d'erreur ne doit arriver en anglais sous les yeux de quelqu'un.
   Ceux que l'app a rédigés portent une marque et s'affichent tels quels ; ceux
   du navigateur ou du serveur passent en détail technique, sous une phrase
   claire — on les garde, ils servent au dépannage. */
function messageHumain(e){
  if (e && e.lisible) return e.message;
  const t = String((e && e.message) || e || '');
  if (navigator.onLine === false || /failed to fetch|networkerror|load failed|network request failed/i.test(t)){
    return 'Impossible de joindre le serveur. Vérifie ta connexion, puis réessaie.';
  }
  if (/abort/i.test(t)) return 'La demande a été interrompue. Réessaie.';
  return 'Une erreur est survenue. Réessaie dans un moment.'
    + (t ? `<br><small>Détail technique : ${detailErreur(e)}</small>` : '');
}

async function validerCompte(){
  const bouton = document.getElementById('c_valider');
  if (!bouton || bouton.disabled) return;
  state.compteInfo = null;
  const inscription = state.compteMode === 'inscription';
  const oubli   = state.compteMode === 'oubli';
  const nouveau = state.compteMode === 'nouveau';
  // les deux champs ne sont pas présents à toutes les étapes
  const champEmail = document.getElementById('c_email');
  const champMdp   = document.getElementById('c_mdp');
  const email = champEmail ? champEmail.value.trim().toLowerCase() : ((state.compteSaisie || {}).email || '');
  const mdp   = champMdp ? champMdp.value : '';
  state.compteSaisie = { email, mdp };

  if (oubli)   { await envoyerLienReinit(email, bouton); return; }
  if (nouveau) { await enregistrerNouveauMdp(mdp, bouton); return; }

  const erreurs = {};
  if (inscription){
    if (!emailValide(email)) erreurs.email = email ? "Cet e-mail n'a pas l'air complet (ex : toi@exemple.fr)." : 'Indique ton e-mail.';
    if (mdp.length < 8) erreurs.mdp = mdp ? `Encore ${8 - mdp.length} caractère${8 - mdp.length > 1 ? 's' : ''} : il en faut 8 minimum.` : 'Choisis un mot de passe de 8 caractères minimum.';
    // en ligne, les comptes vivent sur le serveur : plusieurs personnes peuvent
    // s'inscrire depuis le même appareil, c'est Supabase qui signale les doublons
    if (!nuage.actif() && !Object.keys(erreurs).length && state.compte){
      erreurs.general = 'Un compte existe déjà sur cet appareil. Connecte-toi avec son e-mail.';
    }
  } else {
    if (!emailValide(email)) erreurs.email = email ? "Cet e-mail n'a pas l'air complet (ex : toi@exemple.fr)." : 'Indique ton e-mail.';
    if (!mdp) erreurs.mdp = 'Indique ton mot de passe.';
    if (!nuage.actif() && !Object.keys(erreurs).length && !state.compte){
      erreurs.general = "Aucun compte n'existe encore sur cet appareil. Crée le tien avec l'onglet « Créer un compte ».";
    }
  }
  if (Object.keys(erreurs).length){
    state.compteErreurs = erreurs;
    renderCompte();
    return;
  }

  // En ligne : c'est Supabase qui crée le compte, vérifie le mot de passe et
  // garde les données. Rien n'est vérifié sur l'appareil.
  if (nuage.actif()){
    bouton.disabled = true;
    bouton.textContent = inscription ? 'Création…' : 'Connexion…';
    try {
      const r = inscription ? await nuage.inscrire(email, mdp) : await nuage.connecter(email, mdp);
      if (r.confirmation){
        state.compteErreurs = {};
        state.compteInfo = `Compte créé. Ouvre le lien de confirmation qu’on vient de t’envoyer à <strong>${echapperHtml(email)}</strong>, puis reviens te connecter.`;
        state.compteMode = 'connexion';
        state.compteSaisie = { email };
        renderCompte();
        return;
      }
      nuage.memoriserCompte(email);
      await nuage.apresConnexion();
      state.compte = { email };
      state.connecte = true;
    } catch(e){
      state.compteSaisie.mdp = '';
      state.compteErreurs = { general: messageHumain(e) };
      renderCompte();
      return;
    }
    state.compteSaisie = {};
    await boot();   // tout est relu depuis le stockage du compte
    return;
  }

  if (!window.crypto || !crypto.subtle){
    state.compteErreurs = { general: "Ce navigateur bloque le chiffrement du mot de passe. Ouvre l'app depuis son adresse en https." };
    renderCompte();
    return;
  }

  bouton.disabled = true;
  bouton.textContent = inscription ? 'Création…' : 'Connexion…';

  // 1. chiffrement du mot de passe (séparé de l'enregistrement pour savoir
  //    précisément ce qui coince si ça échoue)
  let sel, empreinte;
  try {
    sel = inscription
      ? [...crypto.getRandomValues(new Uint8Array(16))].map(b => b.toString(16).padStart(2, '0')).join('')
      : state.compte.sel;
    empreinte = await empreinteMotDePasse(mdp, sel);
  } catch(e){
    state.compteErreurs = { general: `Le chiffrement du mot de passe n\u2019a pas fonctionné sur ce navigateur.<br><small>Détail : ${detailErreur(e)}</small>` };
    renderCompte();
    return;
  }

  // 2. enregistrement
  try {
    if (inscription){
      // le prénom n'est plus demandé ici : il vient à la première étape du questionnaire
      const compte = { email, sel, empreinte, creeLe: new Date().toISOString() };
      await enregistrerSur('compte', JSON.stringify(compte));
      await enregistrerSur('session', email);
      state.compte = compte;
      state.connecte = true;
    } else {
      const ok = email === state.compte.email && empreinte === state.compte.empreinte;
      if (!ok){
        state.compteSaisie.mdp = '';
        state.compteErreurs = { email: ' ', mdp: 'E-mail ou mot de passe incorrect.' };
        renderCompte();
        return;
      }
      await enregistrerSur('session', email);
      state.connecte = true;
    }
  } catch(e){
    state.compteErreurs = { general: `L\u2019enregistrement a échoué. Réessaie dans un instant.<br><small>Détail : ${detailErreur(e)}</small>` };
    renderCompte();
    return;
  }

  state.compteSaisie = {};
  await routerDemarrage();
}

/* Mot de passe oublié, première étape : on demande l'envoi du lien.
   Le message reste volontairement au conditionnel : Supabase répond pareil que
   l'e-mail ait un compte ou non, et l'app ne doit pas en dire plus que lui. */
async function envoyerLienReinit(email, bouton){
  if (!emailValide(email)){
    state.compteErreurs = { email: email ? "Cet e-mail n'a pas l'air complet (ex : toi@exemple.fr)." : 'Indique ton e-mail.' };
    renderCompte();
    return;
  }
  bouton.disabled = true;
  bouton.textContent = 'Envoi…';
  try {
    await nuage.demanderReinit(email);
  } catch(e){
    state.compteErreurs = { general: messageHumain(e) };
    renderCompte();
    return;
  }
  state.compteErreurs = {};
  state.compteInfo = `Si un compte existe pour <strong>${echapperHtml(email)}</strong>, le lien vient de partir. Ouvre-le depuis cet appareil.`;
  state.compteMode = 'connexion';
  state.compteSaisie = { email };
  renderCompte();
}

/* Deuxième étape : le lien a ouvert une session, il ne reste qu'à poser le
   nouveau mot de passe. On enchaîne directement sur l'app, sans redemander
   de se connecter. */
async function enregistrerNouveauMdp(mdp, bouton){
  if (mdp.length < 8){
    state.compteErreurs = { mdp: mdp
      ? `Encore ${8 - mdp.length} caractère${8 - mdp.length > 1 ? 's' : ''} : il en faut 8 minimum.`
      : 'Choisis un mot de passe de 8 caractères minimum.' };
    renderCompte();
    return;
  }
  bouton.disabled = true;
  bouton.textContent = 'Enregistrement…';
  try {
    await nuage.changerMotDePasse(mdp);
  } catch(e){
    state.compteErreurs = { general: messageHumain(e) };
    renderCompte();
    return;
  }
  const email = nuage.email();
  if (email) nuage.memoriserCompte(email);
  await nuage.apresConnexion();
  state.compte = email ? { email } : state.compte;
  state.connecte = true;
  state.compteSaisie = {};
  state.compteErreurs = {};
  state.compteInfo = null;
  await boot();
}

async function seDeconnecter(){
  if (nuage.actif()){
    try { await nuage.vider(); } catch(e){}   // on n'abandonne pas les écritures en attente
    await nuage.deconnecter();
  } else {
    try { await window.storage.delete('session', true); } catch(e){}
  }
  state.connecte = false;
  ouvrirCompte('connexion');
}

const MEAL_TAGS = {'Petit-déjeuner':'P','Déjeuner':'D','Snack':'S','Dîner':'N'};

function normFood(s){
  return (s||'').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/œ/g,'oe').replace(/æ/g,'ae')
    .replace(/['’‘\-]/g,' ');
}
function foodUnit(f){ return f && (f.unite || (f.cat === 'Boissons' ? 'ml' : 'g')); }

/* Recherche : sans accent, sur le nom, les mots-clés et la catégorie.
   Les aliments correspondant au repas en cours remontent en premier. */
function searchFoods(query, mealTag){
  const q = normFood(query).trim();
  if (!q) return [];
  const out = [];
  FOOD_DB.forEach(f => {
    const n = normFood(f.name);
    const hay = n + ' ' + normFood(f.kw || '') + ' ' + normFood(f.cat || '');
    if (!hay.includes(q)) return;
    let score = 0;
    if (n.startsWith(q)) score -= 4;
    else if (n.includes(q)) score -= 2;
    if (mealTag && (f.meals || '').includes(mealTag)) score -= 1;
    out.push({ f, score, n });
  });
  out.sort((a, b) => a.score - b.score || a.n.localeCompare(b.n));
  return out.slice(0, 12).map(x => x.f);
}

/* Suggestions affichées quand le champ de recherche est vide */
function suggestedFoods(mealTag){
  const picked = (FOOD_SUGGESTIONS[mealTag] || [])
    .map(n => FOOD_DB.find(f => f.name === n))
    .filter(Boolean);
  if (picked.length) return picked;
  return FOOD_DB.filter(f => (f.meals || '').includes(mealTag)).slice(0, 12);
}

// Emojis qui remontent dans la carte : leur nombre suit la part de l'objectif
// déjà consommée dans la journée.
// Feu de fond de la carte calories : une rangée de langues indépendantes qui
// montent du bas. Chacune a sa propre cadence, c'est ce qui donne le
// scintillement d'un vrai foyer plutôt qu'une ondulation d'ensemble.
// Silhouette d'une langue de feu : pointe fine en haut, corps qui s'évase,
// pied resserré. Le cœur est la partie claire, près de la base.
// Silhouette d'une langue de feu : pointe fine en haut, pied large qui
// s'évase et s'assoit sur le foyer.
const FLAME_PATH = 'M30,3 C33,33 47,47 48,80 C49,110 45,133 55,160 L5,160 C15,133 11,110 12,80 C13,47 27,33 30,3 Z';
const FLAME_CORE = 'M30,62 C33,82 41,94 42,114 C43,134 40,148 47,160 L13,160 C20,148 17,134 18,114 C19,94 27,82 30,62 Z';

// Les paramètres du feu et des bulles sont tirés une seule fois, puis
// mémorisés : à chaque rendu on redessine les mêmes éléments, et on leur
// redonne la phase où ils en étaient. Sans ça, ajouter un aliment relançait
// toutes les animations depuis zéro.
const FX = {
  debut: Date.now(),
  langues: null,
  bulles: {},
  ratios: {},   // dernière valeur affichée, pour repartir de là
};

function phaseFx(){ return (Date.now() - FX.debut) / 1000; }

function languesFeu(){
  if (FX.langues) return FX.langues;
  const nb = 15;
  FX.langues = [];
  for (let i = 0; i < nb; i++){
    const largeur = 10 + Math.random() * 7;
    FX.langues.push({
      gauche: (i + 0.5) / nb * 100 - largeur / 2,
      largeur,
      hauteur: 55 + Math.random() * 75,
      duree: 0.5 + Math.random() * 0.55,
      decalage: Math.random() * 2,
    });
  }
  return FX.langues;
}

function calFlames(consomme, objectif){
  const ratio = objectif > 0 ? Math.max(0, Math.min(1, consomme / objectif)) : 0;
  const avant = FX.ratios.cal || 0;
  if (ratio <= 0.005 && avant <= 0.005) return '';   // rien à montrer, rien à faire retomber

  // on repart de la hauteur précédente : la montée — ou la retombée quand on
  // supprime tout — se fait en transition plutôt que d'un coup
  const depart = (avant * 50).toFixed(1);
  const cible = (ratio * 50).toFixed(1);

  const langues = languesFeu().map(l => `
      <svg class="cal-flame" viewBox="0 0 60 160" preserveAspectRatio="none"
        data-duree="${l.duree.toFixed(3)}" data-decalage="${l.decalage.toFixed(3)}"
        style="left:${l.gauche.toFixed(1)}%;width:${l.largeur.toFixed(1)}%;height:${l.hauteur.toFixed(0)}%;">
        <path class="enveloppe" d="${FLAME_PATH}"/>
        <path class="coeur" d="${FLAME_CORE}"/>
      </svg>`).join('');

  return `
    <div class="cal-flames" aria-hidden="true" data-cible="${cible}" style="height:${depart}%">
      <svg class="cal-flame-defs" aria-hidden="true"><defs>
        <linearGradient id="flameGrad" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0" stop-color="#FF5F00" stop-opacity=".58"/>
          <stop offset=".5" stop-color="#FF9A22" stop-opacity=".34"/>
          <stop offset="1" stop-color="#FFD35E" stop-opacity=".10"/>
        </linearGradient>
        <linearGradient id="flameCore" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0" stop-color="#FFE9A8" stop-opacity=".55"/>
          <stop offset="1" stop-color="#FFC63D" stop-opacity=".12"/>
        </linearGradient>
      </defs></svg>
      <div class="cal-braise"></div>
      ${langues}
    </div>`;
}

/* Les animations sont pilotées par l'API Web Animations et calées sur la
   frise du document : en fixant startTime, un élément recréé au rendu suivant
   reprend exactement la phase où en était le précédent. Avec une animation
   CSS, la phase repartait du moment de la création de l'élément, d'où le
   petit sursaut à chaque clic sur + ou −. */
const FLAME_KEYFRAMES = [
  { transform:'scale(1,.86) skewX(-3deg)',   offset:0 },
  { transform:'scale(.94,1.14) skewX(2deg)', offset:.35 },
  { transform:'scale(1.05,.96) skewX(-2deg)',offset:.65 },
  { transform:'scale(.97,1.2) skewX(3deg)',  offset:1 },
];
function calerSurLaFrise(el, keyframes, easing){
  const duree = parseFloat(el.dataset.duree) * 1000;
  const decalage = parseFloat(el.dataset.decalage) * 1000;
  const anim = el.animate(keyframes, {
    duration: duree,
    iterations: Infinity,
    easing,
    direction: 'alternate',
    delay: -decalage,
  });
  // origine commune : la phase ne dépend plus de l'instant de création
  try { anim.startTime = 0; } catch(e){ /* frise indisponible, tant pis */ }
}

// Après le rendu : on relance les animations en phase et on lance la
// montée (ou la retombée) du feu vers sa nouvelle hauteur.
function syncFx(){
  document.querySelectorAll('.cal-flame').forEach(el => calerSurLaFrise(el, FLAME_KEYFRAMES, 'ease-in-out'));

  const feu = document.querySelector('.cal-flames');
  if (feu){
    const cible = feu.dataset.cible;
    // lecture forcée : sans elle le navigateur fusionne les deux hauteurs
    // en un seul calcul de style et la transition n'a pas lieu
    void feu.offsetHeight;
    feu.style.height = cible + '%';
    FX.ratios.cal = parseFloat(cible) / 50;
  }
}

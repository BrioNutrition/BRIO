/* ---------------- repas: tableau de bord ---------------- */

// Un jour est "marqué" dès que l'utilisateur y a touché quelque chose :
// au moins un aliment enregistré, un peu d'eau bue, ou une pesée validée.
function dayHasData(key){
  return (state.entries.repas || []).some(e => e.date === key)
    || !!state.water[key]
    || state.weightHistory[key] != null;
}

// Met à jour les points violets déjà affichés sans re-rendre tout l'écran,
// pour qu'ils apparaissent/disparaissent au moment même où l'utilisateur modifie un jour.
function refreshDayDots(){
  document.querySelectorAll('.day-circle').forEach(btn => {
    const key = btn.dataset.date;
    if (!key) return;
    const has = dayHasData(key);
    const dot = btn.querySelector('.day-dot');
    if (has && !dot){
      const span = document.createElement('span');
      span.className = 'day-dot day-dot-pop';
      btn.insertBefore(span, btn.firstChild);
    } else if (!has && dot){
      dot.remove();
    }
  });
}

/* ---------------- détail d'une case du tableau de bord ----------------
   Calories, macros et eau s'ouvrent dans une grande feuille : le récap du
   jour choisi, puis l'évolution sur 7 ou 30 jours en graphique à points. */
const STAT_CONF = {
  cal:  { titre:'Calories',    emoji:'🔥', unite:'kcal', champ:'calories'  },
  prot: { titre:'Protéines',   emoji:'⚡', unite:'g',    champ:'proteines', viserHaut:true },
  carb: { titre:'Glucides',    emoji:'🌿', unite:'g',    champ:'glucides'  },
  fat:  { titre:'Lipides',     emoji:'🫒', unite:'g',    champ:'lipides'   },
  eau:  { titre:'Hydratation', emoji:'💧', unite:'ml',   viserHaut:true, couleur:'#2F7FD4', piste:'#D6E6F7', fond:'rgba(47,127,212,.08)' },
};
let statFeuille = null;
// 13.600000001 → « 13,6 »
const fmtMacro = v => (Math.round((parseFloat(v) || 0) * 10) / 10).toLocaleString('fr-FR'); // { kind, periode, jour, animer }

function decalerJour(cle, n){
  const d = new Date(cle + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return dateKey(d);
}
const statNb = n => Math.round(n).toLocaleString('fr-FR');

// Valeur d'un jour ; null quand rien n'a été noté (≠ zéro mangé)
function statValeurJour(kind, jour){
  if (kind === 'eau'){
    const ml = (state.water || {})[jour] || 0;
    return ml > 0 ? ml : null;
  }
  const duJour = (state.entries.repas || []).filter(e => e.date === jour);
  if (!duJour.length) return null;
  const champ = STAT_CONF[kind].champ;
  return duJour.reduce((s, e) => s + (parseFloat(e.fields[champ]) || 0), 0);
}
function statObjectif(kind){
  if (kind === 'eau') return hydrationGoalMl();
  return (state.macroGoals || {})[STAT_CONF[kind].champ] || 0;
}
// Protéines et eau : il faut atteindre au moins 90 % ; le reste : ±10 % de l'objectif
function statDansObjectif(kind, v, obj){
  if (v == null || !obj) return false;
  return STAT_CONF[kind].viserHaut ? v >= obj * 0.9 : Math.abs(v - obj) <= obj * 0.1;
}
function statDepasse(kind, v, obj){
  return !STAT_CONF[kind].viserHaut && v != null && obj && v > obj * 1.1;
}
// « Atteint » veut dire objectif vraiment atteint (100 %), comme sur l'écran
// du jour : si on retire un aliment ou de l'eau et qu'on repasse sous
// l'objectif, la case n'est plus verte. Au-delà de +10 % sur les calories,
// glucides ou lipides, c'est « En trop » qui s'affiche à la place.
function statAtteint(kind, v, obj){
  if (v == null || !obj || v < obj) return false;
  return !statDepasse(kind, v, obj);
}
function statFmtAxe(kind, v){
  if (kind === 'eau') return formatLitres(v);
  return statNb(v);
}

function statRecapHtml(kind, jour){
  const c = STAT_CONF[kind];
  const obj = statObjectif(kind);
  const v = statValeurJour(kind, jour) || 0;
  const reste = obj - v;
  const pct = obj ? Math.round(v / obj * 100) : 0;
  const atteint = statAtteint(kind, statValeurJour(kind, jour), obj);
  const trop = !atteint && reste < 0 && !c.viserHaut;
  let detail = '';
  if (kind === 'eau'){
    const ajouts = ((state.waterLog || {})[jour] || []);
    detail = ajouts.length
      ? `<div class="stat-ajouts">${ajouts.map(ml => `<span class="stat-ajout">+${statNb(ml)} ml</span>`).join('')}</div>`
      : '';
  } else {
    const duJour = (state.entries.repas || []).filter(e => e.date === jour);
    detail = `<div class="stat-repas">${MEAL_TYPES.map(mt => {
      const lignes = duJour.filter(e => e.fields.type === mt);
      const val = lignes.reduce((s, e) => s + (parseFloat(e.fields[c.champ]) || 0), 0);
      const larg = obj ? Math.min(100, val / obj * 100) : 0;
      return `
        <div class="stat-repas-ligne">
          <span class="stat-repas-ico">${MEAL_ICONS[mt] || ''}</span>
          <div>
            <div class="stat-repas-nom">${mt}</div>
            <div class="stat-repas-mini"><div style="width:${larg}%"></div></div>
          </div>
          <span class="stat-repas-val ${lignes.length ? '' : 'vide'}">${lignes.length ? `${statNb(val)} ${c.unite}` : '—'}</span>
        </div>`;
    }).join('')}</div>`;
  }
  return `
    <div class="stat-recap stat-verre">
      <div class="stat-gros">
        <span class="stat-gros-num">${statNb(v)} ${c.unite}</span>
        <span class="stat-gros-sur">sur ${statNb(obj)} ${c.unite} · ${pct} %</span>
      </div>
      <div class="stat-barre ${trop ? 'depasse' : ''}"><div style="width:${Math.min(100, pct)}%"></div></div>
      <div class="stat-tuiles">
        <div class="stat-tuile stat-verre"><div class="stat-tuile-val">${statNb(v)}</div><div class="stat-tuile-lab">${kind === 'eau' ? 'Bu' : 'Consommé'}</div></div>
        <div class="stat-tuile stat-verre"><div class="stat-tuile-val">${statNb(obj)}</div><div class="stat-tuile-lab">Objectif</div></div>
        <div class="stat-tuile stat-verre ${atteint ? 'vert' : trop ? 'rouge' : ''}"><div class="stat-tuile-val ${trop ? 'rouge' : ''}">${trop ? '+' + statNb(-reste) : atteint ? '✅' : statNb(reste)}</div><div class="stat-tuile-lab">${trop ? 'En trop' : atteint ? 'Atteint' : 'Reste'}</div></div>
      </div>
      ${statValeurJour(kind, jour) == null ? `<div class="stat-vide">Rien de noté ce jour-là.</div>` : detail}
    </div>`;
}

function statGraphiqueSvg(kind, jours, valeurs, obj, jourSel, animer){
  const W = 330, H = 178, L = 36, R = 48, T = 16, B = 28;
  const pw = W - L - R, ph = H - T - B;
  const presents = valeurs.filter(v => v != null);
  const yMax = Math.max(obj * 1.3, ...presents.map(v => v * 1.1), 1);
  const n = jours.length;
  const x = i => L + (n === 1 ? pw / 2 : i * pw / (n - 1));
  const y = v => T + ph - (v / yMax) * ph;
  const pts = valeurs.map((v, i) => v == null ? null : [x(i), y(v), i]).filter(Boolean);
  const chemin = pts.map((p, k) => (k ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const aire = pts.length > 1
    ? `${chemin} L${pts[pts.length-1][0].toFixed(1)} ${T + ph} L${pts[0][0].toFixed(1)} ${T + ph} Z` : '';
  const iSel = jours.indexOf(jourSel);
  const r = n > 10 ? 2.8 : 4;
  const pas = n > 10 ? 7 : 1;
  const labelsX = jours.map((j, i) => {
    if ((n - 1 - i) % pas !== 0 && i !== iSel) return '';
    if (n > 10 && i !== iSel && Math.abs(i - iSel) < 3 && iSel >= 0) return '';
    const d = new Date(j + 'T00:00:00');
    const txt = n > 10 ? `${d.getDate()}/${d.getMonth() + 1}` : `${dayLetterFR(d)} ${d.getDate()}`;
    return `<text x="${x(i).toFixed(1)}" y="${H - 8}" text-anchor="middle" class="${i === iSel ? 'lab-sel' : ''}">${txt}</text>`;
  }).join('');
  const largZone = n === 1 ? pw : pw / (n - 1);
  return `
    <svg class="stat-graph" viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution sur ${n} jours">
      <defs>
        <linearGradient id="statAire" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="var(--stat-couleur)" stop-opacity=".22"/>
          <stop offset="1" stop-color="var(--stat-couleur)" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <line x1="${L}" x2="${W - R}" y1="${T + ph}" y2="${T + ph}" stroke="${state.sombre ? 'rgba(255,255,255,.12)' : '#E4D3F5'}" stroke-width="1"/>
      <text x="${L - 6}" y="${T + ph + 3}" text-anchor="end">0</text>
      <line x1="${L}" x2="${W - R}" y1="${y(obj).toFixed(1)}" y2="${y(obj).toFixed(1)}" stroke="var(--stat-couleur)" stroke-opacity=".55" stroke-width="1.2" stroke-dasharray="4 4"/>
      <text x="${L - 6}" y="${(y(obj) + 3).toFixed(1)}" text-anchor="end" class="lab-obj">${statFmtAxe(kind, obj)}</text>
      <text x="${W - R + 8}" y="${(y(obj) + 3).toFixed(1)}" text-anchor="start" class="lab-obj">Objectif</text>
      ${iSel >= 0 ? `<line x1="${x(iSel).toFixed(1)}" x2="${x(iSel).toFixed(1)}" y1="${T - 4}" y2="${T + ph}" stroke="${state.sombre ? '#FFFFFF' : '#1C1730'}" stroke-opacity=".12" stroke-width="1.5"/>` : ''}
      ${aire ? `<path d="${aire}" fill="url(#statAire)"/>` : ''}
      ${pts.length > 1 ? `<path d="${chemin}" class="ligne ${animer ? 'anime' : ''}" pathLength="1"/>` : ''}
      ${pts.map(([px, py, i]) => {
        const rouge = statDepasse(kind, valeurs[i], obj);
        return `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${i === iSel ? r + 2 : r}" class="point ${rouge ? 'rouge' : ''} ${i === iSel ? 'sel' : ''}"/>`;
      }).join('')}
      ${labelsX}
      ${jours.map((j, i) => `<rect class="zone" data-jour="${j}" x="${(x(i) - largZone / 2).toFixed(1)}" y="0" width="${largZone.toFixed(1)}" height="${H}"/>`).join('')}
    </svg>`;
}

function statCorpsHtml(){
  const { kind, periode, jour, animer } = statFeuille;
  const c = STAT_CONF[kind];
  const obj = statObjectif(kind);
  const fin = state.viewDate;
  const jours = Array.from({ length: periode }, (_, i) => decalerJour(fin, i - periode + 1));
  const valeurs = jours.map(j => statValeurJour(kind, j));
  const presents = valeurs.filter(v => v != null);
  // la journée en cours n'est pas finie : elle ne compte ni dans la moyenne ni dans le bilan
  const finis = valeurs.filter((v, i) => v != null && jours[i] !== todayKey());
  const moyenne = finis.length ? finis.reduce((a, b) => a + b, 0) / finis.length : null;
  const reussis = finis.filter(v => statDansObjectif(kind, v, obj)).length;
  const avecAujourdhui = jours.includes(todayKey()) && statValeurJour(kind, todayKey()) != null;
  const libJour = jour === todayKey() ? "Aujourd'hui" : formatFullDateFR(new Date(jour + 'T00:00:00'));
  return `
    <div class="stat-titre"><span class="stat-titre-ico">${ICONES_NUTRI[kind === 'cal' ? 'flamme' : kind]}</span>${c.titre}</div>
    <div class="stat-jour">${libJour}</div>
    ${statRecapHtml(kind, jour)}
    <div class="stat-evol-tete">
      <div class="stat-evol-titre">Évolution</div>
      <div class="stat-periodes stat-verre">
        <button class="stat-periode ${periode === 7 ? 'actif' : ''}" data-periode="7">7 jours</button>
        <button class="stat-periode ${periode === 30 ? 'actif' : ''}" data-periode="30">30 jours</button>
      </div>
    </div>
    ${statGraphiqueSvg(kind, jours, valeurs, obj, jour, animer)}
    <div class="stat-aide">Touche un jour du graphique pour voir son récap.</div>
    <div class="stat-bilan">
      <div class="stat-tuile stat-verre"><div class="stat-tuile-val">${moyenne == null ? '—' : statNb(moyenne) + ' ' + c.unite}</div><div class="stat-tuile-lab">Moyenne</div></div>
      <div class="stat-tuile stat-verre"><div class="stat-tuile-val">${presents.length} / ${periode}</div><div class="stat-tuile-lab">Jours notés</div></div>
      <div class="stat-tuile stat-verre"><div class="stat-tuile-val">${reussis} j</div><div class="stat-tuile-lab">Dans l'objectif</div></div>
    </div>
    <div class="stat-brioche stat-verre">
      <img src="${BRIOCHE_SRC}" alt="Brioche">
      <div>${commentaireStatBrioche(kind, finis.length, reussis, moyenne, obj)}</div>
    </div>
    <div class="stat-note">${c.viserHaut
      ? "Dans l'objectif : au moins 90 % de l'objectif atteint."
      : "Dans l'objectif : à 10 % près de l'objectif."}${avecAujourdhui ? " La journée en cours n'est comptée qu'une fois terminée." : ''}${presents.length && presents.length < periode ? ' Les jours sans rien de noté sont ignorés.' : ''}</div>`;
}

function statRafraichir(){
  const corps = document.getElementById('statCorps');
  if (!corps) return;
  corps.innerHTML = statCorpsHtml();
  statFeuille.animer = false;
  corps.querySelectorAll('.stat-periode').forEach(b => {
    b.onclick = () => {
      statFeuille.periode = +b.dataset.periode;
      statFeuille.animer = true;
      const debut = decalerJour(state.viewDate, 1 - statFeuille.periode);
      if (statFeuille.jour < debut) statFeuille.jour = state.viewDate;
      statRafraichir();
    };
  });
  corps.querySelectorAll('.stat-graph .zone').forEach(z => {
    z.onclick = () => { statFeuille.jour = z.dataset.jour; statRafraichir(); };
  });
}

/* ---------------- Feuilles du bas : glisser vers le bas pour fermer ----------------
   Le geste marche sur toute la feuille, pas seulement sur la petite poignée :
   - on tire vers le bas depuis n'importe où, tant que le contenu est tout en haut ;
   - un geste horizontal (règle du poids, graphique...) est laissé tranquille ;
   - la page derrière ne bouge pas pendant le geste ;
   - une pichenette rapide suffit, pas besoin d'aller jusqu'en bas de l'écran.
   Renvoie une fonction qui ferme la feuille avec la même animation
   (pour le clic sur le fond, Échap, un bouton « Plus tard »...). */
function brancherGlisserFermer(feuille, fond, fermer){
  if (!feuille || !fond) return () => fermer();
  let depart = null;   // { x, y, zone, poignee }
  let mode = null;     // null tant que la direction n'est pas connue, puis 'glisse' | 'bloque' | 'natif'
  let delta = 0, traces = [];  // traces : dernières positions du doigt, pour mesurer la vitesse
  let fermeture = false;

  // premier bloc qui défile verticalement entre le doigt et la feuille (incluse)
  const zoneDefilante = (el) => {
    for (; el; el = el.parentElement){
      const oy = getComputedStyle(el).overflowY;
      if ((oy === 'auto' || oy === 'scroll') && el.scrollHeight > el.clientHeight + 1) return el;
      if (el === feuille) return null;
    }
    return null;
  };

  const revenir = () => {
    feuille.style.transition = 'transform .3s cubic-bezier(.32,.72,0,1)';
    feuille.style.transform = '';
  };

  function fermerAnime(){
    if (fermeture) return;
    fermeture = true;
    depart = null;
    fond.style.pointerEvents = 'none';
    feuille.style.animation = 'none';
    feuille.style.transition = 'transform .26s cubic-bezier(.4,0,.9,.6)';
    fond.style.transition = 'background-color .26s ease';
    feuille.style.transform = 'translateY(calc(100% + 40px))';
    fond.style.backgroundColor = 'transparent';
    let fini = false;
    const terminer = () => { if (fini) return; fini = true; fermer(); };
    feuille.addEventListener('transitionend', (e) => {
      if (e.target === feuille && e.propertyName === 'transform') terminer();
    });
    setTimeout(terminer, 320); // au cas où transitionend ne viendrait pas
  }

  feuille.addEventListener('touchstart', (e) => {
    depart = null;
    if (fermeture || e.touches.length !== 1) return;
    if (e.target.closest('input, textarea, select')) return;
    const t = e.touches[0];
    depart = { x: t.clientX, y: t.clientY, zone: zoneDefilante(e.target), poignee: !!e.target.closest('.weight-sheet-handle') };
    mode = null; delta = 0; traces = [];
  }, { passive:true });

  feuille.addEventListener('touchmove', (e) => {
    if (!depart) return;
    const t = e.touches[0];
    const dx = t.clientX - depart.x, dy = t.clientY - depart.y;
    if (mode === null){
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      if (Math.abs(dx) > Math.abs(dy)){
        mode = 'natif';                       // geste horizontal : on ne s'en mêle pas
      } else if (dy > 0 && (depart.poignee || !depart.zone || depart.zone.scrollTop <= 0)){
        mode = 'glisse';
        depart.y = t.clientY;                 // la feuille part du doigt, sans petit saut
        feuille.style.animation = 'none';
        feuille.style.transition = 'none';
      } else {
        mode = depart.zone ? 'natif' : 'bloque'; // la liste défile ; sinon rien ne doit bouger
      }
    }
    if (mode === 'natif') return;
    if (e.cancelable) e.preventDefault();
    if (mode !== 'glisse') return;
    delta = Math.max(0, t.clientY - depart.y);
    const maintenant = performance.now();
    traces.push({ y: t.clientY, t: maintenant });
    while (traces.length > 2 && maintenant - traces[0].t > 100) traces.shift();
    feuille.style.transform = `translateY(${delta}px)`;
  }, { passive:false });

  const lacher = (e) => {
    if (!depart) return;
    const etait = mode;
    depart = null; mode = null;
    if (etait !== 'glisse') return;
    // vitesse sur les ~100 dernières ms (nulle si le doigt s'était arrêté avant de lâcher)
    let vitesse = 0;
    const fin = traces[traces.length - 1], deb = traces[0];
    if (fin && deb && fin !== deb && performance.now() - fin.t < 120) vitesse = (fin.y - deb.y) / Math.max(1, fin.t - deb.t);
    const h = feuille.offsetHeight || 1;
    if (delta > Math.min(120, h * 0.3) || (vitesse > 0.35 && delta > 24)) fermerAnime();
    else revenir();
  };
  feuille.addEventListener('touchend', lacher);
  feuille.addEventListener('touchcancel', () => {
    const etait = mode; depart = null; mode = null;
    if (etait === 'glisse') revenir();
  });

  // un doigt posé sur le fond (hors de la feuille) ne fait pas défiler la page
  fond.addEventListener('touchmove', (e) => {
    if (e.target === fond && e.cancelable) e.preventDefault();
  }, { passive:false });

  // à la souris (ordinateur), on attrape la poignée
  const poignee = feuille.querySelector('.weight-sheet-handle');
  if (poignee){
    poignee.addEventListener('mousedown', (e) => {
      if (fermeture) return;
      e.preventDefault();
      const y0 = e.clientY;
      let d = 0, bouge = false;
      const surBouge = (ev) => {
        if (!bouge){ bouge = true; feuille.style.animation = 'none'; feuille.style.transition = 'none'; }
        d = Math.max(0, ev.clientY - y0);
        feuille.style.transform = `translateY(${d}px)`;
      };
      const surLache = () => {
        window.removeEventListener('mousemove', surBouge);
        window.removeEventListener('mouseup', surLache);
        if (!bouge) return;
        if (d > Math.min(120, feuille.offsetHeight * 0.3)) fermerAnime();
        else revenir();
      };
      window.addEventListener('mousemove', surBouge);
      window.addEventListener('mouseup', surLache);
    });
  }

  return fermerAnime;
}

function ouvrirStat(kind){
  if (document.getElementById('statBackdrop')) return;
  statFeuille = { kind, periode: 7, jour: state.viewDate, animer: true };
  const c = STAT_CONF[kind];
  document.body.insertAdjacentHTML('beforeend', `
    <div class="stat-backdrop" id="statBackdrop">
      <div class="stat-sheet" id="statSheet" role="dialog" aria-modal="true" aria-label="${c.titre}"
        style="--stat-couleur:${c.couleur || (state.sombre ? '#A98DF0' : '#7B4FE0')};--stat-piste:${state.sombre ? 'rgba(255,255,255,.1)' : (c.piste || '#E4D3F5')};--stat-fond:${c.fond || 'rgba(123,79,224,.08)'};">
        <div class="weight-sheet-handle" id="statHandle"></div>
        <div id="statCorps"></div>
      </div>
    </div>`);
  const fond = document.getElementById('statBackdrop');
  const feuille = document.getElementById('statSheet');
  statRafraichir();

  const surEchapStat = (e) => { if (e.key === 'Escape') fermerStat(); };
  const fermerStat = brancherGlisserFermer(feuille, fond, () => {
    document.removeEventListener('keydown', surEchapStat);
    fond.remove();
    statFeuille = null;
  });
  document.addEventListener('keydown', surEchapStat);
  fond.onclick = (e) => { if (e.target === fond) fermerStat(); };
}

let briocheDernierMessage = null;

function listeFR(mots){
  if (mots.length <= 1) return mots.join('');
  return mots.slice(0, -1).join(', ') + ' et ' + mots[mots.length - 1];
}
const REPAS_ARTICLE = { 'Petit-déjeuner':'ton petit-déjeuner', 'Déjeuner':'ton déjeuner', 'Snack':'ton snack', 'Dîner':'ton dîner' };

function messageBrioche(dayEntries, consumed, goals, mlToday, waterGoal){
  const jour = state.viewDate, aujourdhui = todayKey();
  if (jour > aujourdhui) return null;
  const cal = consumed.calories, obj = goals.calories;
  if (jour !== aujourdhui){
    if (!dayEntries.length) return { humeur:'normal', texte:"Rien n'a été noté ce jour-là. Tu peux encore l'ajouter si tu t'en souviens." };
    if (Math.abs(cal - obj) <= obj * 0.1) return { humeur:'bravo', texte:'Ce jour-là, tu étais pile dans ton objectif 👌' };
    if (cal > obj) return { humeur:'normal', texte:`Ce jour-là, ${statNb(cal - obj)} kcal de plus que prévu. Ça arrive, c'est la semaine qui compte.` };
    return { humeur:'normal', texte:`Ce jour-là : ${statNb(cal)} kcal sur ${statNb(obj)}.` };
  }
  const heure = new Date().getHours();
  const oublies = MEAL_TYPES.filter(mt => repasAttendu(mt) && !dayEntries.some(e => e.fields.type === mt));
  if (!dayEntries.length){
    return oublies.length
      ? { humeur:'alerte', texte:"Ta journée est encore vide ! Note ce que tu as mangé, même à peu près : ça compte." }
      : { humeur:'normal', texte:'Journée toute neuve ! Note ton premier repas quand tu veux, je garde le compte.' };
  }
  if (oublies.length){
    return { humeur:'alerte', texte:`Tu n'as pas encore noté ${listeFR(oublies.map(mt => REPAS_ARTICLE[mt] || mt))}. Un petit oubli ?` };
  }
  if (cal > obj * 1.1){
    return { humeur:'normal', texte:`${statNb(cal - obj)} kcal au-dessus aujourd'hui. Pas de panique, un jour ne fait pas ta semaine.` };
  }
  const calOk = statAtteint('cal', cal, obj);
  const protOk = statAtteint('prot', consumed.proteines, goals.proteines);
  const eauOk = statAtteint('eau', mlToday, waterGoal);
  if (calOk && protOk && eauOk) return { humeur:'bravo', texte:'Tous tes objectifs sont atteints. Tu gères avec brio 🎉' };
  if (heure >= 17 && consumed.proteines < goals.proteines * 0.6){
    return { humeur:'normal', texte:`Il te manque encore ${statNb(goals.proteines - consumed.proteines)} g de protéines. Des œufs ou un yaourt grec ce soir ?` };
  }
  if (heure >= 15 && mlToday < waterGoal * 0.5){
    return { humeur:'normal', texte:`Pense à boire un peu : encore ${statNb(waterGoal - mlToday)} ml pour ton objectif 💧` };
  }
  if (calOk) return { humeur:'bravo', texte:'Objectif calories atteint 👌 Bien joué !' };
  return { humeur:'normal', texte:`Il te reste ${statNb(obj - cal)} kcal aujourd'hui. Tu es sur la bonne voie !` };
}

function bulleBriocheHtml(msg){
  if (!msg) return '';
  const nouveau = briocheDernierMessage !== null && briocheDernierMessage !== msg.texte;
  const premiere = briocheDernierMessage === null;
  briocheDernierMessage = msg.texte;
  return `
    <div class="brioche-bulle humeur-${msg.humeur} ${nouveau ? 'nouveau' : ''} ${premiere ? 'arrivee' : ''}" role="status">
      <img class="brioche-tete" src="${BRIOCHE_SRC}" alt="Brioche">
      <div class="brioche-texte">${msg.texte}</div>
    </div>`;
}

// Le commentaire de Brioche dans le détail d'une case
function commentaireStatBrioche(kind, presents, reussis, moyenne, obj){
  const c = STAT_CONF[kind];
  if (!presents) return 'Note quelques jours et je te montrerai ta progression ici.';
  if (reussis / presents >= 0.7) return `${reussis} jour${reussis > 1 ? 's' : ''} sur ${presents} dans l'objectif. Tu gères avec brio !`;
  const ecart = statNb(Math.abs(moyenne - obj)) + ' ' + c.unite;
  if (c.viserHaut && moyenne < obj * 0.9){
    return kind === 'eau'
      ? `Il te manque en moyenne ${ecart} par jour. Garde ta gourde à portée de main 💧`
      : `Il te manque en moyenne ${ecart} par jour. On peut viser un peu plus haut 💪`;
  }
  if (!c.viserHaut && moyenne > obj * 1.1) return `En moyenne, tu es ${ecart} au-dessus. Rien de grave, on ajuste doucement.`;
  if (!c.viserHaut && moyenne < obj * 0.9) return `En moyenne, tu es ${ecart} en dessous. Pense à bien manger à ta faim.`;
  return 'Ta moyenne est proche de ton objectif. Continue comme ça !';
}
let repasPulseJouee = false; // pulsation des repas à renseigner déjà montrée
function renderRepasDashboard(){
  const shouldAnimateRings = dayFlip || navFade;
  const dayEntries = (state.entries.repas||[]).filter(e=>e.date===state.viewDate);
  const sumField = (key) => dayEntries.reduce((s,e)=> s+(parseFloat(e.fields[key])||0), 0);
  const consumed = {
    calories: sumField('calories'),
    proteines: sumField('proteines'),
    glucides: sumField('glucides'),
    lipides: sumField('lipides'),
  };
  const goals = state.macroGoals;
  const remain = (goal, used) => Math.round(goal - used);

  const remainingCal = remain(goals.calories, consumed.calories);
  const ringRatio = Math.max(0, Math.min(1, consumed.calories / goals.calories));
  const circumference = 2 * Math.PI * 22;
  const dashOffset = circumference * (1 - ringRatio);

  const mlToday = state.water[state.viewDate] || 0;
  const waterGoal = hydrationGoalMl();
  const waterWidth = waterWidthCss(mlToday, waterGoal);
  const waterReached = mlToday >= waterGoal;
  const waterLogToday = state.waterLog[state.viewDate] || [];

  const macroRing = (goal, used, iconHtml) => {
    const ratio = Math.max(0, Math.min(1, used / goal));

    let startX = 0, startY = 0, dragging = false, pressed = false, currentDx = 0;

    const onStart = (x, y) => { pressed = true; startX = x; startY = y; dragging = false; currentDx = 0; };

    const onMove = (x, y, e) => {
      if (!pressed) return;
      const dx = x - startX;
      const dy = y - startY;
      if (!dragging){
        if (Math.abs(dx) < 6 || Math.abs(dx) < Math.abs(dy)) return;
        dragging = true;
        track.style.transition = 'none';

      currentDx = dx;
      if (state.viewWeekOffset >= 0 && dx < 0) currentDx = dx * 0.25; // impossible d'aller au-delà de la semaine actuelle
      currentDx = Math.max(-wrapWidth, Math.min(currentDx, wrapWidth));
      track.style.transform = `translateX(${-wrapWidth + currentDx}px)`;
      if (e && e.cancelable) e.preventDefault();
    };

    const onEnd = () => {
      pressed = false;
      if (!dragging) return;
      dragging = false;
      track.style.transition = 'transform .55s cubic-bezier(.22,.61,.36,1)';
      const threshold = wrapWidth * 0.18;

      } else if (currentDx >= threshold){

        track.style.transform = 'translateX(0px)';
        setTimeout(refreshCarousel, 550);

        track.style.transform = `translateX(${-wrapWidth}px)`;

    const foodItemHtml = (f, i) => {
      const fav = estFavori(f);
      return `
      <div class="aliment-ligne${fav ? ' favori' : ''}">
        <button type="button" class="food-result" data-i="${i}">
          <span class="food-result-name">
            <span>${echapperTexte(f.name)}</span>
            <span class="food-result-cat">${echapperTexte(f.cat || '')}</span>
          </span>
          <span class="food-result-info">
            <span class="food-result-cal">${f.cal} kcal/100${foodUnit(f)}</span>
            <span class="food-result-macros">P ${f.prot}g · G ${f.carb}g · L ${f.fat}g</span>
          </span>
        </button>
        <button type="button" class="food-fav${fav ? ' actif' : ''}" data-i="${i}" aria-pressed="${fav}"
          aria-label="${fav ? 'Retirer' : 'Ajouter'} ${echapperTexte(f.name)} ${fav ? 'des' : 'aux'} favoris">${etoileSvg(fav)}</button>
      </div>`;
    };

    const pickFood = (f) => {
      if (!f) return;
      pickedFood = f;
      state.repasAlimentChoisi = f;
      foodSearchInput.classList.remove('input-error');
      const descInput = document.getElementById('mf_desc');
      descInput.value = f.name;
      descInput.readOnly = true;
      document.getElementById('mf_desc_wrap').style.display = '';
      qtyInput.value = '';
      applyFoodQty();
      renderPortions();
      foodSearchInput.value = '';
      foodResultsDiv.innerHTML = '';
    };

    const showFoodList = (list, head, vide) => {
      listeAffichee = list;
      const tete = head ? `<div class="food-results-head">${echapperTexte(head)}</div>` : '';
      if (!list.length){
        foodResultsDiv.innerHTML = tete + `<div class="food-vide">${vide || 'Aucun aliment trouvé. Essaie un autre mot ou scanne son code-barres.'}</div>`;
        return;
      }
      foodResultsDiv.innerHTML = tete + list.map(foodItemHtml).join('');
      foodResultsDiv.querySelectorAll('.food-result').forEach(btn => {
        btn.onclick = () => pickFood(listeAffichee[+btn.dataset.i]);
      });
      foodResultsDiv.querySelectorAll('.food-fav').forEach(btn => {
        btn.onclick = async () => {
          const f = listeAffichee[+btn.dataset.i];
          const ajoute = await basculerFavori(f);
          // mise à jour sur place : l'étoile se remplit d'or avec un petit rebond
          btn.classList.toggle('actif', ajoute);
          btn.setAttribute('aria-pressed', ajoute);
          btn.setAttribute('aria-label', `${ajoute ? 'Retirer' : 'Ajouter'} ${f.name} ${ajoute ? 'des' : 'aux'} favoris`);
          btn.innerHTML = etoileSvg(ajoute);
          btn.closest('.aliment-ligne').classList.toggle('favori', ajoute);
          btn.classList.remove('pop'); void btn.offsetWidth; btn.classList.add('pop');
          // dans l'onglet Favoris, un aliment retiré quitte la liste en douceur
          if (!ajoute && onglet === 'favoris' && !foodSearchInput.value.trim()){
            const ligne = btn.closest('.aliment-ligne');
            ligne.style.transition = 'opacity .25s ease, transform .25s ease';
            ligne.style.opacity = '0';
            ligne.style.transform = 'translateX(12px)';
            setTimeout(() => { const d = foodResultsDiv.scrollTop; afficherOnglet(); foodResultsDiv.scrollTop = d; }, 260);
          }
        };
      });
    };

    const afficherOnglet = () => {
      ongletsDiv.querySelectorAll('.food-onglet').forEach(b => {
        const on = b.dataset.onglet === onglet;
        b.classList.toggle('actif', on);
        b.setAttribute('aria-selected', on);
      });
      if (onglet === 'recents'){
        showFoodList(alimentsRecents(), 'Notés récemment', 'Les aliments que tu notes apparaîtront ici.');
      } else if (onglet === 'favoris'){
        showFoodList(state.favoris || [], 'Tes favoris', `Touche l\u2019étoile ${etoileSvg(false, 'etoile-texte')} d\u2019un aliment pour le retrouver ici en un geste.`);
      } else {
        showFoodList(suggestedFoods(mealTag), `Suggestions · ${saveBtn.dataset.meal}`);
      }
    };
    ongletsDiv.querySelectorAll('.food-onglet').forEach(b => {
      b.onclick = () => {
        onglet = b.dataset.onglet;
        state.foodOnglet = onglet;
        foodSearchInput.value = '';
        afficherOnglet();
      };
    });

    const chercher = q => {
      const nq = normFood(q).trim();
      const perso = [...(state.favoris || []), ...alimentsRecents(40)].filter(f => cleAliment(f).includes(nq));
      const vus = new Set();
      return [...perso, ...searchFoods(q, mealTag)].filter(f => {
        const k = cleAliment(f);
        if (vus.has(k)) return false;
        vus.add(k);
        return true;
      }).slice(0, 14);
    };
    const rafraichir = () => {
      const q = foodSearchInput.value.trim();
      if (q) showFoodList(chercher(q), `Résultats pour « ${q} »`);
      else afficherOnglet();
    };

    foodSearchInput.oninput = () => {
      foodSearchInput.classList.remove('input-error');
      rafraichir();
    };
    foodSearchInput.onfocus = () => {
      if (!foodSearchInput.value.trim()) afficherOnglet();
    };

    document.getElementById('mf_scan').onclick = () => ouvrirScanner({ repas: saveBtn.dataset.meal });

    afficherOnglet();

    qtyInput.oninput = applyFoodQty;
  }
}

// Nouvelle quantité pour un aliment déjà noté : tout est recalculé à partir
// des valeurs d'origine (pas d'arrondis qui s'accumulent d'une modif à l'autre).
async function modifierQuantiteRepas(id, nouvelle){
  const e = (state.entries.repas || []).find(x => x.id === id);
  if (!e) return;
  const q = parseFloat(nouvelle);
  if (!q || q <= 0){ showToast('Indique une quantité'); return; }
  const f = e.fields;
  if (!f.ref) f.ref = { quantite: parseFloat(f.quantite), calories: f.calories, proteines: f.proteines, glucides: f.glucides, lipides: f.lipides };
  const r = q / f.ref.quantite;
  const echelle = (v, dec) => (v === '' || v == null) ? v : String(Math.round(parseFloat(v) * r * dec) / dec);
  const previousOffsets = captureRingOffsets();
  const previousNumbers = captureCardNumbers();
  f.quantite = String(q);
  f.calories = echelle(f.ref.calories, 1);
  f.proteines = echelle(f.ref.proteines, 10);
  f.glucides = echelle(f.ref.glucides, 10);
  f.lipides = echelle(f.ref.lipides, 10);
  state.repasEditEntry = null;
  dayFlip = false;
  navFade = false;
  renderRepasDashboard();
  animateRingsFillFrom(previousOffsets);
  animateCardNumbersFrom(previousNumbers);
  showToast('Quantité mise à jour');
  try {
    await window.storage.set('entries:repas', JSON.stringify(state.entries.repas), true);
  } catch(err){ showToast('Erreur de sauvegarde'); }
}

  const nom = e.fields.description || 'cet aliment';
  const repas = REPAS_ARTICLE[e.fields.type] || 'ce repas';
  document.body.insertAdjacentHTML('beforeend', `

  const fond = document.getElementById('confirmSuppr');

function animateRingsFill(){
  const rings = app.querySelectorAll('.flame-ring-progress, .macro-ring-progress');
  rings.forEach(ring => {
    const target = ring.getAttribute('stroke-dashoffset');
    const circumference = ring.getAttribute('stroke-dasharray');
    ring.style.transition = 'none';
    ring.setAttribute('stroke-dashoffset', circumference); // vide au départ
    void ring.getBoundingClientRect();
    ring.style.transition = '';
    ring.setAttribute('stroke-dashoffset', target);
  });
}

function captureRingOffsets(){
  return Array.from(app.querySelectorAll('.flame-ring-progress, .macro-ring-progress'))
    .map(ring => ring.getAttribute('stroke-dashoffset'));
}

function animateRingsFillFrom(previousOffsets){
  const rings = app.querySelectorAll('.flame-ring-progress, .macro-ring-progress');
  rings.forEach((ring, i) => {
    const target = ring.getAttribute('stroke-dashoffset');
    const from = previousOffsets[i] != null ? previousOffsets[i] : ring.getAttribute('stroke-dasharray');
    ring.style.transition = 'none';
    ring.setAttribute('stroke-dashoffset', from);
    void ring.getBoundingClientRect();
    ring.style.transition = '';
    ring.setAttribute('stroke-dashoffset', target);
  });
}

const CARD_NUMBER_IDS = {
  cal: 'calNumberValue',
  prot: 'macroProtValue',
  carb: 'macroCarbValue',
  fat: 'macroFatValue',
};

const PROGRES_NUMBER_IDS = {
  imc: 'imcNumberValue',
  weight: 'weightNumberValue',
};

function captureNumbersFrom(idsMap){
  const get = (id) => {
    const el = document.getElementById(id);
    return el ? parseFloat(el.textContent) : null;
  };
  const out = {};
  Object.keys(idsMap).forEach(key => { out[key] = get(idsMap[key]); });
  return out;
}

function animateNumbersFrom(idsMap, previousNumbers){
  Object.keys(idsMap).forEach(key => {
    const el = document.getElementById(idsMap[key]);
    if (!el) return;
    const targetText = el.textContent;
    const to = parseFloat(targetText);
    const decimals = targetText.includes('.') ? (targetText.split('.')[1] || '').length : 0;
    const from = previousNumbers[key] != null ? previousNumbers[key] : to;
    if (from === to || isNaN(from) || isNaN(to)){ el.textContent = targetText; return; }
    const duration = 1100;
    const start = performance.now();
    const step = (now) => {
      const t = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - t, 4);
      const valeur = from + (to - from) * eased;
      el.textContent = valeur.toFixed(decimals);
      const carte = el.parentElement;
      if (carte) carte.classList.toggle('is-over', valeur < 0);
      if (t < 1) requestAnimationFrame(step);
      else el.textContent = targetText;
    };
    requestAnimationFrame(step);
  });
}

function captureCardNumbers(){ return captureNumbersFrom(CARD_NUMBER_IDS); }
function animateCardNumbersFrom(previousNumbers){ animateNumbersFrom(CARD_NUMBER_IDS, previousNumbers); }
function captureProgresNumbers(){ return captureNumbersFrom(PROGRES_NUMBER_IDS); }
function animateProgresNumbersFrom(previousNumbers){ animateNumbersFrom(PROGRES_NUMBER_IDS, previousNumbers); }

let goalColorTimer = null;

function updateHydrationUI(){
  const day = state.viewDate;
  const ml = state.water[day] || 0;
  const goal = hydrationGoalMl();
  const level = document.getElementById('waterLevel');
  if (level){
    level.style.width = waterWidthCss(ml, goal);
    level.classList.toggle('empty', ml <= 0);
  }

  const val = document.getElementById('waterMlValue');
  if (val) val.textContent = formatMl(ml);

  const sub = document.getElementById('hydrationSub');
  if (sub) sub.textContent = hydrationSubText(ml, goal);

  const card = document.getElementById('hydrationCard');
  if (card){
    clearTimeout(goalColorTimer);
    if (ml >= goal){
      // la carte passe en « objectif atteint » quand la vague a fini de la remplir
      if (!card.classList.contains('goal-reached')){
        goalColorTimer = setTimeout(() => {
          const c = document.getElementById('hydrationCard');
          if (c && (state.water[state.viewDate] || 0) >= hydrationGoalMl()){
            c.classList.add('goal-reached');
          }
        }, 400);
      }
    } else {
      card.classList.remove('goal-reached');
    }
  }

  const undo = document.getElementById('waterUndoBtn');
  if (undo) undo.disabled = !((state.waterLog[day] || []).length);

  refreshDayDots();
  rafraichirBrioche();
}

async function persistWater(){
  try {
    await window.storage.set('water', JSON.stringify(state.water), true);
    await window.storage.set('water-log', JSON.stringify(state.waterLog), true);
  } catch(e){ showToast('Erreur de sauvegarde'); }
}

async function addWater(ml){
  if (!ml || !isFinite(ml) || ml <= 0) return;
  const day = state.viewDate;
  const goal = hydrationGoalMl();
  const before = state.water[day] || 0;

  state.water[day] = before + ml;
  if (!state.waterLog[day]) state.waterLog[day] = [];
  state.waterLog[day].push(ml);

  updateHydrationUI();
  if (before < goal && state.water[day] >= goal){
    showToast('Objectif d\u2019hydratation atteint \uD83C\uDF89');
  }
  await persistWater();
}

async function undoWater(){
  const day = state.viewDate;
  const log = state.waterLog[day] || [];
  if (!log.length) return;
  const last = log.pop();
  state.water[day] = Math.max(0, (state.water[day] || 0) - last);
  if (!state.water[day]) delete state.water[day];
  if (!log.length) delete state.waterLog[day];

  updateHydrationUI();
  showToast(`\u2212${formatMl(last)} ml annulés`);
  await persistWater();
}

const RULER_MIN = 40, RULER_MAX = 160, RULER_STEP = 0.5, RULER_TICK_PX = 12;
let rulerCurrentValue = 70;

function buildRulerTicks(){
  let html = '';
  for (let v = RULER_MIN; v <= RULER_MAX + 0.001; v += RULER_STEP){
    const rounded = Math.round(v * 10) / 10;
    const isMajor = Math.abs(rounded % 5) < 0.01;
    const isMedium = !isMajor && Math.abs(rounded % 1) < 0.01;
    const cls = isMajor ? 'major' : (isMedium ? 'medium' : 'minor');
    html += `<div class="tick ${cls}" style="width:${RULER_TICK_PX}px">
      <div class="bar"></div>
    </div>`;
  }
  return html;
}

/* ---------------- Analyse du poids ----------------
   Trois échelles de lecture. Les pesées jour par jour montrent le détail, mais
   le poids oscille d'un jour à l'autre pour des raisons qui n'ont rien à voir
   avec la graisse : les semaines et les mois sont donc des moyennes, seules
   capables de dégager une tendance de fond. */
const POIDS_ECHELLES = {
  jours:    { libelle: 'Jours',    n: 30, periode: '30 derniers jours' },
  semaines: { libelle: 'Semaines', n: 12, periode: '12 dernières semaines' },
  mois:     { libelle: 'Mois',     n: 12, periode: '12 derniers mois' },
};
const MOIS_FR = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
let poidsFeuille = { echelle: 'jours', point: null, animer: true };

const poidsKg = v => v.toFixed(1).replace('.', ',') + ' kg';
// un écart ne veut rien dire sans son signe : le moins typographique se lit mieux
const poidsEcart = kg => (kg > 0 ? '+' : kg < 0 ? '−' : '') + Math.abs(kg).toFixed(1).replace('.', ',') + ' kg';

function lundiDe(cle){
  const d = new Date(cle + 'T00:00:00');
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));   // la semaine commence lundi
  return dateKey(d);
}

function poidsSerie(echelle){
  const hist = state.weightHistory || {};
  const dates = Object.keys(hist).sort();
  if (!dates.length) return [];
  const conf = POIDS_ECHELLES[echelle];
  const fin = state.viewDate || todayKey();

  if (echelle === 'jours'){
    const debut = decalerJour(fin, 1 - conf.n);
    return dates.filter(d => d >= debut && d <= fin).map(d => {
      const dt = new Date(d + 'T00:00:00');
      return { cle: d, valeur: hist[d], pesees: 1,
               court: `${dt.getDate()}/${dt.getMonth() + 1}`,
               long: formatFullDateFR(dt) };
    });
  }

  const seaux = new Map();
  for (const d of dates){
    if (d > fin) continue;
    const cle = echelle === 'semaines' ? lundiDe(d) : d.slice(0, 7);
    if (!seaux.has(cle)) seaux.set(cle, []);
    seaux.get(cle).push(hist[d]);
  }
  return [...seaux.keys()].sort().slice(-conf.n).map(cle => {
    const vals = seaux.get(cle);
    const moyenne = vals.reduce((a, b) => a + b, 0) / vals.length;
    if (echelle === 'semaines'){
      const lun = new Date(cle + 'T00:00:00');
      const dim = new Date(lun); dim.setDate(dim.getDate() + 6);
      return { cle, valeur: moyenne, pesees: vals.length,
               court: `${lun.getDate()}/${lun.getMonth() + 1}`,
               long: `Semaine du ${lun.getDate()} au ${dim.getDate()} ${MOIS_FR[dim.getMonth()]}` };
    }
    const [an, m] = cle.split('-');
    return { cle, valeur: moyenne, pesees: vals.length,
             court: MOIS_FR[+m - 1].slice(0, 4),
             long: `${MOIS_FR[+m - 1]} ${an}` };
  });
}

/* L'échelle verticale d'un poids ne part pas de zéro — sinon toutes les courbes
   seraient plates. Du coup elle est tronquée, et les bornes doivent être
   écrites sur l'axe : sans elles, un demi-kilo prend l'allure d'un effondrement. */
function poidsGraphiqueSvg(serie, objectif, cleSel, animer){
  const W = 330, H = 186, L = 42, R = 14, T = 16, B = 30;
  const pw = W - L - R, ph = H - T - B;
  const vals = serie.map(p => p.valeur);
  let bas = Math.min(...vals), haut = Math.max(...vals);
  if (objectif){ bas = Math.min(bas, objectif); haut = Math.max(haut, objectif); }
  const marge = (haut - bas) * 0.18 || 1;
  bas -= marge; haut += marge;
  const n = serie.length;
  const x = i => L + (n === 1 ? pw / 2 : i * pw / (n - 1));
  const y = v => T + ph - ((v - bas) / (haut - bas)) * ph;

  const axe = v => v.toFixed(1).replace('.', ',');
  const iSel = Math.max(0, serie.findIndex(p => p.cle === cleSel));
  const r = n > 10 ? 2.2 : 3.4;
  const pas = n > 10 ? Math.ceil(n / 5) : 1;
  const trait = state.sombre ? 'rgba(255,255,255,.12)' : '#E4D3F5';
  const chemin = serie.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.valeur).toFixed(1)).join(' ');
  const largZone = n === 1 ? pw : pw / (n - 1);

  const labelsX = serie.map((p, i) => {
    if (i !== iSel && ((n - 1 - i) % pas !== 0 || Math.abs(i - iSel) < 1.5)) return '';
    return `<text x="${x(i).toFixed(1)}" y="${H - 9}" text-anchor="middle" class="${i === iSel ? 'lab-sel' : ''}">${p.court}</text>`;
  }).join('');

  return `
    <svg class="stat-graph" viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution du poids, ${n} point${n > 1 ? 's' : ''}">
      <line x1="${L}" x2="${W - R}" y1="${T}" y2="${T}" stroke="${trait}" stroke-width="1"/>
      <line x1="${L}" x2="${W - R}" y1="${T + ph}" y2="${T + ph}" stroke="${trait}" stroke-width="1"/>
      <text x="${L - 6}" y="${T + 3}" text-anchor="end">${axe(haut)}</text>
      <text x="${L - 6}" y="${T + ph + 3}" text-anchor="end">${axe(bas)}</text>
      ${objectif ? `
        <line x1="${L}" x2="${W - R}" y1="${y(objectif).toFixed(1)}" y2="${y(objectif).toFixed(1)}" stroke="var(--stat-couleur)" stroke-opacity=".55" stroke-width="1.2" stroke-dasharray="4 4"/>
        <text x="${L - 6}" y="${(y(objectif) + 3).toFixed(1)}" text-anchor="end" class="lab-obj">${axe(objectif)}</text>` : ''}
      <line x1="${x(iSel).toFixed(1)}" x2="${x(iSel).toFixed(1)}" y1="${T}" y2="${T + ph}" stroke="${state.sombre ? '#FFFFFF' : '#1C1730'}" stroke-opacity=".14" stroke-width="1.5"/>
      ${n > 1 ? `<path d="${chemin}" class="ligne ${animer ? 'anime' : ''}" pathLength="1"/>` : ''}
      <circle cx="${x(iSel).toFixed(1)}" cy="${y(serie[iSel].valeur).toFixed(1)}" r="${r + 2}" class="halo"/>
      <circle cx="${x(iSel).toFixed(1)}" cy="${y(serie[iSel].valeur).toFixed(1)}" r="${r + 2}" class="halo retard"/>
      ${serie.map((p, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(p.valeur).toFixed(1)}" r="${i === iSel ? r + 2 : r}" class="point ${i === iSel ? 'sel' : ''}"/>`).join('')}
      ${labelsX}
      ${serie.map((p, i) => `<rect class="zone" data-point="${p.cle}" x="${(x(i) - largZone / 2).toFixed(1)}" y="0" width="${largZone.toFixed(1)}" height="${H}"/>`).join('')}
    </svg>`;
}

function commentairePoidsBrioche(serie, objectif, variation){
  if (!serie.length) return 'Note ton poids et je t\u2019accompagne \u00e0 partir de l\u00e0.';
  if (serie.length < 3){
    return 'Encore deux ou trois pes\u00e9es et je pourrai te montrer ta tendance. P\u00e8se-toi toujours dans les m\u00eames conditions, le matin de pr\u00e9f\u00e9rence.';
  }

  const kg = n => Math.abs(n).toFixed(1).replace('.', ',') + ' kg';
  const actuel = serie[serie.length - 1].valeur;
  const bouge = Math.abs(variation) >= 0.3;
  const monte = variation > 0;
  // sans objectif, on ne sait pas si monter est une bonne nouvelle : on s'en tient aux faits
  const reste = objectif ? actuel - objectif : null;
  const atteint = reste != null && Math.abs(reste) < 0.3;
  const veutMaigrir = reste != null && reste > 0;
  const veutPrendre = reste != null && reste < 0;
  const bonSens = (veutMaigrir && !monte) || (veutPrendre && monte);

  if (atteint){
    return 'Tu es pile sur ton objectif \u2014 bravo. Le plus dur commence : le tenir. Je reste avec toi \uD83C\uDF31';
  }

  if (!bouge){
    return reste == null
      ? 'Ton poids est stable sur la p\u00e9riode. Se maintenir demande autant de constance que de changer : c\u2019est d\u00e9j\u00e0 une r\u00e9ussite.'
      : `Ton poids tient bon, \u00e0 ${kg(reste)} de ton objectif. La stabilit\u00e9 n\u2019est pas du surplace : c\u2019est ce qui rend la suite solide. On repart quand tu veux.`;
  }

  // ce que la personne redoute de lire : ici Brioche rassure, elle ne sermonne pas
  if (monte && !veutPrendre){
    return reste == null
      ? `+${kg(variation)} sur la p\u00e9riode. Le poids monte et descend pour mille raisons \u2014 l\u2019eau, le sel, le sommeil \u2014 et un chiffre n\u2019efface rien de ce que tu fais. Regarde la tendance sur plusieurs semaines plut\u00f4t que jour apr\u00e8s jour.`
      : `+${kg(variation)} sur la p\u00e9riode. \u00c7a arrive \u00e0 tout le monde, et \u00e7a ne d\u00e9fait pas le chemin parcouru. Le corps varie beaucoup d\u2019un jour \u00e0 l\u2019autre : reprends tranquillement, sans rien serrer d\u2019un coup.`;
  }

  if (!monte && veutPrendre){
    return `\u2212${kg(variation)} alors que tu cherches \u00e0 prendre. Pas de panique : ajoute simplement un peu partout plut\u00f4t qu\u2019un gros repas, c\u2019est ce qui tient sur la dur\u00e9e.`;
  }

  // le poids va dans le sens voulu : on félicite, en gardant le cap visible
  if (bonSens){
    return `${monte ? '+' : '\u2212'}${kg(variation)} dans le bon sens, et plus que ${kg(reste)} pour y \u00eatre. Tu avances avec brio \u2014 continue exactement comme \u00e7a !`;
  }

  return `${monte ? '+' : '\u2212'}${kg(variation)} sur la p\u00e9riode. Tu avances, et c\u2019est le genre de progr\u00e8s qui dure quand il est r\u00e9gulier. Fixe-toi un objectif si tu veux que je suive le cap avec toi.`;
}

function poidsAnalyseHtml(){
  const serie = poidsSerie(poidsFeuille.echelle);
  const conf = POIDS_ECHELLES[poidsFeuille.echelle];
  const objectif = state.body.poidsObjectif || null;
  const onglets = Object.entries(POIDS_ECHELLES).map(([id, c]) =>
    `<button class="stat-periode ${poidsFeuille.echelle === id ? 'actif' : ''}" data-echelle="${id}">${c.libelle}</button>`).join('');
  const entete = `
    <div class="stat-evol-tete">
      <div class="stat-evol-titre">Évolution</div>
      <div class="stat-periodes stat-verre">${onglets}</div>
    </div>`;

  if (!serie.length){
    return `<div class="poids-analyse" style="--stat-couleur:${state.sombre ? '#A98DF0' : '#7B4FE0'};--stat-piste:${state.sombre ? 'rgba(255,255,255,.1)' : '#E4D3F5'};--stat-fond:rgba(123,79,224,.08)">
      ${entete}
      <div class="stat-vide" style="margin-top:14px;">Aucune pesée sur cette période.</div>
      <div class="stat-brioche stat-verre">
        <img src="${BRIOCHE_SRC}" alt="Brioche">
        <div>${commentairePoidsBrioche(serie, objectif, 0)}</div>
      </div>
    </div>`;
  }

  let iSel = serie.findIndex(p => p.cle === poidsFeuille.point);
  if (iSel < 0) iSel = serie.length - 1;
  const sel = serie[iSel];
  const precedent = iSel > 0 ? serie[iSel - 1] : null;
  const premier = serie[0];
  const variation = serie[serie.length - 1].valeur - premier.valeur;
  const vals = serie.map(p => p.valeur);
  const moyenne = vals.reduce((a, b) => a + b, 0) / vals.length;
  const pesees = serie.reduce((s, p) => s + p.pesees, 0);
  const libEchelle = poidsFeuille.echelle === 'jours' ? 'vs pesée d’avant'
    : poidsFeuille.echelle === 'semaines' ? 'vs semaine d’avant' : 'vs mois d’avant';

  const tuile = (val, lab, teinte) =>
    `<div class="stat-tuile stat-verre ${teinte || ''}"><div class="stat-tuile-val">${val}</div><div class="stat-tuile-lab">${lab}</div></div>`;

  return `
    <div class="poids-analyse" style="--stat-couleur:${state.sombre ? '#A98DF0' : '#7B4FE0'};--stat-piste:${state.sombre ? 'rgba(255,255,255,.1)' : '#E4D3F5'};--stat-fond:rgba(123,79,224,.08)">
      ${entete}
      ${poidsGraphiqueSvg(serie, objectif, sel.cle, poidsFeuille.animer)}
      <div class="stat-aide">Touche un point pour le détail de ${poidsFeuille.echelle === 'jours' ? 'ce jour' : poidsFeuille.echelle === 'semaines' ? 'cette semaine' : 'ce mois'}.</div>

      <div class="poids-sel stat-verre">
        <div class="poids-sel-tete">
          <div>
            <div class="poids-sel-quand">${sel.long}</div>
            <div class="poids-sel-valeur">${poidsKg(sel.valeur)}</div>
          </div>
          ${sel.pesees > 1 ? `<span class="poids-sel-pesees">moyenne de ${sel.pesees} pesées</span>` : ''}
        </div>
        <div class="stat-tuiles">
          ${tuile(precedent ? poidsEcart(sel.valeur - precedent.valeur) : '—', precedent ? libEchelle : 'Premier point')}
          ${tuile(iSel > 0 ? poidsEcart(sel.valeur - premier.valeur) : '—', 'Depuis le début')}
          ${tuile(objectif ? poidsEcart(sel.valeur - objectif) : '—', objectif ? 'vs objectif' : 'Pas d’objectif',
                  objectif && Math.abs(sel.valeur - objectif) < 0.3 ? 'vert' : '')}
        </div>
      </div>

      <div class="stat-evol-titre" style="margin-top:22px;">Sur ${conf.periode}</div>
      <div class="stat-bilan">
        ${tuile(poidsEcart(variation), 'Variation')}
        ${tuile(poidsKg(moyenne), 'Moyenne')}
        ${tuile(`${poidsKg(Math.min(...vals))} → ${poidsKg(Math.max(...vals))}`.replace(/ kg/g, ''), 'Extrêmes')}
      </div>
      <div class="stat-note">${pesees} pesée${pesees > 1 ? 's' : ''} sur la période.${poidsFeuille.echelle !== 'jours' ? ` Chaque point est la moyenne ${poidsFeuille.echelle === 'semaines' ? 'de sa semaine' : 'de son mois'}.` : ''}</div>

      <div class="stat-brioche stat-verre">
        <img src="${BRIOCHE_SRC}" alt="Brioche">
        <div>${commentairePoidsBrioche(serie, objectif, variation)}</div>
      </div>
    </div>`;
}

function poidsAnalyseBrancher(){
  const bloc = document.querySelector('.poids-analyse');
  if (!bloc) return;
  bloc.querySelectorAll('.stat-periode').forEach(b => {
    b.onclick = () => {
      poidsFeuille.echelle = b.dataset.echelle;
      poidsFeuille.point = null;      // la sélection n'a plus de sens d'une échelle à l'autre
      poidsFeuille.animer = true;
      poidsAnalyseRafraichir();
    };
  });
  bloc.querySelectorAll('.stat-graph .zone').forEach(z => {
    z.onclick = () => { poidsFeuille.point = z.dataset.point; poidsFeuille.animer = false; poidsAnalyseRafraichir(); };
  });
}

function poidsAnalyseRafraichir(){
  const hote = document.getElementById('poidsAnalyse');
  if (!hote) return;
  hote.innerHTML = poidsAnalyseHtml();
  poidsFeuille.animer = false;
  poidsAnalyseBrancher();
}

    const half = scrollEl.clientWidth / 2;
    trackEl.style.paddingLeft = half + 'px';
    trackEl.style.paddingRight = half + 'px';
    scrollEl.scrollLeft = ((rulerCurrentValue - RULER_MIN) / RULER_STEP) * RULER_TICK_PX + RULER_TICK_PX / 2;

    const RADIUS = 240; // rayon du cercle imaginaire (px)
    const MAX_ANGLE = 55 * Math.PI / 180;

    const curveRuler = () => {
      const center = scrollEl.clientWidth / 2 + scrollEl.scrollLeft;
      ticks.forEach(tick => {
        const tickCenter = tick.offsetLeft + tick.offsetWidth / 2;
        const dist = tickCenter - center;
        let angle = dist / RADIUS; // angle réel le long du cercle (radians)
        angle = Math.max(-MAX_ANGLE, Math.min(MAX_ANGLE, angle));
        const drop = RADIUS * (1 - Math.cos(angle)); // flèche de l'arc (vraie géométrie du cercle)
        const deg = angle * (180 / Math.PI);
        tick.style.transform = `translateY(${drop}px) rotate(${deg}deg)`;
      });
    };
    curveRuler();

    const updateDisplay = () => {
      const index = Math.round((scrollEl.scrollLeft - RULER_TICK_PX / 2) / RULER_TICK_PX);
      const value = Math.min(RULER_MAX, Math.max(RULER_MIN, RULER_MIN + index * RULER_STEP));
      rulerCurrentValue = Math.round(value * 10) / 10;
      const display = document.getElementById('weightPickerValue');
      if (display) display.textContent = `${rulerCurrentValue}kg`;
    };

    const snapToNearestTick = () => {
      const nearestIndex = Math.round((scrollEl.scrollLeft - RULER_TICK_PX / 2) / RULER_TICK_PX);
      const snapped = nearestIndex * RULER_TICK_PX + RULER_TICK_PX / 2;
      if (Math.abs(scrollEl.scrollLeft - snapped) > 0.5){
        scrollEl.scrollTo({ left: snapped, behavior: 'smooth' });
      }
    };

    let scrollEndTimer = null;
    scrollEl.onscroll = () => {
      updateDisplay();
      curveRuler();
      clearTimeout(scrollEndTimer);
      if (!isDragging){
        scrollEndTimer = setTimeout(snapToNearestTick, 120);
      }
    };

    let isDragging = false;
    let dragStartX = 0;
    let dragStartScroll = 0;

    const startDrag = (clientX) => {
      isDragging = true;
      dragStartX = clientX;
      dragStartScroll = scrollEl.scrollLeft;
      scrollEl.style.scrollSnapType = 'none';
    };
    const moveDrag = (clientX) => {
      if (!isDragging) return;
      scrollEl.scrollLeft = dragStartScroll - (clientX - dragStartX);
    };
    const endDrag = () => {
      if (!isDragging) return;
      isDragging = false;
      scrollEl.style.scrollSnapType = 'x mandatory';
      snapToNearestTick();
    };

    scrollEl.addEventListener('mousedown', (e) => { startDrag(e.clientX); e.preventDefault(); });
    window.addEventListener('mousemove', (e) => moveDrag(e.clientX));
    window.addEventListener('mouseup', endDrag);

    if (state.typingWeight){
      const exactInput = document.getElementById('weightExactInput');
      exactInput.focus();
      exactInput.select();
      const commitExact = () => {
        const v = parseFloat(exactInput.value);
        if (!isNaN(v)){
          rulerCurrentValue = Math.min(RULER_MAX, Math.max(RULER_MIN, Math.round(v * 10) / 10));
        }
        state.typingWeight = false;
        skipImcAnim = true;
        renderProgres();
      };
      exactInput.addEventListener('blur', commitExact);
      exactInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') exactInput.blur(); });
    } else {
      document.getElementById('weightPickerValue').onclick = (e) => {
        e.stopPropagation();
        state.typingWeight = true;
        skipImcAnim = true;
        renderProgres();
      };
    }

    const dateInput = document.getElementById('weightDate');
    const prevBtn = document.getElementById('weightDatePrev');
    const nextBtn = document.getElementById('weightDateNext');

    const addDays = (dateStr, n) => {
      const dt = new Date(dateStr + 'T00:00:00');
      dt.setDate(dt.getDate() + n);
      const yyyy = dt.getFullYear();
      const mm = String(dt.getMonth() + 1).padStart(2, '0');
      const dd = String(dt.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    };

    const goToDate = (raw) => {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(raw)) return;
      if (raw > todayKey()) return; // pas de saisie dans le futur
      state.weightEntryDate = raw;
      dateInput.value = raw;
      if (nextBtn) nextBtn.disabled = (raw >= todayKey());
      const v = weightForDate(raw);
      rulerCurrentValue = Math.min(RULER_MAX, Math.max(RULER_MIN, Math.round(v * 10) / 10));
      scrollEl.scrollLeft = ((rulerCurrentValue - RULER_MIN) / RULER_STEP) * RULER_TICK_PX + RULER_TICK_PX / 2;
      const display = document.getElementById('weightPickerValue');
      if (display) display.textContent = `${rulerCurrentValue}kg`;
      const dateLabel = document.getElementById('weightPanelDateLabel');
      if (dateLabel){
        if (raw === todayKey()) dateLabel.textContent = 'Mon poids aujourd\u2019hui';
        else {
          const dt2 = new Date(raw + 'T00:00:00');
          const dd2 = String(dt2.getDate()).padStart(2,'0');
          const mm2 = String(dt2.getMonth()+1).padStart(2,'0');
          dateLabel.textContent = `Mon poids du ${dd2}/${mm2}`;
        }
      }
      curveRuler();
    };
    dateInput.addEventListener('change', () => goToDate(dateInput.value));
    dateInput.addEventListener('input', () => goToDate(dateInput.value));
    if (prevBtn) prevBtn.onclick = (e) => { e.stopPropagation(); goToDate(addDays(state.weightEntryDate || todayKey(), -1)); };
    if (nextBtn){
      nextBtn.disabled = ((state.weightEntryDate || todayKey()) >= todayKey());
      nextBtn.onclick = (e) => { e.stopPropagation(); goToDate(addDays(state.weightEntryDate || todayKey(), 1)); };
    }

    document.getElementById('weightSave').onclick = (e) => { e.stopPropagation(); saveWeight(); };
  }
}

// Poids "en vigueur" un jour donné : la pesée de ce jour si elle existe,
// sinon la dernière pesée enregistrée AVANT ce jour (jamais une pesée future).
function weightAsOf(d){
  if (state.weightHistory[d] != null) return { value: state.weightHistory[d], date: d, exact: true };
  const before = Object.keys(state.weightHistory).filter(k => k < d).sort();
  if (!before.length) return { value: null, date: null, exact: false };
  const last = before[before.length - 1];
  return { value: state.weightHistory[last], date: last, exact: false };
}

function shortDateFR(d){
  if (!d) return '';
  const dt = new Date(d + 'T00:00:00');
  return `${String(dt.getDate()).padStart(2,'0')}/${String(dt.getMonth()+1).padStart(2,'0')}`;
}

function weightForDate(d){
  const w = weightAsOf(d);
  return w.value != null ? w.value : 70;
}

function isObjectiveMet(poidsVal, poidsObjectif, poidsDepart){
  if (!poidsVal || !poidsObjectif) return false;
  const losing = poidsObjectif <= (poidsDepart || poidsObjectif);
  return losing ? poidsVal <= poidsObjectif : poidsVal >= poidsObjectif;
}

function buildPulseRingsHtml(count){
  let html = '';
  for (let i = 0; i < count; i++){
    const delay = i * (2.4 / count);
    html += `<span class="pulse-ring" style="animation-delay:${delay}s;"></span>`;
  }
  return html;
}

function triggerObjectiveCelebration(){
  const div = document.createElement('div');
  div.className = 'celebration-overlay';
  div.innerHTML = `
    ${buildPulseRingsHtml(4)}
    <div class="celebration-text">Objectif atteint</div>
  `;
  document.body.appendChild(div);

  const dismiss = () => {
    if (div.classList.contains('celebration-fade-out')) return;
    div.classList.add('celebration-fade-out');
    setTimeout(() => { if (div.parentNode) div.remove(); }, 600);
  };

  div.onclick = dismiss;
  setTimeout(dismiss, 3500);
}

async function saveWeight(){
  const dateVal = state.weightEntryDate || todayKey();
  const previousNumbers = captureProgresNumbers();

  const oldPoids = state.body.poids;
  state.weightHistory[dateVal] = rulerCurrentValue;

  const latestDate = Object.keys(state.weightHistory).sort().pop();
  state.body.poids = state.weightHistory[latestDate];
  state.body.poidsDate = latestDate;
  state.editingWeight = false;
  state.weightEntryDate = null;
  renderProgres();
  refreshDayDots();
  animateProgresNumbersFrom(previousNumbers);
  if (dateVal === todayKey()){
    showToast('Poids enregistré');
  } else {
    const dt = new Date(dateVal + 'T00:00:00');
    const dd = String(dt.getDate()).padStart(2,'0');
    const mm = String(dt.getMonth()+1).padStart(2,'0');
    showToast(`Poids enregistré pour le ${dd}/${mm}`);
  }

  const wasMet = isObjectiveMet(oldPoids, state.body.poidsObjectif, state.body.poidsDepart);
  const isMetNow = isObjectiveMet(state.body.poids, state.body.poidsObjectif, state.body.poidsDepart);
  if (!wasMet && isMetNow){
    triggerObjectiveCelebration();
  }

  try {
    await window.storage.set('body', JSON.stringify(state.body), true);
    await window.storage.set('weight-history', JSON.stringify(state.weightHistory), true);
  } catch(e){ showToast('Erreur de sauvegarde'); }
}

// Mots à écarter des menus : aliments détestés + saisies libres des interdits.
function tasteBannedTerms(t){
  if (!t) return [];
  const terms = [];
  Object.keys(t.aliments || {}).forEach(id => {
    if (t.aliments[id] === 'no'){
      const f = TASTE_FOODS.find(x => x.id === id);
      if (f) terms.push(f.label);
    }
  });
  [t.jamais, t.evite, t.allergies, t.deteste].forEach(v => {
    (v || '').split(/[,;\n]/).forEach(w => {
      const c = w.trim();
      if (c.length < 3) return;
      terms.push(c);
      const syn = TERM_SYNONYMS[noAccent(c)];
      if (syn) terms.push(...syn);
    });
  });
  return terms;
}

        <button class="onboard-back" id="tgBack" aria-label="Étape précédente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"/></svg>${step > 1 ? 'Retour' : 'Recettes'}</button>
        <div>
          <div class="onboard-step-count">Étape ${step} sur ${steps.length}</div>
          <div class="onboard-bar"><div class="onboard-bar-fill" style="width:${(step / steps.length) * 100}%"></div></div>
        </div>
      </div>
      <div class="onboard-step-body ${state.tasteDir === 'back' ? 'ob-anim-back' : 'ob-anim-fwd'}">
        <h1>${title}</h1>
        ${stepHtml}
      </div>
    </div>
  `;

  const barFill = app.querySelector('.onboard-bar-fill');
  if (barFill){
    const pct = (step / steps.length) * 100;
    const from = state.tasteBarPct == null ? pct : state.tasteBarPct;
    barFill.style.width = from + '%';
    requestAnimationFrame(() => { barFill.style.width = pct + '%'; });
    state.tasteBarPct = pct;
  }

  sauverProgressionGouts();

  document.getElementById('tgBack').onclick = () => {
    state.tasteDir = 'back';
    if (step === 1){
      state.tasteBarPct = null;
      state.screen = 'recettes';
    } else {
      state.tasteStep--;
    }
    render();
  };

  app.querySelectorAll('.taste-opt').forEach(btn => {
    btn.onclick = () => {
      state.tasteData[btn.dataset.field] = btn.dataset.value;
      state.tasteDir = 'fwd';
      if (btn.dataset.stay){ render(); return; }
      state.tasteStep++;
      render();
    };
  });

  app.querySelectorAll('.food-choice').forEach(btn => {
    btn.onclick = () => {
      const aliments = state.tasteData.aliments || {};
      const food = btn.dataset.food;
      aliments[food] = aliments[food] === btn.dataset.rating ? undefined : btn.dataset.rating;
      state.tasteData.aliments = aliments;
      // on ne re-rend que la ligne concernée, pour ne pas relancer l'animation d'étape
      btn.parentElement.querySelectorAll('.food-choice').forEach(b => {
        b.classList.toggle('selected', aliments[food] === b.dataset.rating);
      });
    };
  });

  const next = document.getElementById('tg_next');
  if (next){
    next.onclick = async () => {
      state.tasteDir = 'fwd';
      const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
      if (key === 'favoris'){
        state.tasteData.plat = val('tg_plat');
        state.tasteData.aliment = val('tg_aliment');
        state.tasteData.dessert = val('tg_dessert');
      }
      if (key === 'interdits'){
        state.tasteData.jamais = val('tg_jamais');
        state.tasteData.evite = val('tg_evite');
        state.tasteData.allergies = val('tg_allergies');
        state.tasteData.deteste = val('tg_deteste');
      }
      if (key === 'repas' && !state.tasteData.repasSemaine){ showToast('Choisis un rythme'); return; }

      if (key !== 'recap'){ state.tasteStep++; render(); return; }

      state.tastes = { ...state.tasteData };
      state.dayMenu = null;
      state.tasteJustDone = true;
      state.tasteProgress = null;
      oublierProgression('taste-progress');
      try {
        await window.storage.set('tastes', JSON.stringify(state.tastes), true);
        showToast('Goûts enregistrés');
      } catch(e){ showToast('Erreur de sauvegarde'); }
      state.tasteBarPct = null;
      state.screen = 'recettes';
      render();
    };
  }
}

function menuCatDef(id){ return MENU_CATS.find(c => c.id === id) || MENU_CATS[0]; }

// Un aliment est écarté s'il correspond à un interdit, une allergie ou un aliment détesté.
function foodMatchesTerms(food, terms){
  if (!terms.length) return false;
  const hay = noAccent(food.name + ' ' + (food.kw || ''));
  return terms.some(t => {
    const n = noAccent(t);
    return hay.includes(n) || (n.length > 4 && hay.includes(n.slice(0, -1)));
  });
}

function slotPool(cats, tag, banned, avoid){
  let pool = FOOD_DB.filter(f => cats.includes(f.cat) && !foodMatchesTerms(f, banned));
  if (avoid && avoid.length){
    pool = pool.filter(f => !avoid.some(a => noAccent(f.name).includes(noAccent(a))));
  }
  if (tag !== 'DE'){
    const tagged = pool.filter(f => (f.meals || '').includes(tag));
    if (tagged.length >= 3) pool = tagged;
  }
  return pool;
}

function foodLine(food, facteur){
  const base = food.portion || 100;
  // les quantités sont arrondies à 5 g près, pour rester pesables
  const grammes = facteur && facteur !== 1
    ? Math.max(10, Math.round((base * facteur) / 5) * 5)
    : base;
  const ratio = grammes / 100;
  return {
    name: food.name,
    grammes,
    ajustee: grammes !== base,
    portionLabel: food.portionLabel || `${base} g`,
    cal: Math.round(food.cal * ratio),
    prot: Math.round(food.prot * ratio),
    carb: Math.round(food.carb * ratio),
    fat: Math.round(food.fat * ratio),
  };
}

// Les portions par défaut tombent rarement juste : on ajuste la quantité de la
// source de protéines puis celle du féculent pour coller aux cibles du repas.
function ajusterPortions(picks, target, protTarget){
  const facteurs = picks.map(() => 1);
  const borne = f => Math.max(0.6, Math.min(2, f));
  const lignes = () => picks.map((f, i) => foodLine(f, facteurs[i]));

  if (protTarget){
    let iProt = 0;
    picks.forEach((f, i) => { if (f.prot > picks[iProt].prot) iProt = i; });
    const l = lignes();
    const autres = l.reduce((a, x, i) => a + (i === iProt ? 0 : x.prot), 0);
    const besoin = protTarget - autres;
    if (besoin > 0 && l[iProt].prot > 0){
      facteurs[iProt] = borne(besoin / l[iProt].prot);
    }
  }

  let iCarb = 0;
  picks.forEach((f, i) => { if (f.carb > picks[iCarb].carb) iCarb = i; });
  const l2 = lignes();
  const totalActuel = l2.reduce((a, x) => a + x.cal, 0);
  const manque = target - totalActuel;
  if (Math.abs(manque) > 15 && l2[iCarb].cal > 0){
    facteurs[iCarb] = borne(facteurs[iCarb] * (1 + manque / l2[iCarb].cal));
  }

  return lignes();
}

// On tire plusieurs menus au hasard et on garde celui qui colle le mieux
// à la cible calorique du repas, avec un bonus pour les aliments adorés.
function buildMenu(catId, caloriesCible, goals){
  const cat = menuCatDef(catId);
  const t = state.tastes;
  const banned = tasteBannedTerms(t);
  const lovedTerms = t
    ? TASTE_FOODS.filter(f => (t.aliments || {})[f.id] === 'love').map(f => f.label)
        .concat([t.plat, t.aliment, t.dessert].filter(Boolean))
    : [];

  const pools = cat.slots.map(cats => slotPool(cats, cat.id, banned, cat.avoid));
  if (pools.some(pool => pool.length === 0)) return null;

  const base = caloriesCible || (state.macroGoals && state.macroGoals.calories) || 2000;
  const target = Math.round(base * cat.share);
  const objectifs = goals || state.macroGoals;
  const protTarget = objectifs && objectifs.proteines ? objectifs.proteines * (cat.protShare || cat.share) : null;

  const candidates = [];
  for (let i = 0; i < 140; i++){
    const picks = pools.map(pool => pool[Math.floor(Math.random() * pool.length)]);
    if (new Set(picks.map(f => f.name)).size !== picks.length) continue;
    const lines = picks.map(foodLine);
    const total = lines.reduce((a, l) => a + l.cal, 0);
    const loved = picks.filter(f => foodMatchesTerms(f, lovedTerms)).length;
    let score = Math.abs(total - target) - loved * 70;
    if (protTarget){
      const prot = lines.reduce((a2, l) => a2 + l.prot, 0);
      score += Math.abs(prot - protTarget) * 10;
    }
    if (t && t.priorite === 'equilibre'){
      const fatShare = total ? (lines.reduce((a2, l) => a2 + l.fat, 0) * 9) / total : 0;
      if (fatShare > 0.4) score += (fatShare - 0.4) * 600;
    }
    candidates.push({ picks, lines, total, target, loved, score });
  }
  if (!candidates.length) return null;

  // On garde tous les menus proches de la cible et on en tire un au hasard :
  // sinon le même trio ressort à chaque fois.
  candidates.sort((a, b) => a.score - b.score);
  const seuil = Math.max(candidates[0].score + 90, 60);
  const proches = candidates.filter(c => c.score <= seuil);
  const best = proches[Math.floor(Math.random() * proches.length)];
  best.lines = ajusterPortions(best.picks, target, protTarget);
  best.total = best.lines.reduce((a, l) => a + l.cal, 0);

  best.prot = best.lines.reduce((a, l) => a + l.prot, 0);
  best.carb = best.lines.reduce((a, l) => a + l.carb, 0);
  best.fat  = best.lines.reduce((a, l) => a + l.fat, 0);
  return best;
}

function addMenuToJournal(cat, menu){
  const entry = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    date: state.viewDate || todayKey(),
    timestamp: Date.now(),
    fields: {
      type: cat.mealType,
      description: menu.lines.map(l => `${l.name} (${l.portionLabel})`).join(', '),
      calories: String(menu.total),
      proteines: String(menu.prot),
      glucides: String(menu.carb),
      lipides: String(menu.fat),
    },
  };
  state.entries.repas = state.entries.repas || [];
  state.entries.repas.push(entry);

  // Bascule immédiate sur le tableau de bord : on n'attend pas la sauvegarde,
  // le menu est déjà dans l'état affiché.
  state.menuCat = null;
  state.menuPick = null;
  state.viewDate = state.viewDate || todayKey();
  state.openCat = 'repas';
  state.screen = 'category';
  navFade = true;
  render();

  // Écriture en arrière-plan.
  Promise.resolve()
    .then(() => window.storage.set('entries:repas', JSON.stringify(state.entries.repas), true))
    .then(() => showToast('Menu ajouté à ton journal'))
    .catch(() => showToast('Erreur de sauvegarde'));
}

// Journée type détaillée, affichée en bas de l'onglet Recettes une fois
// le questionnaire des goûts rempli.
function buildDayMenu(){
  const goals = state.macroGoals;
  if (!goals) return null;
  const repas = ['P','D','S','N']
    .map(id => ({ cat: menuCatDef(id), menu: buildMenu(id, goals.calories, goals) }))
    .filter(r => r.menu);
  if (!repas.length) return null;
  const somme = cle => repas.reduce((a, r) => a + r.menu[cle], 0);
  return {
    repas,
    total: somme('total'),
    prot: somme('prot'),
    carb: somme('carb'),
    fat: somme('fat'),
  };
}

    </div>
    ${t ? dayMenuCard() : ''}
    </div>
  ` + bottomNavHtml('recettes');

    state.tasteDir = 'fwd';

    state.screen = 'gouts';

  const startBtn = document.getElementById('tasteStart');

/* ---------------- Espace compte ----------------
   L'écran rassemble tout ce qui appartient à la personne : sa photo, son
   pseudo, son compte, son profil sportif et ses objectifs. Les cartes sont
   celles du reste de l'app (.recap-card) ; la feuille « compte-espace » ne
   règle que ce qui leur manque ici. */

const AVATAR_TAILLE = 320;    // côté de la photo enregistrée, en pixels
const AVATAR_POIDS_MAX = 900000; // ~900 ko de data URL : au-delà on refuse

/* La photo est recadrée en carré depuis son centre, réduite, puis convertie
   en JPEG. Elle est enregistrée telle quelle comme n'importe quelle autre
   donnée du compte, donc elle suit la personne d'un appareil à l'autre. */
function reduireAvatar(fichier, cote = AVATAR_TAILLE){
  return new Promise((ok, ko) => {
    const lecteur = new FileReader();
    lecteur.onerror = () => ko(new Error('lecture'));
    lecteur.onload = () => {
      const img = new Image();
      img.onerror = () => ko(new Error('image'));
      img.onload = () => {
        const src = Math.min(img.naturalWidth, img.naturalHeight);
        if (!src) return ko(new Error('image'));
        const dx = (img.naturalWidth  - src) / 2;
        const dy = (img.naturalHeight - src) / 2;
        const c = document.createElement('canvas');
        c.width = c.height = cote;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, cote, cote);
        ctx.drawImage(img, dx, dy, src, src, 0, 0, cote, cote);
        ok(c.toDataURL('image/jpeg', 0.82));
      };
      img.src = lecteur.result;
    };
    lecteur.readAsDataURL(fichier);
  });
}

async function enregistrerAvatar(fichier){
  if (!fichier) return;
  if (!/^image\//.test(fichier.type)){ showToast('Choisis une image'); return; }
  const zone = document.querySelector('.rg-avatar-zone');
  if (zone) zone.insertAdjacentHTML('beforeend', '<div class="rg-avatar-charge">…</div>');
  let donnee;
  try {
    donnee = await reduireAvatar(fichier);
  } catch(e){
    if (zone) zone.querySelector('.rg-avatar-charge')?.remove();
    showToast('Image illisible');
    return;
  }
  if (donnee.length > AVATAR_POIDS_MAX){
    if (zone) zone.querySelector('.rg-avatar-charge')?.remove();
    showToast('Image trop lourde');
    return;
  }
  state.avatar = donnee;
  render();
  try { await window.storage.set('avatar', donnee, true); showToast('Photo mise à jour'); }
  catch(e){ showToast('Erreur de sauvegarde'); }
}

async function supprimerAvatar(){
  state.avatar = null;
  render();
  try { await window.storage.delete('avatar', true); showToast('Photo retirée'); }
  catch(e){ showToast('Erreur de sauvegarde'); }
}

   l'écran d'accueil et en tête de cet écran. */
function ouvrirPseudo(){
  if (document.getElementById('pseudoFenetre')) return;
  const esc = t => String(t == null ? '' : t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
  const actuel = state.userName || '';
  document.body.insertAdjacentHTML('beforeend', `

      <div class="recap-card rg-fenetre" role="dialog" aria-modal="true" aria-labelledby="pseudoTitre">

        <button class="btn-primary" id="pseudoValider">Enregistrer</button>
        <button class="rg-fenetre-annuler" id="pseudoAnnuler">Annuler</button>
      </div>
    </div>`);
  const fond = document.getElementById('pseudoFenetre');
  const champ = document.getElementById('pseudoChamp');
  const valider = document.getElementById('pseudoValider');
  const surEchap = ev => { if (ev.key === 'Escape') fermer(); };
  function fermer(){
    document.removeEventListener('keydown', surEchap);
    fond.classList.add('sortie');
    setTimeout(() => fond.remove(), 180);
  }
  // rien à enregistrer tant que le pseudo est vide ou inchangé
  const majValider = () => { valider.disabled = !champ.value.trim() || champ.value.trim() === actuel; };
  majValider();
  champ.addEventListener('input', majValider);
  champ.addEventListener('keydown', ev => { if (ev.key === 'Enter' && !valider.disabled) enregistrer(); });

  async function enregistrer(){
    const nom = champ.value.trim();
    if (!nom) return;
    state.userName = nom;

    render();

  document.getElementById('pseudoAnnuler').onclick = fermer;
  fond.onclick = ev => { if (ev.target === fond) fermer(); };

  champ.focus();
  champ.select();
}

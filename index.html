<script>
/* ---------------- Enregistrement des données ----------------
   Dans Claude, l'app utilise le stockage fourni par Claude (window.storage).
   En ligne (Netlify, écran d'accueil du téléphone), ce stockage n'existe pas :
   on le remplace par le stockage du navigateur, avec exactement le même
   fonctionnement. Les données restent sur l'appareil. */
(function(){
  if (window.storage) return;
  window.__brioEnLigne = true;
  const P = 'brio:';
  let ls = null;
  try { ls = window.localStorage; ls.setItem(P + '__test', '1'); ls.removeItem(P + '__test'); } catch(e){ ls = null; }
  const secours = {};
  const lire = k => ls ? ls.getItem(P + k) : (k in secours ? secours[k] : null);
  window.storage = {
    async get(key, shared){
      const v = lire(key);
      if (v === null) throw new Error('Clé introuvable : ' + key);
      return { key, value: v, shared: !!shared };
    },
    async set(key, value, shared){
      const v = String(value);
      if (ls) ls.setItem(P + key, v); else secours[key] = v;
      return { key, value: v, shared: !!shared };
    },
    async delete(key, shared){
      if (ls) ls.removeItem(P + key); else delete secours[key];
      return { key, deleted: true, shared: !!shared };
    },
    async list(prefix, shared){
      prefix = prefix || '';
      const keys = ls
        ? Array.from({ length: ls.length }, (_, i) => ls.key(i)).filter(k => k && k.startsWith(P + prefix)).map(k => k.slice(P.length))
        : Object.keys(secours).filter(k => k.startsWith(prefix));
      return { keys, prefix, shared: !!shared };
    },
  };
  // demande au navigateur de ne pas effacer ces données pour faire de la place
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
})();

/* ---------------- Comptes et données rattachés à un compte (Supabase) ----------------
   En ligne, les données ne vivent plus seulement sur l'appareil : elles sont
   rattachées à un compte, donc on les retrouve sur un autre téléphone.
   Le stockage du navigateur reste utilisé comme cache : l'app s'ouvre et répond
   sans réseau, et les écritures faites hors connexion repartent au retour du réseau.

   La clé ci-dessous est publique, et c'est prévu ainsi : ce sont les règles RLS
   de Supabase qui empêchent quelqu'un de lire les données d'un autre, pas le
   secret de la clé. La clé « service_role », elle, ne doit jamais venir ici. */
/* Marque une erreur déjà rédigée pour être lue par quelqu'un : elle s'affichera
   telle quelle. Les autres — celles du navigateur ou du serveur, en anglais —
   passent en détail technique sous une phrase claire. Voir messageHumain(). */
function erreurLisible(msg){
  const e = new Error(msg);
  e.lisible = true;
  return e;
}

const NUAGE_URL = 'https://eebvykkxtukwctofheqn.supabase.co';
const NUAGE_CLE = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVlYnZ5a2t4dHVrd2N0b2ZoZXFuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzODQyOTksImV4cCI6MjEwNDk2MDI5OX0.ubKPKXqdwzRgUm7DdM7O0SaSoklOT7eDT7FFgDAsNDc';

const nuage = (function(){
  const CLE_SESSION  = 'brio:session-nuage';
  const CLE_ATTENTE  = 'brio:attente-nuage';
  const PREFIXE_ANON = 'brio:';
  // les clés de service ne sont pas des données de l'utilisateur : elles ne montent
  // pas dans le nuage. « compte-dernier » en fait partie : c'est un repère propre
  // à cet appareil, il n'a aucun sens sur un autre téléphone.
  const RESERVEES = ['session-nuage', 'attente-nuage', 'compte-dernier', 'compte', 'session'];

  let session = null;     // { access_token, refresh_token, uid, email }
  let stockage = null;    // cache local rattaché au compte connecté
  let attente = null;     // clés modifiées pas encore envoyées
  let envoiPrevu = null;
  let demarre = false;

  const actif = () => !!(window.__brioEnLigne && NUAGE_URL && NUAGE_CLE);
  const connecte = () => !!(session && session.access_token);

  function lireJSON(cle, defaut){
    try { const v = localStorage.getItem(cle); return v ? JSON.parse(v) : defaut; } catch(e){ return defaut; }
  }
  function ecrireJSON(cle, val){
    try { val === null ? localStorage.removeItem(cle) : localStorage.setItem(cle, JSON.stringify(val)); } catch(e){}
  }

  /* ----- le cache local du compte : même interface que window.storage ----- */
  function creerStockage(uid){
    const P = 'briou:' + uid + ':';
    let ls = null;
    try { ls = window.localStorage; ls.setItem(P + '__test', '1'); ls.removeItem(P + '__test'); } catch(e){ ls = null; }
    const memoire = {};
    const lire    = k => ls ? ls.getItem(P + k) : (k in memoire ? memoire[k] : null);
    const ecrire  = (k, v) => { if (ls) ls.setItem(P + k, v); else memoire[k] = v; };
    const effacer = k => { if (ls) ls.removeItem(P + k); else delete memoire[k]; };
    const clefs   = () => ls
      ? Array.from({ length: ls.length }, (_, i) => ls.key(i)).filter(k => k && k.startsWith(P)).map(k => k.slice(P.length))
      : Object.keys(memoire);

    return {
      lire, ecrire, effacer, clefs,
      async get(key, shared){
        const v = lire(key);
        if (v === null) throw new Error('Clé introuvable : ' + key);
        return { key, value: v, shared: !!shared };
      },
      async set(key, value, shared){
        const v = String(value);
        ecrire(key, v);
        marquer(key);
        return { key, value: v, shared: !!shared };
      },
      async delete(key, shared){
        effacer(key);
        marquer(key);
        return { key, deleted: true, shared: !!shared };
      },
      async list(prefix, shared){
        prefix = prefix || '';
        return { keys: clefs().filter(k => k.startsWith(prefix)), prefix, shared: !!shared };
      },
    };
  }

  /* ----- appels à Supabase ----- */
  async function requete(chemin, options, jetonUtilisateur){
    const entetes = Object.assign({
      apikey: NUAGE_CLE,
      'Content-Type': 'application/json',
      Authorization: 'Bearer ' + ((jetonUtilisateur && session && session.access_token) || NUAGE_CLE),
    }, options.headers || {});
    return fetch(NUAGE_URL + chemin, Object.assign({}, options, { headers: entetes }));
  }

  // le jeton d'accès expire au bout d'une heure : on le renouvelle sans rien demander
  async function rafraichir(){
    if (!session || !session.refresh_token) return false;
    try {
      const rep = await requete('/auth/v1/token?grant_type=refresh_token', {
        method: 'POST', body: JSON.stringify({ refresh_token: session.refresh_token }),
      });
      if (!rep.ok) return false;
      poserSession(await rep.json());
      return connecte();
    } catch(e){ return false; }
  }

  // une requête de données : si le jeton vient d'expirer, on renouvelle et on rejoue une fois
  async function donnees(chemin, options){
    let rep = await requete(chemin, options, true);
    if (rep.status === 401 && await rafraichir()) rep = await requete(chemin, options, true);
    return rep;
  }

  function poserSession(d){
    if (!d || !d.access_token) return;
    session = {
      access_token: d.access_token,
      refresh_token: d.refresh_token || (session && session.refresh_token),
      uid: (d.user && d.user.id) || (session && session.uid),
      email: (d.user && d.user.email) || (session && session.email),
    };
    ecrireJSON(CLE_SESSION, session);
  }

  /* Le serveur répond en anglais. Rien de ce qu'il dit ne doit arriver tel quel
     sous les yeux de quelqu'un : on traduit ce qu'on sait traduire, et le reste
     est relégué en petit, comme détail technique, sous une phrase claire. */
  const petitDetail = brut => brut
    ? '<br><small>Détail technique : ' + String(brut).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').slice(0, 160) + '</small>'
    : '';

  async function messageErreur(rep){
    let d = {};
    try { d = await rep.json(); } catch(e){}
    const brut = String(d.error_description || d.msg || d.message || d.error || '');
    if (/invalid login credentials/i.test(brut))  return 'E-mail ou mot de passe incorrect.';
    if (/already registered|already exists/i.test(brut)) return 'Un compte existe déjà avec cet e-mail. Utilise l’onglet « Se connecter ».';
    if (/email not confirmed/i.test(brut))        return 'Ton e-mail n’est pas encore confirmé. Ouvre le lien qu’on t’a envoyé par e-mail.';
    if (/password/i.test(brut) && /short|least|weak/i.test(brut)) return 'Mot de passe trop court : il en faut 8 caractères minimum.';
    if (/same.*password|should be different/i.test(brut)) return 'Ce mot de passe est identique à l’ancien. Choisis-en un autre.';
    if (/rate limit|too many|over_email_send/i.test(brut)) return 'Trop d’essais d’affilée. Attends une minute avant de réessayer.';
    // panne du service d'envoi : la personne n'y peut rien, autant le dire ainsi
    if (/sending|smtp|mailer/i.test(brut))        return 'L’e-mail n’a pas pu être envoyé. Ce n’est pas toi : le service d’envoi ne répond pas. Réessaie dans un moment.';
    if (/expired|invalid.*token|token.*invalid/i.test(brut)) return 'Ce lien n’est plus valable. Redemande-en un.';
    if (/not found|no user/i.test(brut))          return 'Aucun compte ne correspond à cette adresse.';
    if (rep.status === 401 || rep.status === 403) return 'Accès refusé. Reconnecte-toi, puis réessaie.' + petitDetail(brut);
    if (rep.status >= 500)                        return 'Le serveur rencontre un problème. Réessaie dans un moment.' + petitDetail(brut);
    return 'La demande n’a pas abouti.' + petitDetail(brut || 'code ' + rep.status);
  }

  /* ----- création de compte et connexion ----- */
  async function inscrire(email, motDePasse){
    const rep = await requete('/auth/v1/signup', {
      method: 'POST', body: JSON.stringify({ email, password: motDePasse }),
    });
    if (!rep.ok) throw erreurLisible(await messageErreur(rep));
    const d = await rep.json();
    // Supabase peut exiger une confirmation par e-mail : il n'y a alors pas de jeton
    if (!d.access_token) return { confirmation: true };
    poserSession(d);
    return { confirmation: false };
  }

  async function connecter(email, motDePasse){
    const rep = await requete('/auth/v1/token?grant_type=password', {
      method: 'POST', body: JSON.stringify({ email, password: motDePasse }),
    });
    if (!rep.ok) throw erreurLisible(await messageErreur(rep));
    poserSession(await rep.json());
    if (!connecte()) throw erreurLisible('Connexion impossible : le serveur n’a pas renvoyé de session.');
    return { confirmation: false };
  }

  /* ----- mot de passe oublié -----
     Supabase envoie un e-mail dont le lien ramène ici. Selon le réglage du
     projet, il ramène soit avec une session toute faite dans le « # » de
     l'adresse, soit avec un jeton à échanger. Les deux sont acceptés. */
  const adresseRetour = () => location.origin + location.pathname;

  async function demanderReinit(email){
    const rep = await requete('/auth/v1/recover?redirect_to=' + encodeURIComponent(adresseRetour()), {
      method: 'POST', body: JSON.stringify({ email }),
    });
    // un e-mail inconnu renvoie tout de même un succès : c'est voulu côté
    // Supabase, pour ne pas révéler qui a un compte
    if (!rep.ok) throw erreurLisible(await messageErreur(rep));
  }

  // Lit ce que le lien de l'e-mail a déposé dans l'adresse.
  function lireLienReinit(){
    const H = new URLSearchParams((location.hash || '').replace(/^#/, ''));
    const Q = new URLSearchParams(location.search || '');
    const lire = c => H.get(c) || Q.get(c);

    if (lire('error') || lire('error_code')){
      const d = lire('error_description') || '';
      return { genre: 'erreur', message: /expired|invalid/i.test(d + lire('error_code'))
        ? 'Ce lien n’est plus valable. Redemande-en un, ils n’ont qu’une heure de validité.'
        : (d.replace(/\+/g, ' ') || 'Ce lien n’a pas fonctionné.') };
    }
    if (lire('type') !== 'recovery') return null;
    if (lire('access_token')) return { genre: 'session', access_token: lire('access_token'), refresh_token: lire('refresh_token') };
    const jeton = lire('token_hash') || lire('token');
    if (jeton) return { genre: 'jeton', jeton };
    return null;
  }

  // Efface les jetons de la barre d'adresse : ils n'ont pas à y rester.
  function nettoyerAdresse(){
    try { history.replaceState(null, '', adresseRetour()); } catch(e){}
  }

  async function ouvrirSessionReinit(lien){
    if (lien.genre === 'session'){
      poserSession({ access_token: lien.access_token, refresh_token: lien.refresh_token });
      // la session du lien ne dit pas qui on est : on complète avec le profil
      try {
        const rep = await donnees('/auth/v1/user', { method: 'GET' });
        if (rep.ok){ const u = await rep.json(); session.uid = u.id; session.email = u.email; ecrireJSON(CLE_SESSION, session); }
      } catch(e){}
    } else {
      const rep = await requete('/auth/v1/verify', {
        method: 'POST', body: JSON.stringify({ type: 'recovery', token_hash: lien.jeton }),
      });
      if (!rep.ok) throw erreurLisible(await messageErreur(rep));
      poserSession(await rep.json());
    }
    if (!connecte() || !session.uid) throw erreurLisible('Ce lien n’a pas permis d’ouvrir ta session. Redemande un lien.');
  }

  async function changerMotDePasse(nouveau){
    const rep = await donnees('/auth/v1/user', {
      method: 'PUT', body: JSON.stringify({ password: nouveau }),
    });
    if (!rep.ok) throw erreurLisible(await messageErreur(rep));
  }

  async function deconnecter(){
    try { await requete('/auth/v1/logout', { method: 'POST' }, true); } catch(e){}
    session = null; stockage = null; attente = null;
    ecrireJSON(CLE_SESSION, null);
    ecrireJSON(CLE_ATTENTE, null);
    window.storage = stockageAnonyme;
  }

  /* ----- lecture et écriture des données ----- */
  async function tirerTout(){
    const rep = await donnees('/rest/v1/donnees?select=cle,valeur', { method: 'GET' });
    if (!rep.ok) throw erreurLisible(await messageErreur(rep));
    const lignes = await rep.json();
    const sortie = {};
    for (const l of lignes) sortie[l.cle] = l.valeur;
    return sortie;
  }

  function marquer(cle){
    if (!connecte() || RESERVEES.includes(cle)) return;
    attente = attente || new Set(lireJSON(CLE_ATTENTE, []));
    attente.add(cle);
    ecrireJSON(CLE_ATTENTE, [...attente]);
    clearTimeout(envoiPrevu);
    // on groupe les écritures rapprochées en un seul envoi
    envoiPrevu = setTimeout(() => { vider().catch(() => {}); }, 600);
  }

  async function vider(){
    if (!connecte() || !stockage) return;
    attente = attente || new Set(lireJSON(CLE_ATTENTE, []));
    if (!attente.size) return;

    const lot = [...attente];
    const aEcrire = [], aSupprimer = [];
    for (const cle of lot){
      const valeur = stockage.lire(cle);
      valeur === null ? aSupprimer.push(cle) : aEcrire.push({ user_id: session.uid, cle, valeur });
    }

    if (aEcrire.length){
      const rep = await donnees('/rest/v1/donnees?on_conflict=user_id,cle', {
        method: 'POST',
        headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
        body: JSON.stringify(aEcrire),
      });
      if (!rep.ok) throw erreurLisible(await messageErreur(rep));
    }
    for (const cle of aSupprimer){
      const rep = await donnees('/rest/v1/donnees?cle=eq.' + encodeURIComponent(cle), { method: 'DELETE' });
      if (!rep.ok) throw erreurLisible(await messageErreur(rep));
    }

    // seules les clés réellement envoyées sortent de la file : celles modifiées
    // entre-temps restent en attente pour le prochain envoi
    for (const cle of lot) attente.delete(cle);
    ecrireJSON(CLE_ATTENTE, [...attente]);
  }

  /* ----- ce que l'appareil contient déjà, avant tout compte ----- */
  function donneesAnonymes(){
    const sortie = {};
    try {
      for (let i = 0; i < localStorage.length; i++){
        const brut = localStorage.key(i);
        if (!brut || !brut.startsWith(PREFIXE_ANON)) continue;
        const cle = brut.slice(PREFIXE_ANON.length);
        if (RESERVEES.includes(cle)) continue;
        sortie[cle] = localStorage.getItem(brut);
      }
    } catch(e){}
    return sortie;
  }

  function brancher(){
    stockage = creerStockage(session.uid);
    window.storage = stockage;
  }

  /* Après une connexion réussie : on branche le stockage du compte, puis soit on
     récupère ce qui est déjà en ligne, soit — si le compte est vide — on y fait
     monter ce qui avait été saisi sur cet appareil avant la création du compte. */
  async function apresConnexion(){
    brancher();
    let distant = null;
    try { distant = await tirerTout(); } catch(e){ distant = null; }

    if (distant && !Object.keys(distant).length){
      const local = donneesAnonymes();
      if (Object.keys(local).length){
        for (const [cle, valeur] of Object.entries(local)){ stockage.ecrire(cle, valeur); marquer(cle); }
        try { await vider(); } catch(e){}
        return;
      }
    }
    if (distant) for (const [cle, valeur] of Object.entries(distant)) stockage.ecrire(cle, valeur);
  }

  /* Au lancement : on retrouve la session, on rebranche le stockage du compte et
     on se resynchronise. La synchronisation ne doit jamais retarder l'ouverture
     de l'app : passé 4 secondes, on démarre sur le cache et elle continue seule. */
  async function demarrer(){
    if (!actif() || demarre) return;
    demarre = true;
    session = lireJSON(CLE_SESSION, null);
    if (!connecte()) return;
    brancher();

    const sync = (async () => {
      try { await vider(); } catch(e){}
      try {
        const distant = await tirerTout();
        for (const [cle, valeur] of Object.entries(distant)){
          if (!(attente && attente.has(cle))) stockage.ecrire(cle, valeur);
        }
      } catch(e){}
    })();
    await Promise.race([sync, new Promise(ok => setTimeout(ok, 4000))]);
  }

  // les écritures restées en attente repartent dès que la connexion revient
  window.addEventListener('online', () => { vider().catch(() => {}); });

  const stockageAnonyme = window.storage;

  return {
    actif, connecte, demarrer, inscrire, connecter, deconnecter, apresConnexion, vider,
    demanderReinit, lireLienReinit, ouvrirSessionReinit, changerMotDePasse, nettoyerAdresse,
    email: () => (session && session.email) || null,
    compteLocal: () => lireJSON('brio:compte-dernier', null),
    memoriserCompte: email => ecrireJSON('brio:compte-dernier', { email }),
  };
})();

/* Dans Claude, le stockage peut être indisponible pour certains aperçus
   (« Storage is not available for this artifact »). On vérifie une fois au
   premier accès, puis on bascule sur la meilleure solution qui marche :
   1. stockage partagé de Claude (fonctionnement habituel)
   2. stockage personnel de Claude
   3. stockage du navigateur
   4. mémoire seule : l'app marche, mais rien n'est gardé à la fermeture */
(function(){
  if (window.__brioEnLigne || !window.storage) return;
  const natif = window.storage;
  const P = 'brio:';
  const memoire = {};
  let ls = null;
  try { ls = window.localStorage; ls.setItem(P + '__test', '1'); ls.removeItem(P + '__test'); } catch(e){ ls = null; }

  let choix = null;
  function determiner(){
    if (choix) return choix;
    choix = (async () => {
      for (const partage of [true, false]){
        try {
          const r = await natif.set('__sonde', String(Date.now()), partage);
          if (r) return partage ? 'partage' : 'perso';
        } catch(e){}
      }
      return ls ? 'local' : 'memoire';
    })().then(m => { window.__brioStockage = m; return m; });
    return choix;
  }

  const introuvable = k => { throw new Error('Clé introuvable : ' + k); };
  window.storage = {
    async get(key, shared){
      const m = await determiner();
      if (m === 'partage') return natif.get(key, shared);
      if (m === 'perso')   return natif.get(key, false);
      const v = m === 'local' ? ls.getItem(P + key) : (key in memoire ? memoire[key] : null);
      if (v === null) introuvable(key);
      return { key, value: v, shared: !!shared };
    },
    async set(key, value, shared){
      const m = await determiner();
      if (m === 'partage') return natif.set(key, value, shared);
      if (m === 'perso')   return natif.set(key, value, false);
      const v = String(value);
      if (m === 'local') ls.setItem(P + key, v); else memoire[key] = v;
      return { key, value: v, shared: !!shared };
    },
    async delete(key, shared){
      const m = await determiner();
      if (m === 'partage') return natif.delete(key, shared);
      if (m === 'perso')   return natif.delete(key, false);
      if (m === 'local') ls.removeItem(P + key); else delete memoire[key];
      return { key, deleted: true, shared: !!shared };
    },
    async list(prefix, shared){
      const m = await determiner();
      if (m === 'partage') return natif.list(prefix, shared);
      if (m === 'perso')   return natif.list(prefix, false);
      prefix = prefix || '';
      const keys = m === 'local'
        ? Array.from({ length: ls.length }, (_, i) => ls.key(i)).filter(k => k && k.startsWith(P + prefix)).map(k => k.slice(P.length))
        : Object.keys(memoire).filter(k => k.startsWith(prefix));
      return { keys, prefix, shared: !!shared };
    },
  };
})();

// Mode clair : c'est le thème principal. Le thème est posé avant le premier
// affichage, pour ne pas ouvrir sur un fond qui change juste après ; seul un
// choix « sombre » enregistré dans les réglages fonce l'app.
function appliquerTheme(sombre){
  document.documentElement.classList.toggle('sombre', !!sombre);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', sombre ? '#1D1226' : '#E4CFF7');
}
try { appliquerTheme(window.__brioEnLigne && localStorage.getItem('brio:theme') === 'sombre'); } catch(e){ appliquerTheme(false); }

// Si une erreur empêche l'app de démarrer, on l'affiche à la place de
// « Chargement… » : sans ça, l'écran reste bloqué sans aucune explication.
(function(){
  function montrer(msg){
    const app = document.getElementById('app');
    if (!app || !app.querySelector('.loading-wrap')) return; // l'app a déjà démarré
    app.innerHTML = '<div style="padding:40px 8px;font:14px/1.5 sans-serif;color:#fff">'
      + '<b style="font-size:17px">BRIO n\u2019a pas pu démarrer</b><br><br>'
      + 'Envoie une capture de cet écran pour qu\u2019on corrige :<br><br>'
      + '<code style="display:block;background:rgba(0,0,0,.25);padding:12px;border-radius:12px;white-space:pre-wrap;word-break:break-word">'
      + String(msg).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])) + '</code></div>';
  }
  window.addEventListener('error', e => montrer((e.message || 'Erreur') + (e.lineno ? ' (ligne ' + e.lineno + ')' : '')));
  window.addEventListener('unhandledrejection', e => montrer(e.reason && (e.reason.stack || e.reason.message) || e.reason));
  // filet de sécurité : toujours bloqué au bout de 12 s
  window.addEventListener('load', () => setTimeout(() => montrer('Toujours bloqué sur « Chargement… » après 12 secondes.'), 12000));
})();

</script>

  /* ---------- écran Progrès ---------- */
  .progress-squares{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px;}

  .repas-theme .progress-square{

  .progress-square-label{font-size:13px;font-weight:700;color:var(--muted);}

  .imc-gauge-marker{
    position:absolute;top:50%;width:7px;height:18px;border-radius:4px;
    background:rgba(255,255,255,.65);transform:translate(-50%,-50%);

  .weight-src-note{font-style:italic;opacity:.85;}
  .progress-square-sub{font-size:11.5px;color:var(--muted);margin-top:6px;}
  .repas-theme .progress-square-sub{color:#8A82A0;}
  .weight-square{text-align:left;position:relative;}
  .weight-objective{color:#7B4FE0;font-weight:700;}
  .repas-theme .progress-square-sub.weight-objective{color:#7B4FE0;}
  .weight-objective.weight-objective-over{color:#C75F0E;}
  .repas-theme .progress-square-sub.weight-objective.weight-objective-over{color:#C75F0E;}
  .weight-objective-reached{color:#43A047;font-weight:700;}
  .repas-theme .progress-square-sub.weight-objective-reached{color:#43A047;}
  .weight-kg-suffix{color:var(--muted);font-weight:500;font-size:16px;margin-left:3px;}
  .repas-theme .weight-kg-suffix{color:#8A82A0;}
  .weight-history-list{
    margin-top:18px;max-height:280px;overflow-y:auto;text-align:left;
  }
  #weightHistorySheet{display:flex;flex-direction:column;}
  .weight-history-list-full{max-height:none;margin-top:16px;flex:1;}
  .weight-history-row{

  .weight-history-date{color:#1C1730;font-weight:600;}
  .weight-history-value{color:#8A82A0;}

  .celebration-overlay{
    position:fixed;inset:0;z-index:200;
    display:flex;align-items:center;justify-content:center;
    background:rgba(28,23,48,.25);
    backdrop-filter:blur(10px) saturate(120%);
    -webkit-backdrop-filter:blur(10px) saturate(120%);
    animation:celebrationFadeIn .3s ease;
    transition:opacity .6s ease;
    overflow:hidden;
  }
  .celebration-overlay.celebration-fade-out{opacity:0;}
  @keyframes celebrationFadeIn{from{opacity:0;}to{opacity:1;}}
  .celebration-text{
    font-family:var(--police);font-weight:600;font-size:26px;color:#fff;
    text-align:center;padding:0 30px;
    animation:celebrationPop .5s cubic-bezier(.34,1.56,.64,1);
    position:relative;z-index:2;
  }
  @keyframes celebrationPop{
    from{transform:scale(.5);opacity:0;}
    to{transform:scale(1);opacity:1;}
  }
  .pulse-ring{
    position:absolute;left:50%;top:50%;width:32px;height:32px;border-radius:50%;
    border:2px solid rgba(123,79,224,.8);
    transform:translate(-50%,-50%) scale(.3);
    opacity:0;
    animation:pulseRing 2.4s ease-out infinite;
  }
  @keyframes pulseRing{
    0%{transform:translate(-50%,-50%) scale(.3);opacity:.9;}
    50%{opacity:.5;}
    100%{transform:translate(-50%,-50%) scale(9);opacity:0;}

  .imc-square{text-align:left;}
  .weight-edit-btn{
    position:absolute;top:16px;right:16px;width:28px;height:28px;border-radius:50%;
    background:#7B4FE0;color:#fff;border:none;font-size:16px;font-weight:400;
    display:flex;align-items:center;justify-content:center;line-height:1;padding:0;
    text-align:center;
  }
  .weight-edit-btn-beat::before,
  .weight-edit-btn-beat::after{
    content:'';position:absolute;left:50%;top:50%;
    width:100%;height:100%;border-radius:50%;
    border:2px solid rgba(123,79,224,.8);
    transform:translate(-50%,-50%) scale(1);
    opacity:0;pointer-events:none;
    animation:weightBtnBeat 5s ease-out infinite;
  }
  .weight-edit-btn-beat::after{animation-delay:.4s;}
  @keyframes weightBtnBeat{
    0%{transform:translate(-50%,-50%) scale(1);opacity:.85;}
    12%{opacity:.45;}
    26%{transform:translate(-50%,-50%) scale(2.7);opacity:0;}
    100%{transform:translate(-50%,-50%) scale(2.7);opacity:0;}
  }
  @media (prefers-reduced-motion:reduce){
    .weight-edit-btn-beat::before,.weight-edit-btn-beat::after{animation:none;}
  }
  .weight-input{
    width:100%;text-align:center;margin-top:8px;border:none;
    background:rgba(255,255,255,.10);border-radius:16px;padding:8px;
    font-size:18px;color:var(--ink);outline:none;
  }
  .repas-theme .weight-input{background:rgba(255,255,255,.6);color:#1C1730;}
  .progress-square .btn-primary{margin-top:8px;padding:8px;font-size:13px;}
  .weight-sheet .btn-primary{margin-top:24px;font-weight:500;}

  .weight-sheet-backdrop{
    position:fixed;inset:0;background:transparent;
    z-index:80;display:flex;align-items:flex-end;justify-content:center;
  }
  @keyframes sheetFadeIn{from{opacity:0;}to{opacity:1;}}
  .weight-sheet{
    width:100%;max-width:460px;
    background:rgba(255,255,255,.55);
    backdrop-filter:blur(22px) saturate(180%);
    -webkit-backdrop-filter:blur(22px) saturate(180%);
    border:1.5px solid rgba(255,255,255,.85);border-bottom:none;
    border-radius:26px 26px 0 0;
    padding:12px 24px 32px;box-shadow:0 -10px 30px rgba(0,0,0,.2);
    text-align:center;animation:sheetSlideUp .32s cubic-bezier(.32,.72,0,1);
  }
  /* La vue d'ensemble du poids est bâtie comme la feuille des calories :
     un fond dégradé opaque, sur lequel le verre des cases se détache.
     Sur une feuille elle-même en verre blanc, les cases devenaient invisibles. */
  #weightDetailSheet,
  #weightHistorySheet{
    min-height:94vh;max-height:94vh;
    background:linear-gradient(180deg, #E4CFF7 0%, #EDE1F5 45%, #F3EEF7 100%);
    background-attachment:local;
    backdrop-filter:none;-webkit-backdrop-filter:none;
    border:1.5px solid rgba(255,255,255,.9);border-bottom:none;
  }
  /* la vue d'ensemble défile d'un seul bloc ; l'historique garde son en-tête
     en place et ne fait défiler que sa liste */
  #weightDetailSheet{overflow-y:auto;overscroll-behavior:contain;}
  /* le voile derrière, comme pour les calories : la feuille se détache du fond */
  #weightDetailBackdrop,
  #weightHistoryBackdrop{background:rgba(28,23,48,.18);animation:fondApparait .25s ease;}
  .weight-detail-title{font-weight:600;font-size:15px;color:#1C1730;text-align:center;margin-bottom:14px;}
  .weight-detail-header{display:flex;justify-content:space-between;align-items:center;text-align:left;margin-bottom:14px;margin-top:6px;}
  .weight-detail-current{font-weight:700;font-size:26px;color:#1C1730;}
  .weight-detail-date{font-size:13px;color:#8A82A0;margin-top:2px;}
  @keyframes sheetSlideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
  .weight-sheet.no-slide-anim{animation:none;}
  /* Un clic dans une feuille ouverte redessine tout l'écran Progrès. Sans
     ça, le voile sombre repartait de zéro à chaque fois : l'écran derrière
     semblait clignoter alors que rien ne s'ouvrait. */
  #weightDetailBackdrop.no-fade-anim,
  #weightHistoryBackdrop.no-fade-anim{animation:none;}
  /* ---------- animation de série ---------- */
  .serie-fx{
    position:fixed;inset:0;z-index:60;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:32px;
    background:rgba(255,255,255,.5);
    backdrop-filter:blur(24px) saturate(170%);
    -webkit-backdrop-filter:blur(24px) saturate(170%);
    /* fill-mode « backwards » et non « both » : sinon l'animation d'entrée
       garde la main sur l'opacité et la transition de sortie n'a jamais lieu */
    animation:serieFxIn .45s ease backwards;
    transition:opacity .5s ease;
  }
  .serie-fx.sortie{opacity:0;}
  .serie-fx.sortie .serie-fx-fermer{opacity:0;transition:opacity .25s ease;}
  .serie-fx-fermer{
    position:absolute;top:22px;right:20px;
    width:36px;height:36px;padding:0;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:#5B4A78;
    background:rgba(255,255,255,.45);
    backdrop-filter:blur(18px) saturate(180%);
    -webkit-backdrop-filter:blur(18px) saturate(180%);
    border:1px solid rgba(255,255,255,.7);
    transition:background .16s ease,transform .12s ease;
    animation:serieTexte .4s ease .3s both;
  }
  .serie-fx-fermer svg{width:15px;height:15px;display:block;}
  .serie-fx-fermer:hover{background:rgba(255,255,255,.75);}
  .serie-fx-fermer:active{transform:scale(.92);}
  @keyframes serieFxIn{from{opacity:0;}to{opacity:1;}}
  .serie-fx-halo{
    position:absolute;width:230px;height:230px;border-radius:50%;
    background:radial-gradient(circle, rgba(255,138,20,.38), rgba(255,190,60,0) 68%);
    animation:serieHalo 1.8s ease-in-out infinite;
  }
  @keyframes serieHalo{
    0%,100%{transform:scale(.9);opacity:.75;}
    50%{transform:scale(1.1);opacity:1;}
  }
  .serie-fx-flamme{font-size:96px;line-height:1;position:relative;}
  .serie-fx-flamme.allumee{
    transform-origin:bottom center;
    animation:serieArrivee .6s cubic-bezier(.2,.9,.3,1.5) both, serieVacille .9s ease-in-out .6s infinite;
  }
  @keyframes serieArrivee{
    from{opacity:0;transform:translateY(26px) scale(.4);}
    to{opacity:1;transform:none;}
  }
  @keyframes serieVacille{
    0%,100%{transform:scale(1,1) rotate(-2deg);}
    35%{transform:scale(.95,1.1) rotate(2deg);}
    70%{transform:scale(1.05,.96) rotate(-1deg);}
  }
  /* extinction : la flamme faiblit, se ternit, puis s'éteint */
  .serie-fx-flamme.eteinte{
    transform-origin:bottom center;
    animation:serieAgonie 1.5s ease-in .2s both;
  }
  @keyframes serieAgonie{
    0%{transform:scale(1) rotate(0);filter:none;opacity:1;}
    30%{transform:scale(.9,1.08) rotate(-6deg);}
    55%{transform:scale(.75,.85) rotate(7deg);filter:grayscale(.35);}
    80%{transform:scale(.4,.5) rotate(-4deg);filter:grayscale(.8);opacity:.55;}
    100%{transform:scale(.1,.15);filter:grayscale(1);opacity:0;}
  }
  .serie-fx-fumee{
    position:absolute;font-size:46px;line-height:1;opacity:0;
    animation:serieFumee 1.6s ease-out 1.4s both;
  }
  @keyframes serieFumee{
    0%{opacity:0;transform:translateY(6px) scale(.6);}
    35%{opacity:.55;}
    100%{opacity:0;transform:translateY(-46px) scale(1.25);}
  }
  .serie-fx-nombre{
    font-size:24px;font-weight:800;color:#1C1730;margin-top:26px;
    animation:serieTexte .5s ease .5s both;
  }
  .serie-fx-texte{
    font-size:14px;font-weight:600;color:#5B4A78;line-height:1.5;
    max-width:280px;margin-top:8px;text-wrap:balance;
    animation:serieTexte .5s ease .68s both;
  }
  .eteinte-fx .serie-fx-nombre{margin-top:34px;animation-delay:1.5s;}
  .eteinte-fx .serie-fx-texte{animation-delay:1.68s;}
  @keyframes serieTexte{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion: reduce){
    .serie-fx *{animation-duration:.3s !important;animation-iteration-count:1 !important;}
  }

  /* ---------- invitation à noter ses repas ---------- */
  .repas-prompt{padding-bottom:26px;}
  .repas-prompt-mascotte img{width:72px;height:auto;display:block;margin:0 auto 12px;}
  .repas-prompt-titre{font-size:19px;font-weight:800;color:#1C1730;}
  .repas-prompt-sous{
    font-size:13px;color:#8A82A0;line-height:1.45;margin:8px auto 20px;max-width:300px;
  }
  .repas-prompt-grille{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .repas-prompt-btn{
    display:flex;flex-direction:column;align-items:center;gap:7px;
    padding:16px 8px;border-radius:var(--radius-md);
    background:rgba(255,255,255,.6);border:1.5px solid #DCC6F2;
    transition:background .16s ease,border-color .16s ease,transform .12s ease;
  }
  .repas-prompt-btn:active{transform:scale(.97);}
  .repas-prompt-btn:hover{background:#fff;border-color:#7B4FE0;}
  .repas-prompt-emoji{font-size:24px;line-height:1;}
  .repas-prompt-label{font-size:13px;font-weight:700;color:#1C1730;}
  .repas-prompt-plus-tard{
    background:none;border:none;color:#8A82A0;font-size:13px;font-weight:600;
    padding:18px 0 0;text-decoration:underline;
  }
  .repas-rappel{
    display:block;width:100%;box-sizing:border-box;text-align:left;
    /* même respiration que celle qui sépare les calories des macros */
    margin:16px 0 14px;padding:13px 15px;border-radius:var(--radius-md);
    background:rgba(253,149,61,.12);border:1.5px solid rgba(253,149,61,.45);
    font-size:12.5px;font-weight:600;color:#9E4A0A;line-height:1.45;
  }
  /* repas encore à renseigner : une vitre corail, dans le même verre que les
     cases du tableau de bord et que la bulle d'alerte de Brioche.
     La hauteur de ligne ne bouge pas (4 px de marge + 13 px de padding = 17 px). */
  .meal-block.a-remplir .meal-row{
    margin:4px 0;padding:13px 12px 13px 0;border-radius:var(--radius-md);
    background:rgba(255,233,214,.5);
    backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
    /* bordure dessinée à l'intérieur : le contenu ne bouge pas d'un pixel */
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.7), 0 4px 16px rgba(253,149,61,.10);
  }
  /* pas de trait de séparation collé contre la vitre */
  .meal-block.a-remplir,
  .meal-block:has(+ .meal-block.a-remplir){border-bottom-color:transparent !important;}
  .meal-block.a-remplir .meal-icon{color:#C75F0E;}
  .meal-block.a-remplir .meal-name{color:#1C1730;}
  .meal-badge{
    display:inline-block;vertical-align:middle;margin-left:8px;transform:translateY(-1px);
    font-size:10.5px;font-weight:700;letter-spacing:.2px;color:#9E4A0A;
    background:rgba(255,255,255,.65);border:1px solid rgba(253,149,61,.25);
    border-radius:999px;padding:3px 8px;
  }
  .meal-block.a-remplir .meal-add{
    border:none;color:#fff;
    background:linear-gradient(145deg,#F59A4E,#D96A12);
    box-shadow:0 3px 10px rgba(253,149,61,.35);
  }
  /* à la première apparition : un halo doux qui respire, pas un clignotement */
  .meal-block.a-remplir.pulse .meal-row{animation:repasHalo 1.8s ease-in-out 2;}
  @keyframes repasHalo{
    0%,100%{box-shadow:inset 0 0 0 1px rgba(255,255,255,.7), 0 4px 16px rgba(253,149,61,.10), 0 0 0 0 rgba(253,149,61,0);}
    50%{box-shadow:inset 0 0 0 1px rgba(255,255,255,.7), 0 4px 16px rgba(253,149,61,.14), 0 0 0 5px rgba(253,149,61,.12);}
  }
  @media (prefers-reduced-motion: reduce){ .meal-block.a-remplir.pulse .meal-row{animation:none;} }
  .weight-sheet-handle{
    width:40px;height:5px;border-radius:999px;background:#C0B2D4;
    margin:0 auto 18px;touch-action:none;cursor:grab;
    /* flex:none : dans une feuille en colonne flex, le contenu qui déborde
       écrasait la barre à 0 px de haut — elle disparaissait purement et simplement */
    flex:none;
  }
  .weight-sheet .progress-square-label{color:#1C1730;}
  .weight-panel-header{position:relative;display:flex;align-items:center;justify-content:center;margin-bottom:18px;}
  .weight-more-wrap{position:absolute;right:0;top:50%;transform:translateY(-50%);}
  /* Les trois points et leur menu : même verre que les cases de la feuille.
     Les points sont dessinés en SVG et non écrits « ⋯ » : le caractère se
     centrait mal et demandait un décalage bricolé au pixel près. */
  .weight-more-btn{
    width:32px;height:32px;border-radius:50%;padding:0;color:#1C1730;
    background:rgba(255,255,255,.45);
    backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
    border:1px solid rgba(255,255,255,.7);
    display:flex;align-items:center;justify-content:center;
    transition:background .2s ease, border-color .2s ease, transform .18s cubic-bezier(.34,1.4,.64,1);
  }
  .weight-more-btn svg{width:16px;height:16px;display:block;}
  .weight-more-btn:active{transform:scale(.92);}
  /* menu ouvert : le bouton reste enfoncé, on voit d'où vient le panneau */
  .weight-more-btn.ouvert{background:rgba(255,255,255,.85);border-color:rgba(255,255,255,.95);}
  .weight-more-btn:focus-visible{outline:2px solid #7B4FE0;outline-offset:2px;}

  .weight-more-menu{
    position:absolute;top:38px;right:0;z-index:5;min-width:200px;padding:6px;
    border-radius:var(--radius-md);
    background:rgba(255,255,255,.95);

    transform-origin:top right;

  @media (prefers-reduced-motion: reduce){

  .weight-more-menu-item{

  .weight-target-col{display:flex;flex-direction:column;align-items:flex-end;gap:3px;margin-top:6px;}
  .weight-target-status{font-size:12px;font-weight:700;}
  .weight-target-diff{font-size:11px;font-weight:600;}

  /* ---------- catégories de menus verrouillées ---------- */
  .menu-zone{position:relative;}
  /* Le flou est appliqué carte par carte, pas sur le bloc entier : sur un
     grand élément flouté, certains navigateurs cessent de peindre le bas et
     une catégorie disparaissait. Chaque carte est ici son propre calque. */
  .menu-cats.verrouille{pointer-events:none;user-select:none;}
  .menu-cats.verrouille .menu-cat{
    filter:blur(5px);
    transform:translateZ(0);
    transition:filter 1s ease 1.3s;
  }
  .menu-cats.verrouille.net .menu-cat{filter:blur(0);}
  .menu-lock{
    position:absolute;inset:0;z-index:2;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    background:rgba(255,255,255,.14);
    border:1px solid rgba(255,255,255,.7);
    border-radius:var(--radius-md);
    text-align:center;padding:24px;
  }
  /* les deux cadenas occupent la même case : l'échange ne décale rien */
  .lock-icones{position:relative;width:46px;height:46px;flex-shrink:0;}
  .lock-ferme,.lock-ouvert{
    position:absolute;inset:0;font-size:40px;line-height:1;
    display:flex;align-items:center;justify-content:center;
  }
  .lock-ouvert{opacity:0;}
  .lock-texte{
    font-size:13px;font-weight:700;color:#4A3A66;line-height:1.45;
    max-width:270px;text-align:center;text-wrap:balance;
    text-shadow:0 1px 6px rgba(255,255,255,.9);
  }
  /* ouverture : le cadenas tremble, s'ouvre, puis le voile s'efface */
  .menu-lock.deverrouille{animation:lockFade .8s ease 1.55s both;}
  .menu-lock.deverrouille .lock-ferme{animation:lockShake .6s ease-in-out 2, lockOut .24s ease .98s both;}
  .menu-lock.deverrouille .lock-ouvert{animation:lockIn .6s cubic-bezier(.2,.9,.3,1.4) 1.08s both;}
  .menu-lock.deverrouille .lock-texte{animation:lockIn .55s ease 1.08s both;}
  @keyframes lockShake{
    0%,100%{transform:rotate(0) translateX(0);}
    20%{transform:rotate(-9deg) translateX(-3px);}
    50%{transform:rotate(8deg) translateX(3px);}
    80%{transform:rotate(-5deg) translateX(-2px);}
  }
  @keyframes lockOut{to{opacity:0;transform:scale(.8);}}
  @keyframes lockIn{
    from{opacity:0;transform:scale(.5) rotate(-14deg);}
    to{opacity:1;transform:none;}
  }
  @keyframes lockFade{to{opacity:0;transform:scale(1.04);}}
  @media (prefers-reduced-motion: reduce){
    .menu-lock.deverrouille,
    .menu-lock.deverrouille *{animation-duration:.01s !important;}
  }

    fill:none;stroke:var(--stat-couleur);stroke-width:2;
    transform-box:fill-box;transform-origin:center;
    opacity:0;pointer-events:none;
    animation:poidsHalo 5s ease-out infinite;
  }
  .stat-graph .halo.retard{animation-delay:.4s;}
  @keyframes poidsHalo{
    0%{transform:scale(1);opacity:.85;}
    12%{opacity:.45;}
    26%{transform:scale(2.7);opacity:0;}
    100%{transform:scale(2.7);opacity:0;}
  }
  @media (prefers-reduced-motion:reduce){ .stat-graph .halo{animation:none;} }
  .poids-analyse{color:#1C1730;text-align:left;}
  .poids-analyse .stat-aide,
  .poids-analyse .stat-note{text-align:center;}
  /* le verre ne se superpose pas : posées sur une carte elle-même en verre,
     les tuiles perdaient leur relief. Elles sont donc à même la feuille. */
  .poids-sel{margin-top:18px;padding:18px;border-radius:var(--radius-lg);}
  .poids-analyse .stat-graph .ligne{stroke-width:1.8;}
  .poids-analyse .stat-graph .point{stroke-width:1.6;}
  .poids-analyse .stat-graph .halo{stroke-width:1.5;}
  .poids-sel-tete{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
  .poids-sel-quand{font-size:12.5px;font-weight:600;color:#8A82A0;}
  .poids-sel-valeur{font-size:28px;font-weight:800;color:#1C1730;line-height:1.1;margin-top:3px;}
  .poids-sel-pesees{font-size:11px;font-weight:600;color:#8A82A0;text-align:right;flex-shrink:0;padding-top:2px;}
  .poids-analyse .stat-tuiles{margin-top:16px;}
  .stat-aide{font-size:11.5px;color:#8A82A0;text-align:center;margin-top:6px;}
  .stat-bilan{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;}
  .stat-note{font-size:11px;color:#8A82A0;margin-top:8px;text-align:center;}
  @media (prefers-reduced-motion: reduce){
    .stat-graph .ligne.anime{animation:none;stroke-dashoffset:0;}
    .stat-sheet,.stat-backdrop{animation:none;}
  }

  /* quantité d'un aliment : visible et modifiable */
  .meal-entry.modifiable{cursor:pointer;}
  .meal-entry-qty{
    font-size:11.5px;font-weight:700;color:#7B4FE0;background:rgba(123,79,224,.1);
    border-radius:999px;padding:1px 8px;white-space:nowrap;
  }
  .meal-entry-crayon{margin-left:4px;font-size:10px;opacity:.7;}
  .meal-entry.en-edition .meal-entry-qty{background:#7B4FE0;color:#fff;}
  .meal-entry-edit{
    display:flex;align-items:center;gap:10px;margin:-2px 12px 12px 50px;padding:8px 8px 8px 10px;
    background:rgba(255,255,255,.6);border:1px solid rgba(123,79,224,.25);border-radius:14px;
    animation:sheetFadeIn .2s ease;
  }
  .mee-champ{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:#8A82A0;}
  .mee-champ input{
    width:74px;padding:7px 9px;border-radius:10px;border:1.5px solid #DCC6F2;background:#fff;
    font-size:15px;font-weight:700;color:#1C1730;outline:none;
  }
  .mee-champ input:focus{border-color:#7B4FE0;}
  .mee-apercu{flex:1;font-size:12.5px;font-weight:700;color:#7B4FE0;white-space:nowrap;}
  .mee-ok{
    border:none;background:#7B4FE0;color:#fff;font-size:13px;font-weight:700;
    padding:8px 14px;border-radius:999px;
  }

  /* ---------- Brioche sur l'écran du jour ---------- */
  .brioche-bulle{display:flex;align-items:center;gap:12px;margin:16px 0 14px;}
  /* pas de filtre ni de rotation sur l'image : c'est ce qui la rendait floue pendant le saut */
  .brioche-tete{width:48px;border-radius:14px;height:auto;flex-shrink:0;display:block;}
  /* même verre liquide que les cases calories / macros */
  .brioche-texte{
    position:relative;flex:1;padding:12px 15px;border-radius:var(--radius-md);
    font-size:13px;font-weight:600;line-height:1.45;color:#1C1730;
    background:rgba(255,255,255,.45);
    backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
    border:1px solid rgba(255,255,255,.7);
  }
  /* la pointe, tournée vers Brioche (hors de la bulle pour ne pas doubler la transparence) */
  .brioche-texte::before{
    content:'';position:absolute;left:-8px;top:50%;width:8px;height:14px;transform:translateY(-50%);
    background:rgba(255,255,255,.45);clip-path:polygon(100% 0, 0 50%, 100% 100%);
  }
  .brioche-bulle.humeur-alerte .brioche-texte{background:rgba(255,233,214,.5);color:#9E4A0A;}
  .brioche-bulle.humeur-alerte .brioche-texte::before{background:rgba(255,233,214,.5);}
  .brioche-bulle.humeur-bravo .brioche-texte{background:rgba(222,247,229,.55);color:#2E7D4F;}
  .brioche-bulle.humeur-bravo .brioche-texte::before{background:rgba(222,247,229,.55);}
  /* animations en translation et opacité seulement : l'image reste nette */
  .brioche-bulle.arrivee .brioche-tete{animation:briocheArrivee .5s cubic-bezier(.34,1.56,.64,1);}
  .brioche-bulle.arrivee .brioche-texte{animation:briocheBulle .4s .12s ease-out both;}
  .brioche-bulle.nouveau .brioche-tete{animation:briocheSaut .6s ease-out;}
  .brioche-bulle.nouveau .brioche-texte{animation:briocheBulle .35s ease-out;}
  @keyframes briocheArrivee{from{transform:translateY(12px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  @keyframes briocheSaut{0%,100%{transform:translateY(0);}30%{transform:translateY(-10px);}55%{transform:translateY(0);}75%{transform:translateY(-3px);}}
  @keyframes briocheBulle{from{opacity:.25;}to{opacity:1;}}
  @media (prefers-reduced-motion: reduce){ .brioche-tete,.brioche-texte{animation:none !important;} }

  /* ---------- feuille de détail : même fond et même verre que l'écran du jour ---------- */
  .stat-sheet{
    background:linear-gradient(180deg, #E4CFF7 0%, #EDE1F5 45%, #F3EEF7 100%);
    background-attachment:local;
  }
  .stat-verre{
    background:rgba(255,255,255,.45);
    backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
    border:1px solid rgba(255,255,255,.7);
    box-shadow:none;
    transition:background .3s ease, border-color .3s ease;
  }
  .stat-recap.stat-verre{border-radius:var(--radius-lg);}
  .stat-tuile.stat-verre{border-radius:var(--radius-md);}
  .stat-periodes.stat-verre{padding:3px;border-radius:999px;}
  .stat-periode.actif{background:rgba(255,255,255,.85);box-shadow:none;}
  .stat-brioche.stat-verre{border-radius:var(--radius-md);}
  /* objectif atteint : même verre, teinté vert */
  .stat-verre.vert{background:rgba(222,247,229,.6);border-color:rgba(67,160,71,.45);}
  .stat-tuile.vert .stat-tuile-val{color:#2E7D4F;}
  .stat-tuile.vert .stat-tuile-lab{color:#4E9A67;}
  /* dépassé : même verre, teinté rouge */
  .stat-verre.rouge{background:rgba(255,233,214,.5);}
  .stat-barre.atteint > div{background:#43A047;}
  .stat-brioche{display:flex;align-items:center;gap:12px;margin-top:16px;padding:12px 14px;border-radius:16px;font-size:13px;font-weight:600;line-height:1.45;color:#3B2F63;}
  .stat-brioche img{width:40px;height:auto;flex-shrink:0;border-radius:11px;}

  /* ---------- confirmation de suppression ---------- */
  .confirm-fond{
    position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:24px;
    background:rgba(28,23,48,.28);animation:sheetFadeIn .2s ease;transition:opacity .18s ease;
  }
  .confirm-fond.sortie{opacity:0;}
  .confirm-boite{
    width:100%;max-width:320px;padding:22px 20px 18px;border-radius:var(--radius-lg);text-align:center;
    background:rgba(255,255,255,.72);
    backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
    border:1px solid rgba(255,255,255,.8);box-shadow:0 12px 36px rgba(28,23,48,.2);
    font-family:var(--police);color:#1C1730;animation:confirmPop .22s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes confirmPop{from{transform:translateY(8px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .confirm-titre{font-size:17px;font-weight:800;}
  .confirm-texte{font-size:13.5px;line-height:1.45;color:#5B5372;margin-top:8px;}
  .confirm-texte strong{color:#1C1730;}
  .confirm-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px;}
  .confirm-btn{border:none;border-radius:999px;padding:11px 0;font-size:14px;font-weight:700;}
  .confirm-annuler{background:rgba(123,79,224,.12);color:#6B3FC4;}
  .confirm-supprimer{background:#D9534F;color:#fff;}
  @media (prefers-reduced-motion: reduce){ .confirm-fond,.confirm-boite{animation:none;} }

  /* ---------- feuilles du bas : glisser vers le bas pour fermer ---------- */
  .weight-sheet,.stat-sheet{will-change:transform;}
  /* la poignée garde son look, mais la zone où poser le doigt est bien plus grande */
  .weight-sheet-handle{position:relative;}
  .weight-sheet-handle::before{content:'';position:absolute;left:-60px;right:-60px;top:-14px;bottom:-14px;}
  /* tant qu'une feuille est ouverte, la page derrière ne défile pas et ne rebondit pas */
  html:has(.weight-sheet-backdrop, .stat-backdrop, .photo-fond),
  html:has(.weight-sheet-backdrop, .stat-backdrop, .photo-fond) body{overflow:hidden;overscroll-behavior:none;}
  .weight-history-list,.stat-sheet,.photo-sheet{overscroll-behavior:contain;}
  .photo-sheet{will-change:transform;}
  #weightHistorySheet .cat-header h1{color:#1C1730;}
  /* le voile du fond apparaît sans toucher à l'opacité (qui cassait l'effet verre de la feuille) */
  .stat-backdrop{animation:fondApparait .25s ease;}
  @keyframes fondApparait{from{background-color:transparent;}}
  @media (prefers-reduced-motion: reduce){ .stat-backdrop{animation:none;} }

  /* ---------- écran compte ---------- */
  .intro-deja{
    margin-top:14px;background:none;border:none;padding:10px 14px;
    font-size:15px;font-weight:700;color:#7B4FE0;
    animation:introRise .8s cubic-bezier(.22,.7,.25,1) .5s both;
  }
  @media (prefers-reduced-motion: reduce){ .intro-deja{animation:screenFadeIn .3s ease both;} }
  .compte-ecran{max-width:380px;margin:0 auto;padding-top:5vh;}
  .compte-brio{width:64px;height:64px;border-radius:19px;display:block;margin:0 auto 18px;
    box-shadow:0 8px 18px rgba(81,33,214,.22);}
  .compte-titre{font-size:28px;line-height:1.15;color:#1C1730;text-align:center;letter-spacing:-.035em;}
  .compte-sous{font-size:15px;line-height:1.45;color:#8A82A0;text-align:center;margin:8px auto 24px;max-width:320px;text-wrap:balance;}
  .compte-onglets{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:999px;margin-bottom:22px;}
  .compte-onglet-fond{
    position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;
    background:#fff;box-shadow:0 1px 4px rgba(28,23,48,.08);
    transition:transform .32s cubic-bezier(.32,.72,0,1);
  }
  .compte-onglet-fond.droite{transform:translateX(100%);}
  .compte-onglet{
    position:relative;border:none;background:none;border-radius:999px;padding:11px 8px;
    font-size:14px;font-weight:700;color:#8A82A0;transition:color .2s ease;
  }
  .compte-onglet.actif{color:#1C1730;}
  .compte-onglet:focus-visible,.compte-oeil:focus-visible,.intro-deja:focus-visible,.compte-valider:focus-visible{
    outline:2px solid #7B4FE0;outline-offset:2px;
  }
  .compte-mdp{position:relative;}
  .compte-mdp input{padding-right:48px;}
  .compte-oeil{
    position:absolute;right:4px;top:50%;transform:translateY(-50%);
    width:40px;height:40px;border:none;background:none;border-radius:12px;color:#8A82A0;
    display:flex;align-items:center;justify-content:center;
  }
  .compte-oeil svg{width:20px;height:20px;}
  .compte-erreur{font-size:13px;line-height:1.4;color:#C62A2F;font-weight:600;margin:6px 2px 0;}
  .compte-erreur:empty{display:none;}
  #err_general{
    margin:-6px 0 18px;padding:11px 14px;border-radius:var(--radius-sm);
    background:rgba(255,226,224,.6);border:1px solid rgba(229,72,77,.25);
  }
  /* une bonne nouvelle (« compte créé ») ne doit pas s'afficher en rouge */
  .compte-info{
    font-size:13px;line-height:1.4;color:#2E7D4F;font-weight:600;
    margin:-6px 0 18px;padding:11px 14px;border-radius:var(--radius-sm);
    background:rgba(222,247,229,.65);border:1px solid rgba(67,160,71,.3);
  }
  .compte-lien{
    display:block;margin:14px auto 0;background:none;border:none;
    color:#7B4FE0;font-size:13.5px;font-weight:700;
    text-decoration:underline;padding:5px 8px;
  }
  .compte-valider{margin-top:10px;}
  .compte-valider:disabled{opacity:.6;}
  .compte-note{font-size:12.5px;line-height:1.45;color:#8A82A0;text-align:center;margin:16px auto 0;max-width:300px;}

  /* ---------- app installée : zones sûres de l'écran (encoche, barre d'accueil) ---------- */
  #app{padding-top:calc(28px + env(safe-area-inset-top));}
  #app.with-nav{padding-bottom:calc(120px + env(safe-area-inset-bottom));}
  .bottom-nav{bottom:calc(18px + env(safe-area-inset-bottom));}
  .toast{bottom:calc(26px + env(safe-area-inset-bottom));}
  .weight-sheet{padding-bottom:calc(32px + env(safe-area-inset-bottom));}
  .weight-sheet.repas-prompt{padding-bottom:calc(26px + env(safe-area-inset-bottom));}
  .stat-sheet{padding-bottom:calc(34px + env(safe-area-inset-bottom));}

  /* ---------- bouton + de la barre : photo du repas ---------- */
  .nav-pill-slider{width:calc((100% - 20px) / 5);}
  .nav-item, .nav-plus{flex:1 1 0;min-width:0;}
  .nav-plus{
    position:relative;z-index:1;flex:1;
    background:none;border:none;padding:0;
    display:flex;align-items:center;justify-content:center;
    -webkit-tap-highlight-color:transparent;
  }
  /* bouton + : violet des bulles de date, bordure des cases du tableau de bord */
  /* effet verre « ménisque » : une surface de liquide clair dans la bille violette */
  .nav-plus-rond{
    position:relative;overflow:hidden;
    width:50px;height:50px;border-radius:50%;color:#fff;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(150deg,#8A5BF0,#6438CC);
    border:1px solid rgba(255,255,255,.4);
    box-shadow:0 5px 16px rgba(123,79,224,.45);
    transition:transform .15s ease,box-shadow .15s ease;
  }
  .nav-plus-rond::before{
    content:"";position:absolute;left:-10%;right:-10%;top:-40%;height:70%;
    background:linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,0));
    border-radius:0 0 50% 50%;transform:translateY(38%);
    transition:transform .35s cubic-bezier(.34,1.3,.64,1);
  }
  /* le liquide oscille légèrement quand on appuie */
  .nav-plus:active .nav-plus-rond::before{transform:translateY(46%);}
  .nav-plus-rond svg{position:relative;z-index:1;}
  .nav-plus-rond svg{width:24px;height:24px;}
  .nav-plus:active .nav-plus-rond{transform:scale(.92);box-shadow:0 3px 10px rgba(123,79,224,.4);}
  .nav-plus:focus-visible .nav-plus-rond{outline:3px solid #fff;outline-offset:2px;}

  /* ---------- feuille « photo du repas » ---------- */
  .photo-fond{
    position:fixed;inset:0;z-index:90;
    background:rgba(28,23,48,.32);
    display:flex;align-items:flex-end;justify-content:center;
    animation:sheetFadeIn .25s ease both;
  }
  .photo-fond.ferme{animation:photoFondOut .22s ease both;}
  .photo-fond.ferme .photo-sheet{animation:photoSheetOut .22s ease both;}
  @keyframes photoFondOut{to{opacity:0;}}
  @keyframes photoSheetOut{to{transform:translateY(100%);}}
  .photo-sheet{
    width:100%;max-width:460px;max-height:90vh;overflow-y:auto;
    background:rgba(255,255,255,.96);
    backdrop-filter:blur(22px) saturate(180%);
    -webkit-backdrop-filter:blur(22px) saturate(180%);
    border:1.5px solid rgba(255,255,255,.85);border-bottom:none;
    border-radius:26px 26px 0 0;
    padding:12px 22px calc(28px + env(safe-area-inset-bottom));
    box-shadow:0 -10px 30px rgba(0,0,0,.2);
    color:#1C1730;text-align:center;
    animation:sheetSlideUp .32s cubic-bezier(.32,.72,0,1);
  }
  .photo-titre{font-size:19px;font-weight:800;color:#1C1730;text-wrap:balance;}
  .photo-sous{font-size:13px;color:#8A82A0;line-height:1.45;margin:8px auto 20px;max-width:300px;}
  .photo-mascotte img{width:68px;height:auto;display:block;margin:0 auto 12px;}

  .photo-actions{display:flex;flex-direction:column;gap:10px;}
  .photo-btn{
    position:relative;display:flex;align-items:center;justify-content:center;gap:10px;
    padding:15px 16px;border-radius:999px;cursor:pointer;
    font-size:15px;font-weight:700;
    background:rgba(255,255,255,.7);border:1.5px solid #DCC6F2;color:#1C1730;
    transition:transform .12s ease, background .16s ease;
  }
  .photo-btn:active{transform:scale(.98);}
  .photo-btn svg{width:20px;height:20px;flex-shrink:0;}
  .photo-btn-principal{background:#7B4FE0;border-color:#7B4FE0;color:#fff;}
  .photo-btn:focus-within{outline:3px solid rgba(123,79,224,.4);outline-offset:2px;}
  .photo-fichier{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none;}

  /* analyse : la photo est balayée par un trait de lumière */
  .photo-apercu{
    position:relative;width:100%;max-width:300px;aspect-ratio:1/1;margin:4px auto 22px;
    border-radius:22px;overflow:visible;
  }
  .photo-apercu-img{
    width:100%;height:100%;object-fit:cover;display:block;border-radius:22px;
    box-shadow:0 10px 26px rgba(81,33,214,.22);
  }
  .photo-scan{position:absolute;inset:0;border-radius:22px;overflow:hidden;pointer-events:none;}
  .photo-scan::before{
    content:"";position:absolute;left:0;right:0;height:38%;top:-38%;
    background:linear-gradient(to bottom, rgba(123,79,224,0), rgba(123,79,224,.38) 85%, rgba(255,255,255,.95) 100%);
    animation:photoBalayage 1.7s cubic-bezier(.45,0,.25,1) infinite;
  }
  @keyframes photoBalayage{from{top:-38%;}to{top:100%;}}
  .photo-apercu .photo-brioche{
    position:absolute;right:-14px;bottom:-18px;width:74px;height:auto;
    filter:drop-shadow(0 6px 12px rgba(28,23,48,.25));
    animation:photoBrioche 1.1s ease-in-out infinite alternate;
  }
  @keyframes photoBrioche{from{transform:rotate(-5deg) translateY(0);}to{transform:rotate(4deg) translateY(-4px);}}
  .photo-etape{transition:opacity .18s ease;}

  /* résultat */
  .photo-tete{display:flex;gap:14px;align-items:center;text-align:left;margin:2px 0 12px;}
  .photo-vignette{width:72px;height:72px;border-radius:16px;object-fit:cover;flex-shrink:0;box-shadow:0 6px 14px rgba(81,33,214,.18);}
  .photo-plat{font-size:18px;font-weight:800;line-height:1.25;color:#1C1730;}
  .photo-confiance{display:inline-flex;align-items:center;gap:6px;margin-top:5px;font-size:12px;font-weight:600;color:#8A82A0;}
  .photo-confiance i{width:7px;height:7px;border-radius:50%;background:#43A047;}
  .photo-confiance.moyenne i{background:#E0A300;}
  .photo-confiance.faible i{background:#D9625C;}
  .photo-desc{font-size:14px;line-height:1.5;color:#3E3654;text-align:left;margin:0 0 14px;}
  .photo-remarque{
    display:flex;gap:10px;align-items:flex-start;text-align:left;
    font-size:13px;line-height:1.45;color:#4B3A7A;font-weight:600;
    background:rgba(123,79,224,.1);border-radius:var(--radius-md);padding:11px 13px;margin-bottom:16px;
  }
  .photo-remarque img{width:30px;height:auto;flex-shrink:0;margin-top:-2px;}

  .photo-sec{font-size:13px;font-weight:700;color:#8A82A0;text-align:left;margin:18px 0 6px;}
  .photo-aliment{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #EFE3FA;text-align:left;}
  .photo-aliment:last-child{border-bottom:none;}
  .photo-aliment-txt{flex:1;min-width:0;}
  .photo-aliment-nom{font-size:14.5px;font-weight:600;color:#1C1730;}
  .photo-aliment-info{font-size:12px;color:#8A82A0;margin-top:2px;}
  .photo-aliment-kcal{font-size:14px;font-weight:700;color:#1C1730;white-space:nowrap;}
  .photo-aliment-retirer{
    width:30px;height:30px;border-radius:50%;flex-shrink:0;
    border:1.5px solid #E4D3F5;background:#fff;color:#8A82A0;font-size:16px;line-height:1;
    display:flex;align-items:center;justify-content:center;
  }
  .photo-aliment.retire .photo-aliment-txt,
  .photo-aliment.retire .photo-aliment-kcal{opacity:.38;text-decoration:line-through;}
  .photo-aliment.retire .photo-aliment-retirer{color:#7B4FE0;border-color:#7B4FE0;}

  .photo-total{
    display:flex;align-items:baseline;justify-content:space-between;
    margin-top:14px;padding-top:12px;border-top:1.5px solid #E4D3F5;
  }
  .photo-total-lab{font-size:14px;font-weight:700;color:#1C1730;}
  .photo-total-val{font-size:26px;font-weight:800;color:#1C1730;}
  .photo-total-val small{font-size:14px;font-weight:700;color:#8A82A0;margin-left:3px;}
  .photo-sheet .recap-macros{margin-top:12px;}

  .photo-types{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
  .photo-type{
    padding:10px 4px;border-radius:14px;border:1.5px solid #DCC6F2;background:rgba(255,255,255,.7);
    font-size:11.5px;font-weight:700;color:#5B4A78;display:flex;flex-direction:column;align-items:center;gap:4px;
  }
  .photo-type span{font-size:18px;line-height:1;}
  .photo-type.actif{background:#7B4FE0;border-color:#7B4FE0;color:#fff;}
  .photo-sheet .btn-primary{background:#7B4FE0;color:#fff;margin-top:20px;}
  .photo-lien{
    background:none;border:none;color:#8A82A0;font-size:13px;font-weight:600;
    padding:16px 0 0;text-decoration:underline;
  }
  .photo-note{font-size:11.5px;color:#A49CB8;line-height:1.4;margin-top:12px;}
  .photo-erreur{
    font-size:13.5px;line-height:1.5;color:#9E4A0A;font-weight:600;
    background:rgba(253,149,61,.1);border:1.5px solid rgba(253,149,61,.35);
    border-radius:var(--radius-md);padding:13px 15px;margin:0 0 18px;text-align:left;
  }
  @media (prefers-reduced-motion: reduce){
    .photo-scan::before{animation-duration:3.5s;}
    .photo-apercu .photo-brioche{animation:none;}
  }

  /* ---------- Titan One : titres, noms de sections et gros chiffres ---------- */
  h1, h2, h3,
  .compte-titre, .app-wordmark, .section-title, .hydration-label, .stat-titre,
  .meal-name, .plan-loader-title, .celebration-text, .welcome-text,
  .repas-prompt-titre, .confirm-titre,
  .cal-number, .macro-num, .progress-square-value, .stat-gros-num,
  .recap-kcal, .recap-macro-val, .conseil-val, .tile-record, .menu-card-cal,
  .weight-detail-current, .weight-picker-value, .serie-fx-nombre, .serie-nombre,
  .poids-sel-valeur, .poids-analyse .stat-tuile-val,
  .photo-titre, .photo-plat, .photo-total-val{
    font-family:var(--police-titre);letter-spacing:0;
  }
  .meal-badge{font-family:var(--police);} /* la petite étiquette « À noter » reste en police de texte */

  /* ---------- recherche d'aliments : scanner, onglets, favoris ---------- */
  .food-search-ligne{display:flex;gap:8px;align-items:stretch;}
  .food-search-ligne input{flex:1;min-width:0;}
  .food-scan{
    flex-shrink:0;width:46px;border-radius:var(--radius-sm);
    border:1px solid #DCC6F2;background:#FFFFFF;color:#7B4FE0;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .food-scan svg{width:22px;height:22px;}
  .food-scan:active{transform:scale(.95);}
  .food-onglets{display:flex;gap:6px;margin-top:8px;}
  .food-onglet{
    flex:1;padding:7px 6px;border-radius:999px;cursor:pointer;
    border:1px solid #DCC6F2;background:#FFFFFF;color:#5B4A78;
    font-size:12px;font-weight:700;
  }
  .food-onglet.actif{background:#7B4FE0;border-color:#7B4FE0;color:#FFFFFF;}
  /* une ligne = une seule carte : l'aliment à gauche, l'étoile intégrée à droite */
  .aliment-ligne{
    display:flex;align-items:stretch;overflow:hidden;flex-shrink:0;
    border:1px solid #DCC6F2;background:#FFFFFF;border-radius:var(--radius-sm);
    transition:border-color .25s ease;
  }
  .aliment-ligne.favori{border-color:#EBCB7A;}
  .repas-theme .aliment-ligne .food-result{
    flex:1;min-width:0;border:none;background:transparent;border-radius:0;padding-right:2px;
  }
  .food-fav{
    flex-shrink:0;width:44px;padding:0;border:none;background:transparent;cursor:pointer;
    display:flex;align-items:center;justify-content:center;color:#B8A9CC;
    transition:color .2s ease;
  }
  .food-fav svg{width:19px;height:19px;display:block;}
  .food-fav.actif{color:#F2B632;}
  .food-fav.pop svg{animation:favPop .45s cubic-bezier(.3,1.6,.5,1);}
  @keyframes favPop{0%{transform:scale(1);}40%{transform:scale(1.45) rotate(-8deg);}100%{transform:scale(1);}}
  .food-fav:focus-visible{outline:2px solid #7B4FE0;outline-offset:-4px;border-radius:10px;}
  @media (prefers-reduced-motion: reduce){ .food-fav.pop svg{animation:none;} }
  .food-vide{font-size:12.5px;color:#8A82A0;padding:4px 2px;line-height:1.45;}
  .etoile-texte{width:14px;height:14px;display:inline-block;vertical-align:-2px;color:#F2B632;}

  /* ---------- photo du repas : choix du repas et compteur ---------- */
  .photo-sec-choix{margin-top:4px;}
  .photo-types-choix{margin-bottom:12px;}
  .photo-type.epuise:not(.actif){opacity:.55;}
  .photo-quota{font-size:12.5px;color:#8A82A0;margin:0 0 16px;}
  .photo-quota.epuise{
    font-size:13.5px;line-height:1.5;color:#4B3A7A;font-weight:600;text-align:left;
    background:rgba(123,79,224,.1);border-radius:var(--radius-md);padding:12px 14px;margin:4px 0 6px;
  }
</style>
<style id="theme-sombre">
/* Mode sombre : chaque règle de couleur de la feuille principale, reprise
   avec des teintes foncées. Actif quand <html> porte la classe « sombre ». */
@keyframes repasHalo-sombre{0%,100%{box-shadow:inset 0 0 0 1px rgba(255,255,255,0.154), 0 4px 16px rgba(253,149,61,0.14), 0 0 0 0 rgba(253,149,61,0)}50%{box-shadow:inset 0 0 0 1px rgba(255,255,255,0.154), 0 4px 16px rgba(253,149,61,0.196), 0 0 0 5px rgba(253,149,61,0.168)}}
html.sombre body{color:var(--ink)}
html.sombre .muted{color:var(--muted)}
html.sombre .loading-wrap{color:var(--muted)}
html.sombre .setup-card p{color:var(--muted)}
html.sombre .repas-theme .setup-card h1{color:#EDECF4}
html.sombre .repas-theme .setup-card p{color:#AAA5B7}
html.sombre .intro-text{color:#FFFFFF}
html.sombre .intro-text strong{color:#FFFFFF}
html.sombre .app-logo img{filter:drop-shadow(0 6px 14px rgba(0,0,0,0.325))}
html.sombre .app-wordmark{color:#A98DF0}
html.sombre .onboard-dot{background:var(--line)}
html.sombre .repas-theme .onboard-dot{background:#2D2341}
html.sombre .onboard-dot.filled{background:#7B4FE0}

<style id="scanner">
/* Scanner de code-barres : écran sombre dans les deux thèmes (comme un appareil photo) */
.scan-fond{
  position:fixed;inset:0;z-index:95;background:#0E0A18;color:#FFFFFF;
  display:flex;flex-direction:column;align-items:center;overflow-y:auto;
  padding:calc(18px + env(safe-area-inset-top)) 20px calc(22px + env(safe-area-inset-bottom));
  animation:sheetFadeIn .2s ease both;
}
.scan-haut{width:100%;max-width:420px;display:flex;align-items:center;justify-content:space-between;}
.scan-titre{font-family:var(--police-titre);font-size:21px;}
.scan-fermer{
  width:38px;height:38px;border-radius:50%;padding:0;font-size:22px;line-height:1;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);color:#FFFFFF;
}
.scan-zone{position:relative;width:100%;max-width:420px;aspect-ratio:4/3;margin:20px 0 14px;border-radius:22px;overflow:hidden;background:#000;flex-shrink:0;}
.scan-zone video{width:100%;height:100%;object-fit:cover;display:block;}
.scan-cadre{
  position:absolute;left:9%;right:9%;top:27%;bottom:27%;border-radius:14px;
  border:2px solid rgba(255,255,255,.92);box-shadow:0 0 0 999px rgba(0,0,0,.42);
}
.scan-laser{
  position:absolute;left:6%;right:6%;top:50%;height:2px;border-radius:2px;
  background:#B98AF0;box-shadow:0 0 12px #7B4FE0;
  animation:scanLaser 1.5s ease-in-out infinite alternate;
}
@keyframes scanLaser{from{transform:translateY(-24px);}to{transform:translateY(24px);}}
.scan-sans-camera{display:none;}
.scan-zone.sans-camera video,.scan-zone.sans-camera .scan-cadre{display:none;}
.scan-zone.sans-camera .scan-sans-camera{
  display:flex;position:absolute;inset:0;align-items:center;justify-content:center;
  color:rgba(255,255,255,.3);background:rgba(255,255,255,.05);
}
.scan-zone.sans-camera .scan-sans-camera svg{width:64px;height:64px;}
.scan-statut{font-size:14px;line-height:1.45;color:#D7D1E0;text-align:center;min-height:42px;max-width:340px;}
.scan-statut.erreur{color:#E48184;}
.scan-actions{display:flex;gap:10px;width:100%;max-width:420px;margin-top:10px;}
.scan-btn{
  flex:1;position:relative;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;
  padding:13px 10px;border-radius:999px;font-size:14px;font-weight:700;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#FFFFFF;
}

.scan-btn:focus-within,.scan-btn:focus-visible{outline:3px solid rgba(185,138,240,.6);outline-offset:2px;}

.scan-fond.avec-fiche .scan-zone,.scan-fond.avec-fiche .scan-statut,

/* ---------------- photo du repas : Brioche reconnaît l'assiette ----------------
   Le bouton + de la barre ouvre cette feuille. La photo est réduite sur
   l'appareil (1024 px au plus, ce qui suffit à l'IA et coûte moins cher),
   puis envoyée à l'IA qui renvoie les aliments visibles, leur poids estimé et
   leurs macros. Chaque aliment est noté séparément dans le journal : sa
   quantité reste modifiable comme pour une saisie à la main. La photo
   elle-même n'est pas conservée. */

const PHOTO_MODELE = 'claude-sonnet-4-6';
// En ligne, la clé de l'IA ne doit jamais apparaître dans la page : on passe
// par une petite fonction Netlify qui la garde côté serveur.
const PHOTO_RELAIS = '/.netlify/functions/brio-photo';
const PHOTO_ETAPES = ['Repérage des aliments…', 'Estimation des portions…', 'Calcul des calories…', 'Derniers ajustements…'];

let photoRepas = null;

// Limite d'analyses photo : 1 par repas et par jour (chaque analyse a un coût).
// Le compteur repart à zéro chaque jour et survit à la fermeture de l'app.
const PHOTO_LIMITE = 1;
const nomRepas = r => r === 'Petit-déjeuner' ? 'petit-déjeuner' : r.toLowerCase();
function photosUtilisees(repas){
  const q = state.photoQuota;
  return (q && q.jour === todayKey() && q.repas && q.repas[repas]) || 0;
}
async function compterPhoto(repas){
  let q = state.photoQuota;
  if (!q || q.jour !== todayKey()) q = { jour: todayKey(), repas: {} };
  q.repas[repas] = (q.repas[repas] || 0) + 1;
  state.photoQuota = q;
  try { await window.storage.set('photo-quota', JSON.stringify(q), true); } catch(e){}
}

const photoEsc = v => String(v == null ? '' : v).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const photoNombre = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) && n > 0 ? n : 0; };
const photoArrondi = (v, dec) => Math.round(photoNombre(v) * dec) / dec;

// la mascotte seule, sans le mot BRIO
function photoBrioche(classe){
  const img = APP_LOGO_INNER.split('<div class="app-wordmark">')[0];
  return classe ? img.replace('<img ', `<img class="${classe}" `) : img;
}

// repas proposé par défaut selon l'heure
function repasSelonHeure(){
  const h = new Date().getHours();
  if (h < 11) return 'Petit-déjeuner';
  if (h < 15) return 'Déjeuner';
  if (h < 18) return 'Snack';
  return 'Dîner';
}

function ouvrirPhotoRepas(){
  if (document.getElementById('photoFond')) return;
  photoRepas = {
    etape: 'choix',        // choix | analyse | resultat | erreur
    image: null,           // photo réduite (aperçu)
    resultat: null,        // réponse de l'IA
    retires: new Set(),    // aliments écartés par l'utilisateur
    type: repasSelonHeure(),
    erreur: '',
    pasDeRepas: false,
    cycle: null,
    jeton: (photoRepas ? photoRepas.jeton : 0) + 1,
  };
  document.body.insertAdjacentHTML('beforeend', `
    <div class="photo-fond" id="photoFond">
      <div class="photo-sheet" role="dialog" aria-modal="true" aria-labelledby="photoTitre">
        <div class="weight-sheet-handle"></div>
        <div id="photoCorps"></div>
      </div>
    </div>`);
  const fond = document.getElementById('photoFond');
  // sur téléphone : on tire la feuille vers le bas pour la fermer, comme les autres feuilles
  brancherGlisserFermer(fond.querySelector('.photo-sheet'), fond, () => fermerPhotoRepas(true));
  fond.addEventListener('click', e => { if (e.target === fond) fermerPhotoRepas(); });
  document.addEventListener('keydown', photoEchap);
  afficherPhotoRepas();
}

function photoEchap(e){ if (e.key === 'Escape') fermerPhotoRepas(); }

// immediat : la feuille est déjà sortie de l'écran (fermée en glissant), on la retire sans rejouer d'animation
function fermerPhotoRepas(immediat){
  const fond = document.getElementById('photoFond');
  if (!fond || fond.classList.contains('ferme')) return;
  if (photoRepas){ photoRepas.jeton++; clearInterval(photoRepas.cycle); }
  document.removeEventListener('keydown', photoEchap);
  if (immediat === true){ fond.remove(); return; }
  fond.classList.add('ferme');
  setTimeout(() => fond.remove(), 230);
}

function photoBoutonsHtml(){
  return `
    <div class="photo-actions">
      <label class="photo-btn photo-btn-principal">${ICONS.camera}Prendre une photo
        <input class="photo-fichier" type="file" accept="image/*" capture="environment">
      </label>
      <label class="photo-btn">${ICONS.galerie}Choisir dans la galerie
        <input class="photo-fichier" type="file" accept="image/*">
      </label>
    </div>`;
}

function photoTotaux(){
  const r = photoRepas.resultat;
  const gardes = r.aliments.filter((a, i) => !photoRepas.retires.has(i));
  const somme = cle => gardes.reduce((s, a) => s + photoNombre(a[cle]), 0);
  return {
    nb: gardes.length,
    cal: Math.round(somme('calories')),
    prot: Math.round(somme('proteines')),
    carb: Math.round(somme('glucides')),
    fat: Math.round(somme('lipides')),
  };
}

function afficherPhotoRepas(){
  const corps = document.getElementById('photoCorps');
  if (!corps || !photoRepas) return;
  const p = photoRepas;
  clearInterval(p.cycle);

  if (p.etape === 'choix' || p.etape === 'erreur'){
    const erreur = p.etape === 'erreur';
    corps.innerHTML = `
      <div class="photo-mascotte">${photoBrioche()}</div>
      <div class="photo-titre" id="photoTitre">${erreur
        ? (p.pasDeRepas ? 'Pas d\u2019assiette en vue' : 'L\u2019analyse n\u2019a pas abouti')
        : 'Qu\u2019y a-t-il dans ton assiette&nbsp;?'}</div>
      ${erreur
        ? `<div class="photo-sous"></div><div class="photo-erreur">${photoEsc(p.erreur)}</div>`
        : `<div class="photo-sous">Prends ton repas en photo&nbsp;: Brioche reconnaît les aliments et estime leurs calories.</div>`}
      <div class="photo-sec photo-sec-choix">Pour quel repas&nbsp;?</div>
      <div class="photo-types photo-types-choix">
        ${MEAL_TYPES.map(mt => {

// Réduit la photo avant l'envoi : 1024 px sur le plus grand côté, en JPEG.
function reduirePhoto(fichier, max = 1024){
  return new Promise((ok, ko) => {
    const lecteur = new FileReader();
    lecteur.onerror = () => ko(new Error('lecture'));
    lecteur.onload = () => {
      const img = new Image();
      img.onerror = () => ko(new Error('image'));
      img.onload = () => {
        const r = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement('canvas');
        c.width = Math.round(img.naturalWidth * r);
        c.height = Math.round(img.naturalHeight * r);
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        ok(c.toDataURL('image/jpeg', 0.82));
      };
      img.src = lecteur.result;
    };
    lecteur.readAsDataURL(fichier);
  });
}

async function lancerAnalysePhoto(fichier){
  if (!fichier || !photoRepas) return;
  if (photosUtilisees(photoRepas.type) >= PHOTO_LIMITE){ afficherPhotoRepas(); return; }
  const repasCompte = photoRepas.type;
  const jeton = photoRepas.jeton;
  let image;
  try { image = await reduirePhoto(fichier); }
  catch(e){ return photoErreur('Cette image n\u2019a pas pu être ouverte. Essaie avec une autre photo (JPEG ou PNG).'); }
  if (!photoRepas || photoRepas.jeton !== jeton) return;

  photoRepas.image = image;
  photoRepas.etape = 'analyse';
  afficherPhotoRepas();

  try {
    const res = await analyserPhoto(image.split(',')[1]);
    const aliments = Array.isArray(res.aliments)
      ? res.aliments.filter(a => a && a.nom).map(a => ({
          nom: String(a.nom).replace(/[<>]/g, '').trim(),
          grammes: photoNombre(a.grammes),
          calories: photoNombre(a.calories),
          proteines: photoNombre(a.proteines),
          glucides: photoNombre(a.glucides),
          lipides: photoNombre(a.lipides),
        }))
      : [];
    // Seule une photo où Brioche a vraiment reconnu un repas est décomptée :
    // une photo sans assiette (ou sans aliment reconnu) laisse le compteur intact.
    const repasVu = res.repas !== false && aliments.length > 0;
    if (repasVu) compterPhoto(repasCompte);
    if (!photoRepas || photoRepas.jeton !== jeton) return;   // feuille fermée entre-temps
    if (!repasVu){
      return photoErreur(res.message || 'Brioche ne voit pas de repas sur cette photo. Cadre l\u2019assiette de plus près, avec un peu de lumière.', true);
    }
    photoRepas.resultat = { ...res, aliments };
    photoRepas.retires = new Set();
    photoRepas.etape = 'resultat';
    afficherPhotoRepas();
  } catch(e){
    if (!photoRepas || photoRepas.jeton !== jeton) return;
    photoErreur(messageHumain(e));
  }
}

async function analyserPhoto(base64){
  const objectif = state.macroGoals && state.macroGoals.calories;
  const consigne = `Tu es Brioche, l'assistant nutrition de l'app BRIO. Analyse cette photo de repas.
Réponds UNIQUEMENT avec un objet JSON valide, sans aucun texte autour ni balise Markdown, de cette forme :
{"repas":true,"plat":"nom court du plat","description":"…","confiance":"haute","aliments":[{"nom":"Riz basmati cuit","grammes":150,"calories":195,"proteines":4.1,"glucides":42.3,"lipides":0.5}],"remarque":"…"}
Règles :
- "plat" : nom court et naturel du plat, en français (ex : "Poulet rôti, riz et haricots verts").
- "description" : une ou deux phrases qui décrivent ce qu'on voit dans l'assiette (aliments, cuisson, sauce, accompagnements).
- "aliments" : chaque aliment ou composant visible séparément, y compris sauces, fromage et matières grasses visibles. Pour chacun : un nom court en français (avec la cuisson si utile), une estimation réaliste du poids en grammes de la portion visible (utilise l'assiette et les couverts comme repères), et les valeurs pour ce poids : kcal, grammes de protéines, glucides et lipides.
- "confiance" : "haute" si aliments et portions sont clairs, "moyenne" si les portions sont difficiles à juger, "faible" si l'image est floue ou ambiguë.
- "remarque" : une phrase courte et bienveillante, qui tutoie, sur l'équilibre du repas${objectif ? ` (son objectif est de ${objectif} kcal par jour)` : ''}. Jamais culpabilisante.
- S'il n'y a pas de nourriture sur la photo, réponds : {"repas":false,"message":"une phrase courte qui dit ce que tu vois à la place"}`;

  const corps = {
    model: PHOTO_MODELE,
    max_tokens: 1000,
    messages: [{
      role: 'user',
      content: [
        { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: base64 } },
        { type: 'text', text: consigne },
      ],
    }],
  };

  const adresse = window.__brioEnLigne ? PHOTO_RELAIS : 'https://api.anthropic.com/v1/messages';
  let reponse;
  try {
    reponse = await fetch(adresse, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corps) });
  } catch(e){
    throw erreurLisible('Pas de connexion : l\u2019analyse de la photo a besoin d\u2019internet.');
  }
  if (window.__brioEnLigne && reponse.status === 404){
    throw erreurLisible('L\u2019analyse photo n\u2019est pas encore branchée sur la version en ligne de BRIO (fonction Netlify « brio-photo » introuvable).');
  }
  if (!reponse.ok) throw erreurLisible(`Brioche n\u2019a pas pu analyser la photo (erreur ${reponse.status}). Réessaie dans un instant.`);

  const data = await reponse.json();
  const texte = (data.content || []).map(b => b.type === 'text' ? b.text : '').join('');
  const propre = texte.replace(/```json|```/g, '').trim();
  try {
    return JSON.parse(propre.slice(propre.indexOf('{'), propre.lastIndexOf('}') + 1));
  } catch(e){
    throw erreurLisible('La réponse de Brioche était illisible. Réessaie avec la même photo.');
  }
}

// Aliment réduit à ce qui compte : valeurs pour 100 g (ou 100 ml) + portion
function alimentPropre(f){
  const a = { name: f.name, cal: f.cal, prot: f.prot, carb: f.carb, fat: f.fat, cat: f.cat || '', unite: foodUnit(f) };
  if (f.portion){ a.portion = f.portion; a.portionLabel = f.portionLabel || '1 portion'; }
  if (f.code) a.code = f.code;
  return a;
}

// Récents : les derniers aliments différents notés dans le journal.
// Les valeurs pour 100 g viennent de l'aliment choisi (base), de la base
// intégrée, ou à défaut sont recalculées à partir de la quantité notée.
function alimentsRecents(max = 15){
  const vus = new Set();
  const out = [];
  const liste = [...(state.entries.repas || [])].sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
  for (const e of liste){
    const f = e.fields || {};
    const nom = (f.description || '').trim();
    if (!nom) continue;
    const k = normFood(nom).trim();
    if (vus.has(k)) continue;
    let a = null;
    if (f.base) a = { ...f.base, name: nom };
    else {
      const db = FOOD_DB.find(x => normFood(x.name).trim() === k);
      if (db) a = db;
      else {
        const q = parseFloat(f.quantite);
        if (q > 0){
          const r = 100 / q;
          const arr = v => Math.round((parseFloat(v) || 0) * r * 10) / 10;
          a = { name: nom, cal: Math.round((parseFloat(f.calories) || 0) * r), prot: arr(f.proteines), carb: arr(f.glucides), fat: arr(f.lipides),
                cat: f.source === 'photo' ? 'Depuis une photo' : 'Déjà noté', unite: f.unite || 'g' };
        }
      }
    }
    if (!a) continue;
    vus.add(k);
    out.push(a);
    if (out.length >= max) break;
  }
  return out;
}

// Ajoute ou retire un favori ; renvoie true si l'aliment vient d'être ajouté

/* --- Open Food Facts : base de données alimentaire gratuite et collaborative --- */
// Lecture d'une fiche Open Food Facts (même format en v0 et v2)
function lireProduitOFF(d, code){
  if (!d || d.status !== 1 || !d.product) return null;
  const p = d.product;
  const n = p.nutriments || {};
  const nom = String(p.product_name_fr || p.product_name || p.generic_name_fr || '').replace(/[<>]/g, '').trim();
  let cal = parseFloat(n['energy-kcal_100g']);
  if (!isFinite(cal) && isFinite(parseFloat(n['energy_100g']))) cal = parseFloat(n['energy_100g']) / 4.184; // kJ → kcal
  if (!isFinite(cal)) return { incomplet: true, name: nom };
  const r1 = v => Math.round((parseFloat(v) || 0) * 10) / 10;
  const produit = {
    name: nom || `Produit ${code}`,
    cal: Math.round(cal), prot: r1(n.proteins_100g), carb: r1(n.carbohydrates_100g), fat: r1(n.fat_100g),
    cat: String(p.brands || '').split(',')[0].trim() || 'Produit scanné',
    unite: /\d\s*(ml|cl|l)\b/i.test(String(p.quantity || '')) ? 'ml' : 'g',
    code,
  };
  const portion = parseFloat(p.serving_quantity);
  if (portion > 0 && portion < 2000){ produit.portion = Math.round(portion); produit.portionLabel = libellePortion(p.serving_size); }
  const nb = v => { const x = parseFloat(v); return isFinite(x) ? Math.round(x * 10) / 10 : null; };
  produit.details = {
    image: /^https:\/\//.test(p.image_front_small_url || '') ? p.image_front_small_url : '',
    description: String(p.generic_name_fr || p.generic_name || '').replace(/[<>]/g, '').trim(),
    contenance: String(p.quantity || '').replace(/[<>]/g, '').trim(),
    nutriscore: /^[a-e]$/.test(p.nutriscore_grade || '') ? p.nutriscore_grade : '',
    sucres: nb(n.sugars_100g), satures: nb(n['saturated-fat_100g']), fibres: nb(n.fiber_100g), sel: nb(n.salt_100g),
  };
  return produit;
}

// « 1 canette (330 ml) » → libellé court pour le bouton de portion
function libellePortion(txt){
  const t = String(txt || '').replace(/[<>]/g, '').replace(/\s*\(.*\)\s*/g, '').trim();
  return t && t.length <= 22 && !/^\d+([.,]\d+)?\s*(g|ml|cl|l)$/i.test(t) ? t : '1 portion';
}

// Plan B dans Claude : l'aperçu bloque souvent les sites extérieurs. On
// demande alors à l'IA de retrouver la fiche du produit par une recherche web.
// Renvoie undefined si l'IA elle-même est injoignable.
async function produitParIA(code){
  const consigne = `Trouve le produit alimentaire dont le code-barres (EAN/UPC) est exactement ${code}. Cherche en priorité sa fiche sur Open Food Facts.
Réponds UNIQUEMENT avec un objet JSON, sans texte autour ni balises Markdown :
{"trouve":true,"nom":"nom du produit en français","marque":"marque","description":"description courte du produit","contenance":"ex : 33 cl","kcal_100g":0,"proteines_100g":0,"glucides_100g":0,"sucres_100g":0,"lipides_100g":0,"satures_100g":0,"fibres_100g":null,"sel_100g":0,"nutriscore":"a à e ou vide","liquide":false,"portion_g":null,"portion_libelle":"ex : 1 canette"}
"liquide" vaut true si les valeurs sont données pour 100 ml. "portion_g" : quantité d'une portion indiquée sur l'emballage (g ou ml), ou null. Mets null pour une valeur que tu ne trouves pas.
N'invente jamais : si tu ne trouves pas de source fiable pour ce code exact, réponds {"trouve":false}.`;
  let rep;
  try {
    rep = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6', max_tokens: 1000,
        messages: [{ role: 'user', content: consigne }],
        tools: [{ type: 'web_search_20250305', name: 'web_search' }],
      }),
    });
  } catch(e){ return undefined; }
  if (!rep.ok) return undefined;
  const data = await rep.json();
  const texte = (data.content || []).map(b => b.type === 'text' ? b.text : '').join('');
  const propre = texte.replace(/```json|```/g, '');
  let j;
  try { j = JSON.parse(propre.slice(propre.indexOf('{'), propre.lastIndexOf('}') + 1)); }
  catch(e){ return null; }
  if (!j || !j.trouve || !isFinite(parseFloat(j.kcal_100g))) return null;
  const r1 = v => Math.round((parseFloat(v) || 0) * 10) / 10;
  const produit = {
    name: String(j.nom || `Produit ${code}`).replace(/[<>]/g, '').trim(),
    cal: Math.round(parseFloat(j.kcal_100g)), prot: r1(j.proteines_100g), carb: r1(j.glucides_100g), fat: r1(j.lipides_100g),
    cat: String(j.marque || 'Produit scanné').replace(/[<>]/g, '').trim(),
    unite: j.liquide ? 'ml' : 'g',
    code,
  };
  const portion = parseFloat(j.portion_g);
  if (portion > 0 && portion < 2000){ produit.portion = Math.round(portion); produit.portionLabel = libellePortion(j.portion_libelle); }
  const nb = v => { const x = parseFloat(v); return isFinite(x) ? Math.round(x * 10) / 10 : null; };
  const txt = v => String(v || '').replace(/[<>]/g, '').trim();
  produit.details = {
    image: '', description: txt(j.description), contenance: txt(j.contenance),
    nutriscore: /^[a-e]$/i.test(j.nutriscore || '') ? j.nutriscore.toLowerCase() : '',
    sucres: nb(j.sucres_100g), satures: nb(j.satures_100g), fibres: nb(j.fibres_100g), sel: nb(j.sel_100g),
  };
  return produit;
}

async function chercherProduit(code){
  const c = encodeURIComponent(code);
  const adresses = [
    `https://world.openfoodfacts.org/api/v2/product/${c}.json?fields=product_name,product_name_fr,generic_name,generic_name_fr,brands,nutriments,serving_quantity,serving_size,quantity,image_front_small_url,nutriscore_grade`,
    `https://fr.openfoodfacts.org/api/v0/product/${c}.json`,
  ];
  let derniere = null;
  for (const url of adresses){
    let rep;
    try { rep = await fetch(url); }
    catch(e){ derniere = e; continue; }          // bloqué ou pas de réseau : adresse suivante
    if (rep.status === 404) return null;         // la base a répondu : produit inconnu
    if (!rep.ok){ derniere = new Error('HTTP ' + rep.status); continue; }
    try { return lireProduitOFF(await rep.json(), code); }
    catch(e){ derniere = e; }
  }
  if (!window.__brioEnLigne){
    const p = await produitParIA(code);
    if (p !== undefined) return p;
  }
  const err = new Error('injoignable');
  err.detail = derniere;
  throw err;
}

/* --- lecture du code-barres ---
   1. détecteur intégré au navigateur quand il existe (Chrome sur Android) ;
   2. sinon la bibliothèque ZXing, chargée à la première utilisation (iPhone). */
const ZXING_URL = 'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
let zxingPromesse = null;
function chargerZXing(){
  if (window.ZXing) return Promise.resolve(window.ZXing);
  if (!zxingPromesse){
    zxingPromesse = new Promise((ok, ko) => {
      const s = document.createElement('script');
      s.src = ZXING_URL;
      s.async = true;
      s.onload = () => window.ZXing ? ok(window.ZXing) : ko(new Error('lecteur absent'));
      s.onerror = () => { zxingPromesse = null; ko(new Error('lecteur non chargé')); };
      document.head.appendChild(s);
    });
  }
  return zxingPromesse;
}
const FORMATS_CODES = ['ean_13', 'ean_8', 'upc_a', 'upc_e'];
async function detecteurNatif(){
  if (!('BarcodeDetector' in window)) return null;
  try {
    const dispo = await BarcodeDetector.getSupportedFormats();
    const formats = FORMATS_CODES.filter(f => dispo.includes(f));
    return formats.length ? new BarcodeDetector({ formats }) : null;
  } catch(e){ return null; }
}
function lecteurZXing(Z){
  const indices = new Map();
  indices.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.UPC_A, Z.BarcodeFormat.UPC_E]);
  indices.set(Z.DecodeHintType.TRY_HARDER, true);
  return new Z.BrowserMultiFormatReader(indices);
}

let scan = null;

function ouvrirScanner(options){
  if (document.getElementById('scanFond')) return;
  scan = { repas: (options && options.repas) || repasSelonHeure(), flux: null, lecteur: null, boucle: null, fini: false, occupe: false };
  document.body.insertAdjacentHTML('beforeend', `
    <div class="scan-fond" id="scanFond" role="dialog" aria-modal="true" aria-labelledby="scanTitre">
      <div class="scan-haut">
        <div class="scan-titre" id="scanTitre">Scanner un produit</div>
        <button class="scan-fermer" id="scanFermer" aria-label="Fermer">×</button>
      </div>
      <div class="scan-zone" id="scanZone">
        <video id="scanVideo" playsinline muted autoplay></video>
        <div class="scan-cadre"><span class="scan-laser"></span></div>
        <div class="scan-sans-camera">${ICONS.codeBarres}</div>
      </div>
      <div class="scan-statut" id="scanStatut" aria-live="polite">Ouverture de la caméra…</div>
      <div class="scan-actions">
        <label class="scan-btn">${ICONS.camera}Photo du code
          <input class="photo-fichier" id="scanPhoto" type="file" accept="image/*" capture="environment">
        </label>
        <button class="scan-btn" id="scanManuelBtn">Saisir le code</button>
      </div>
      <div class="scan-manuel" id="scanManuel" hidden>
        <input id="scanCode" inputmode="numeric" pattern="[0-9]*" maxlength="14" placeholder="Ex : 3017620422003" aria-label="Chiffres du code-barres">
        <button id="scanChercher">Chercher</button>
      </div>
      <div class="scan-fiche" id="scanFiche" hidden></div>
      <div class="scan-source">Données produits : Open Food Facts</div>
    </div>`);
  document.getElementById('scanFermer').onclick = fermerScanner;
  document.addEventListener('keydown', scanEchap);
  document.getElementById('scanManuelBtn').onclick = () => {
    const bloc = document.getElementById('scanManuel');
    bloc.hidden = false;
    document.getElementById('scanCode').focus();
  };
  const lancerManuel = () => {
    const code = document.getElementById('scanCode').value.replace(/\D/g, '');
    if (!/^\d{8,14}$/.test(code)){ scanStatut('Un code-barres compte 8 à 14 chiffres.', true); return; }
    codeTrouve(code);
  };
  document.getElementById('scanChercher').onclick = lancerManuel;
  document.getElementById('scanCode').onkeydown = e => { if (e.key === 'Enter') lancerManuel(); };
  document.getElementById('scanPhoto').onchange = e => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (f) lirePhotoCode(f);
  };
  demarrerCamera();
}

function scanEchap(e){ if (e.key === 'Escape') fermerScanner(); }

function scanStatut(texte, erreur){
  const el = document.getElementById('scanStatut');
  if (!el) return;
  el.textContent = texte;
  el.classList.toggle('erreur', !!erreur);
}

function sansCamera(message){
  const zone = document.getElementById('scanZone');
  if (zone) zone.classList.add('sans-camera');
  scanStatut(message, true);
}

async function demarrerCamera(){
  const video = document.getElementById('scanVideo');
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    return sansCamera('Caméra indisponible ici. Prends le code en photo ou saisis ses chiffres.');
  }
  const contraintes = { video: { facingMode: { ideal: 'environment' } }, audio: false };
  try {
    const natif = await detecteurNatif();
    if (!scan || scan.fini) return;
    if (natif){
      scan.flux = await navigator.mediaDevices.getUserMedia(contraintes);
      if (!scan || scan.fini){ scan && scan.flux && scan.flux.getTracks().forEach(t => t.stop()); return; }
      video.srcObject = scan.flux;
      await video.play().catch(() => {});
      scanStatut('Place le code-barres dans le cadre');
      const tour = async () => {
        if (!scan || scan.fini) return;
        try {
          const codes = await natif.detect(video);
          if (codes.length && codes[0].rawValue) return codeTrouve(codes[0].rawValue);
        } catch(e){}
        scan.boucle = setTimeout(tour, 180);
      };
      tour();
    } else {
      scanStatut('Préparation du lecteur…');
      const Z = await chargerZXing();
      if (!scan || scan.fini) return;
      scan.lecteur = lecteurZXing(Z);
      await scan.lecteur.decodeFromConstraints(contraintes, video, res => {
        if (res && scan && !scan.fini) codeTrouve(res.getText());
      });
      if (scan && !scan.fini) scanStatut('Place le code-barres dans le cadre');
    }
  } catch(e){
    if (!scan || scan.fini) return;
    const refus = e && (e.name === 'NotAllowedError' || e.name === 'SecurityError');
    sansCamera(refus
      ? 'L\u2019accès à la caméra est bloqué. Autorise-le dans les réglages du navigateur, ou prends le code en photo.'
      : 'Caméra indisponible ici. Prends le code en photo ou saisis ses chiffres.');
  }
}

function arreterCamera(){
  if (!scan) return;
  scan.fini = true;
  clearTimeout(scan.boucle);
  try { if (scan.lecteur) scan.lecteur.reset(); } catch(e){}
  if (scan.flux) scan.flux.getTracks().forEach(t => t.stop());
  const video = document.getElementById('scanVideo');
  if (video && video.srcObject){ video.srcObject.getTracks().forEach(t => t.stop()); video.srcObject = null; }
}

function fermerScanner(){
  arreterCamera();
  document.removeEventListener('keydown', scanEchap);
  const fond = document.getElementById('scanFond');
  if (fond) fond.remove();
  scan = null;
}

async function lirePhotoCode(fichier){
  if (!scan) return;
  scanStatut('Lecture de la photo…');
  try {
    let code = null;
    const natif = await detecteurNatif();
    if (natif){
      const img = await createImageBitmap(fichier);
      const codes = await natif.detect(img);
      code = codes.length ? codes[0].rawValue : null;
    } else {
      const Z = await chargerZXing();
      const url = URL.createObjectURL(fichier);
      try { code = (await lecteurZXing(Z).decodeFromImageUrl(url)).getText(); }
      catch(e){ code = null; }
      finally { URL.revokeObjectURL(url); }
    }
    if (!scan) return;
    if (!code) return scanStatut('Aucun code lisible sur la photo. Rapproche-toi du code et évite les reflets.', true);
    codeTrouve(code);
  } catch(e){
    if (scan) scanStatut('Impossible de lire cette photo. Saisis plutôt les chiffres du code.', true);
  }
}

async function codeTrouve(code){
  if (!scan || scan.occupe) return;
  scan.occupe = true;
  arreterCamera();
  if (navigator.vibrate) navigator.vibrate(60);
  scanStatut(`Code ${code} · recherche du produit…`);
  let produit;
  try { produit = await chercherProduit(code); }
  catch(e){
    if (!scan) return;
    scan.occupe = false;
    const hors = navigator.onLine === false;
    const d = e && e.detail ? ` (${(e.detail.name || '')} ${(e.detail.message || '')})`.replace(/\s+\)/, ')') : '';
    return scanStatut(hors
      ? 'Pas de connexion internet : la recherche du produit en a besoin.'
      : (window.__brioEnLigne
          ? 'Open Food Facts ne répond pas pour le moment. Réessaie dans un instant.' + d
          : 'Dans cet aperçu de Claude, la recherche de produits est bloquée. Elle fonctionne sur la version en ligne de BRIO.' + d), true);
  }
  if (!scan) return;
  scan.occupe = false;
  if (!produit){
    return scanStatut(`Produit ${code} introuvable dans Open Food Facts. Tu peux le chercher par son nom.`, true);
  }
  if (produit.incomplet){
    return scanStatut(`${produit.name || 'Ce produit'} n\u2019a pas encore de valeurs nutritionnelles dans Open Food Facts.`, true);
  }
  afficherFiche(produit);
}

/* --- fiche produit : description, apports, quantité, puis validation --- */
function afficherFiche(produit){
  const fond = document.getElementById('scanFond');
  const fiche = document.getElementById('scanFiche');
  if (!fond || !fiche) return;
  fond.classList.add('avec-fiche');
  fiche.hidden = false;
  document.getElementById('scanTitre').textContent = 'Produit trouvé';

  const d = produit.details || {};
  const u = foodUnit(produit);
  const liquide = u === 'ml';
  const v = x => (x == null || x === '') ? '—' : fmtMacro(x);
  // quantités proposées : la portion de l'emballage d'abord
  const choix = [];
  if (produit.portion) choix.push({ q: produit.portion, label: `${produit.portionLabel || '1 portion'} · ${produit.portion} ${u}` });
  (liquide ? [250, 330, 500] : [30, 100, 150]).forEach(q => { if (!choix.some(c => c.q === q)) choix.push({ q, label: `${q} ${u}` }); });
  let quantite = produit.portion || (liquide ? 250 : 100);

  const vignette = d.image
    ? `<img class="fiche-img" src="${echapperTexte(d.image)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'fiche-img fiche-img-vide',textContent:'${liquide ? '🥤' : '🍽️'}'}))">`
    : `<div class="fiche-img fiche-img-vide">${liquide ? '🥤' : '🍽️'}</div>`;
  const sousTitre = [produit.cat, d.contenance].filter(Boolean).map(echapperTexte).join(' · ');

  fiche.innerHTML = `
    <div class="fiche-tete">
      ${vignette}
      <div class="fiche-noms">
        <div class="fiche-nom">${echapperTexte(produit.name)}</div>
        ${sousTitre ? `<div class="fiche-marque">${sousTitre}</div>` : ''}
      </div>
      ${d.nutriscore ? `<div class="fiche-nutriscore ns-${d.nutriscore}" title="Nutri-Score ${d.nutriscore.toUpperCase()}"><small>Nutri-Score</small>${d.nutriscore.toUpperCase()}</div>` : ''}
    </div>
    ${d.description ? `<p class="fiche-desc">${echapperTexte(d.description)}</p>` : ''}

    <div class="fiche-sec">Valeurs nutritionnelles · pour 100 ${u}</div>
    <div class="fiche-nutri">
      <div class="fn-ligne fn-fort"><span>Énergie</span><b>${produit.cal} kcal</b></div>
      <div class="fn-ligne"><span>Protéines</span><b>${v(produit.prot)} g</b></div>
      <div class="fn-ligne"><span>Glucides</span><b>${v(produit.carb)} g</b></div>
      <div class="fn-ligne fn-sous"><span>dont sucres</span><b>${v(d.sucres)} g</b></div>
      <div class="fn-ligne"><span>Lipides</span><b>${v(produit.fat)} g</b></div>
      <div class="fn-ligne fn-sous"><span>dont acides gras saturés</span><b>${v(d.satures)} g</b></div>
      ${d.fibres != null ? `<div class="fn-ligne"><span>Fibres</span><b>${v(d.fibres)} g</b></div>` : ''}
      ${d.sel != null ? `<div class="fn-ligne"><span>Sel</span><b>${v(d.sel)} g</b></div>` : ''}
    </div>

    <div class="fiche-sec">Quantité</div>
    <div class="fiche-quantites">
      ${choix.map(c => `<button type="button" class="fiche-chip" data-q="${c.q}">${echapperTexte(c.label)}</button>`).join('')}
    </div>
    <label class="fiche-saisie">
      <input type="number" id="ficheQte" min="1" inputmode="decimal" value="${quantite}" aria-label="Quantité en ${u}">
      <span>${u}</span>
    </label>

    <div class="fiche-apport" id="ficheApport" aria-live="polite"></div>

    <div class="fiche-sec">Ajouter à</div>
    <div class="fiche-types">
      ${MEAL_TYPES.map(mt => `<button type="button" class="fiche-type" data-type="${mt}"><span>${MEAL_ICONS[mt] || ''}</span>${mt === 'Petit-déjeuner' ? 'Petit-déj' : mt}</button>`).join('')}
    </div>

    <button class="btn-primary fiche-valider" id="ficheValider"></button>
    <button class="fiche-autre" id="ficheAutre">Scanner un autre produit</button>`;

  const champ = document.getElementById('ficheQte');
  const majApport = () => {
    const q = parseFloat(champ.value) || 0;
    quantite = q;
    const r = q / 100;
    const arr = x => fmtMacro(Math.round((parseFloat(x) || 0) * r * 10) / 10);
    document.getElementById('ficheApport').innerHTML = q > 0 ? `
      <div class="fa-titre">Pour ${fmtMacro(q)} ${u}</div>
      <div class="fa-kcal">${Math.round(produit.cal * r)}<small>kcal</small></div>
      <div class="fa-macros">
        <span class="fa-m fa-prot"><b>${arr(produit.prot)} g</b>Protéines</span>
        <span class="fa-m fa-carb"><b>${arr(produit.carb)} g</b>Glucides</span>
        <span class="fa-m fa-fat"><b>${arr(produit.fat)} g</b>Lipides</span>
      </div>` : `<div class="fa-titre">Indique une quantité</div>`;
    fiche.querySelectorAll('.fiche-chip').forEach(b => b.classList.toggle('actif', +b.dataset.q === q));
    document.getElementById('ficheValider').disabled = !(q > 0);
  };
  const majRepas = () => {
    fiche.querySelectorAll('.fiche-type').forEach(b => {
      const on = b.dataset.type === scan.repas;
      b.classList.toggle('actif', on);
      b.setAttribute('aria-pressed', on);
    });
    document.getElementById('ficheValider').textContent = `Ajouter au ${scan.repas === 'Petit-déjeuner' ? 'petit-déjeuner' : scan.repas.toLowerCase()}`;
  };
  fiche.querySelectorAll('.fiche-chip').forEach(b => b.onclick = () => { champ.value = b.dataset.q; majApport(); });
  champ.oninput = majApport;
  fiche.querySelectorAll('.fiche-type').forEach(b => b.onclick = () => { scan.repas = b.dataset.type; majRepas(); });
  document.getElementById('ficheValider').onclick = () => {
    if (!(quantite > 0)) return;
    const repas = scan.repas;
    fermerScanner();
    ajouterAliment(produit, quantite, repas);
  };
  document.getElementById('ficheAutre').onclick = () => {
    fiche.hidden = true;
    fiche.innerHTML = '';
    fond.classList.remove('avec-fiche');
    document.getElementById('scanTitre').textContent = 'Scanner un produit';
    const zone = document.getElementById('scanZone');
    zone.classList.remove('sans-camera');
    scan.fini = false;
    scan.occupe = false;
    scanStatut('Ouverture de la caméra…');
    demarrerCamera();
  };
  majApport();
  majRepas();
  fond.scrollTop = 0;
}

// Ajout direct d'un aliment au journal du jour affiché, avec l'animation
// habituelle des anneaux et des chiffres.
async function ajouterAliment(f, quantite, repas){
  const r = quantite / 100;
  const arr = x => String(Math.round((parseFloat(x) || 0) * r * 10) / 10);
  const entry = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    date: state.viewDate || todayKey(),
    timestamp: Date.now(),
    fields: {
      type: repas, description: f.name,
      calories: String(Math.round(f.cal * r)), proteines: arr(f.prot), glucides: arr(f.carb), lipides: arr(f.fat),
      quantite: String(quantite), unite: foodUnit(f),
      base: alimentPropre(f),
    },
  };
  state.entries.repas = state.entries.repas || [];
  state.repasAddingMeal = null;
  state.repasAlimentChoisi = null;
  if (state.screen === 'category'){
    const anneaux = captureRingOffsets();
    const nombres = captureCardNumbers();
    state.entries.repas.push(entry);
    dayFlip = false;
    navFade = false;
    renderRepasDashboard();
    animateRingsFillFrom(anneaux);
    animateCardNumbersFrom(nombres);
  } else {
    state.entries.repas.push(entry);
    render();
  }
  showToast(`Ajouté au ${repas === 'Petit-déjeuner' ? 'petit-déjeuner' : repas.toLowerCase()}`);
  try { await window.storage.set('entries:repas', JSON.stringify(state.entries.repas), true); }
  catch(e){ showToast('Erreur de sauvegarde'); }
}

  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
